  }
  meshCache[shape]=mb;
  return mb;
}

/* ── shading ── */

const LIGHT=[0.16,0.94,0.30];        // sodium floods, mostly overhead
const EMISSIVE={lamp:1,tail:1};
const MATCOL={dark:[22,26,32], glass:[15,20,28], tyre:[17,19,23],
              rim:[92,100,110], spoke:[138,146,158], lamp:[255,242,206], tail:[214,48,36]};

function matColor(c,m){
  if(m==="tail"&&c.speed<-2) return [236,240,246];   // reversing lamps
  return m==="body" ? c.rgb : m==="accent" ? c.arb : MATCOL[m];
}

function shadeFace(N,V,base,fog){
  const dif=Math.max(0,N[0]*LIGHT[0]+N[1]*LIGHT[1]+N[2]*LIGHT[2]);
  let col=shade(base,AMB+DIFK*dif);
  col=mix(col,WARM,WARMK*Math.max(0,N[1])*dif);               // light from above
  col=mix(col,COOL,COOLK*(1-Math.max(0,N[1])));               // sky fill on the flanks
  const hx=LIGHT[0]+V[0], hy=LIGHT[1]+V[1], hz=LIGHT[2]+V[2];
  const hl=Math.hypot(hx,hy,hz)||1;
  const sp=Math.pow(Math.max(0,(N[0]*hx+N[1]*hy+N[2]*hz)/hl),28);
  col=mix(col,SPEC,sp*0.6);                          // clearcoat
  return mix(col,HAZE,fog);
}

function collectMesh(out,glows,mb,c,fog,wantGlow){
  const co=Math.cos(c.ang), si=Math.sin(c.ang);
  const rc=Math.cos(c.roll||0), rs=Math.sin(c.roll||0);
  const pc=Math.cos(c.pitch||0), ps=Math.sin(c.pitch||0);
  const glowSeen=new Set();      // collapses one lamp box's six faces into a single glow
  // pitch about the lateral axis, then roll about the long axis, then yaw
  const place=(vx,vy,vz)=>{
    const lx=vx*pc-vz*ps;
    let lz=vx*ps+vz*pc;
    const ly=vy*rc-lz*rs;
    lz=vy*rs+lz*rc;
    return [c.x+lx*co-ly*si, lz+c.z, c.y+lx*si+ly*co];
  };
  const W=mb.v.map(v=>place(v[0],v[1],v[2]));
  const ctr=place(0,0,9);

  for(const f of mb.f){
    const P=f.v.map(i=>W[i]);
    let cx=0,cy=0,cz=0;
    for(const q of P){ cx+=q[0]; cy+=q[1]; cz+=q[2]; }
    const n=P.length; cx/=n; cy/=n; cz/=n;

    const ux=P[1][0]-P[0][0], uy=P[1][1]-P[0][1], uz=P[1][2]-P[0][2];
    const vx=P[2][0]-P[0][0], vy=P[2][1]-P[0][1], vz=P[2][2]-P[0][2];
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;

    // orient outward from the part's own centre, then cull
    let rx=ctr[0], ry=ctr[1], rz=ctr[2];
    if(f.ref){ const r=place(f.ref[0],f.ref[1],f.ref[2]); rx=r[0]; ry=r[1]; rz=r[2]; }
    if((cx-rx)*nx+(cy-ry)*ny+(cz-rz)*nz<0){ nx=-nx; ny=-ny; nz=-nz; }

    let vX=EYE[0]-cx, vY=EYE[1]-cy, vZ=EYE[2]-cz;
    const vl=Math.hypot(vX,vY,vZ)||1; vX/=vl; vY/=vl; vZ/=vl;
    if(nx*vX+ny*vY+nz*vZ<=0.02) continue;

    const base=matColor(c,f.m);
    const style=EMISSIVE[f.m]
      ? rgbs(mix(base,HAZE,fog*0.55))
      : rgbs(shadeFace([nx,ny,nz],[vX,vY,vZ],base,fog));

    const poly=P.map(q=>toCam(q[0],q[1],q[2]));
    let z=0; for(const q of poly) z+=q[2]; z/=poly.length;
    out.push({poly,z,style});

    if(wantGlow&&EMISSIVE[f.m]&&glows){
      const g=toCam(cx,cy,cz);
      if(g[2]>NEAR){
        // a lamp box is six separate faces — without this, each one that's
        // visible pushes its own glow, turning one headlight into a small
        // cluster of orbs instead of a single light
        const key=Math.round(cx/3)+","+Math.round(cy/3)+","+Math.round(cz/3);
        if(!glowSeen.has(key)){ glowSeen.add(key); glows.push({c:g, warm:f.m==="lamp", fog}); }
      }
    }
  }
}

function carDecals(c){
  if(Math.abs(Math.sin(c.roll||0))>0.35) return;
  const s=SHAPE[c.shape];
  const co=Math.cos(c.ang), si=Math.sin(c.ang);
  const P=(fx,fy)=>[c.x+fx*co-fy*si, c.y+fx*si+fy*co];

  // light thrown onto the tarmac
  const gz=c.gz||0, lift=Math.min(1,(c.z-gz)/60);
  ground(P(s.l,-s.w*0.9),P(s.l+165,-s.l*1.6),P(s.l+165,s.l*1.6),P(s.l,s.w*0.9),
         "rgba(255,238,196,"+(0.06*LAMPA)+")",gz+0.6);
  ground(P(-s.l,-s.w),P(-s.l-52,-s.w*1.6),P(-s.l-52,s.w*1.6),P(-s.l,s.w),
         "rgba(210,50,38,"+(0.11*Math.max(0.3,LAMPA))+")",gz+0.55);
  // nitro throws its own blue wash further back than the taillights
  if(c.nitroT>0.02){
    const n=c.nitroT;
    ground(P(-s.l,-s.w*0.7),P(-s.l-90,-s.w*2.2),P(-s.l-90,s.w*2.2),P(-s.l,s.w*0.7),
           "rgba(130,180,255,"+(0.16*n)+")",gz+0.5);
  }
  // shadow shrinks and fades as the car leaves the ground
  const sh=1+lift*0.9;
  ground(P(s.l*sh,-(s.w+2)*sh),P(s.l*sh,(s.w+2)*sh),P(-s.l*sh,(s.w+2)*sh),P(-s.l*sh,-(s.w+2)*sh),
         "rgba(0,0,0,"+(SHADOWA*(1-lift*0.75))+")",gz+0.25);
}

// A brief chromatic-aberration duplicate of the car itself — a real,
// correctly-shaped ghost of the actual mesh, split into a red-shifted copy
// and a cyan-shifted copy jittered off to either side. Always additive:
// the real car keeps rendering normally underneath, so the effect reads as
// the car glitching rather than the player losing sight of their own car.
function renderCarGlitch(c,SCENE,near){
  const ox=c.x, oy=c.y, oz=c.z, orgb=c.rgb, oarb=c.arb, ofog=0.05+Math.random()*0.1;
  const jx=(Math.random()-.5)*16, jy=(Math.random()-.5)*16, jz=(Math.random()-.5)*10;
  const mesh=carMesh(c.shape);
  try{
    c.x=ox+jx; c.y=oy+jy; c.z=oz+jz;
    c.rgb=[Math.min(255,orgb[0]+90), orgb[1]*0.32, orgb[2]*0.32];
    c.arb=[Math.min(255,oarb[0]+90), oarb[1]*0.32, oarb[2]*0.32];
    collectMesh(SCENE,null,mesh,c,ofog,false);

    c.x=ox-jx*0.6; c.y=oy-jy*0.6; c.z=oz-jz*0.5;
    c.rgb=[orgb[0]*0.32, Math.min(255,orgb[1]+70), Math.min(255,orgb[2]+95)];
    c.arb=[oarb[0]*0.32, Math.min(255,oarb[1]+70), Math.min(255,oarb[2]+95)];
    collectMesh(SCENE,null,mesh,c,ofog,false);
  } finally {
    // the real car's position and colour must survive this no matter what,
    // even if a rendering step above throws
    c.x=ox; c.y=oy; c.z=oz; c.rgb=orgb; c.arb=oarb;
  }
}

function carBody(c,SCENE,glows){
  const wh=WHEELS[c.shape]||WHEELS.gt;
  const dist=Math.hypot(c.x-EYE[0],c.y-EYE[2]);
  const fog=Math.min(0.82,Math.pow(dist/1500,1.4));
  const near=dist<420;

  // wheels turn with the car and steer at the front axle — a four-wheel
  // steer car turns the rear axle too, opposite the front, for a visibly
  // tighter pivot
  c.spin=(c.spin||0)+(state==="racing"?c.speed*frameDt/wh.r:0);
  const steer=Math.max(-0.42,Math.min(0.42,c.steer*0.42));
  const rearSteer=c.fourWS?-steer*0.8:0;
  const wm=MB(), sides=near?14:6;
  wheelMesh(wm, wh.fx, -wh.tr, wh.r, wh.w, sides, c.spin, steer);
  wheelMesh(wm, wh.fx,  wh.tr, wh.r, wh.w, sides, c.spin, steer);
  wheelMesh(wm, wh.rx, -wh.tr, wh.r, wh.w, sides, c.spin, rearSteer);
  wheelMesh(wm, wh.rx,  wh.tr, wh.r, wh.w, sides, c.spin, rearSteer);

  collectMesh(SCENE,glows,carMesh(c.shape),c,fog,true);
  collectMesh(SCENE,null,wm,c,fog,false);

  if(CIRCUITS[pickedTrack].glitchy&&Math.random()<0.12) renderCarGlitch(c,SCENE,near);

  if(c.nitroT>0.03&&glows){
    const s=SHAPE[c.shape], co=Math.cos(c.ang), si=Math.sin(c.ang);
    const gx=c.x-co*(s.l+6), gy=c.y-si*(s.l+6);
    const g=toCam(gx,c.z+8,gy);
    if(g[2]>NEAR) glows.push({c:g, col:"140,190,255", fog:fog*(1-c.nitroT*0.4)});
  }
}

// Generic box pusher, used for scenery that doesn't need the full
// building treatment (windows, glow) — trees, rocks.
// Flat patches of visibly corrupted ground, scattered independent of any
// prop. Each flickers on and off and drifts in colour frame to frame,
// standing in for a torn spot in an otherwise-invisible terrain.
function drawGlitchPatches(SCENE){
  if(!GLITCH_PATCHES.length) return;
  for(const g of GLITCH_PATCHES){
    const dx=g.x-EYE[0], dz=g.y-EYE[2];
    if(dx*FW[0]+dz*FW[2] < -100) continue;
    const dist=Math.hypot(dx,dz);
    if(dist>3400) continue;
    if(Math.random()<0.28) continue;                   // flicker: on most frames now
    const fog=Math.min(0.9,Math.pow(dist/3500,1.25));
    const s=g.size*(0.6+Math.random()*0.8)*(g.big?1.8:1);
    const jz=Math.random()*12;
    const hue=Math.random()<0.5?[210,255,90]:[255,90,220];  // sickly green or magenta
    const co=Math.cos(g.seed+Math.random()*3), si=Math.sin(g.seed+Math.random()*3);
    const a=[g.x+co*s, g.y+si*s], b=[g.x-si*s, g.y+co*s],
          c=[g.x-co*s, g.y-si*s], d=[g.x+si*s, g.y-co*s];
    const z=g.z+jz;
    const poly=[toCam(a[0],z,a[1]),toCam(b[0],z,b[1]),toCam(c[0],z,c[1]),toCam(d[0],z,d[1])];
    SCENE.push({poly, z:(poly[0][2]+poly[2][2])/2-3, style:rgbs(mix(hue,HAZE,fog),0.5+Math.random()*0.4)});

    // a scan-line style second sliver, offset and thinner, for a torn look
    if(Math.random()<0.4){
      const s2=s*0.4, off=s*(0.5+Math.random()*0.6);
      const ex=g.x+co*off, ey=g.y+si*off;
      const e=[ex+co*s2,ey+si*s2],f=[ex-si*s2,ey+co*s2],
            h2=[ex-co*s2,ey-si*s2],i2=[ex+si*s2,ey-co*s2];
      const poly2=[toCam(e[0],z,e[1]),toCam(f[0],z,f[1]),toCam(h2[0],z,h2[1]),toCam(i2[0],z,i2[1])];
      SCENE.push({poly:poly2, z:(poly2[0][2]+poly2[2][2])/2-3,
        style:rgbs(mix(Math.random()<0.5?[255,255,255]:hue,HAZE,fog),0.35+Math.random()*0.35)});
    }
  }
}

// A glitching prop skips its normal solid render and instead throws up a
// jittered, colour-split duplicate — a red-shifted copy and a cyan-shifted
// copy offset in slightly different directions, standing in for a broken
// render rather than an actual object. Re-rolled fresh every frame it fires,
// so it reads as flicker rather than a static double-exposure.
function renderGlitchProp(SCENE,b,colA,colB,fog){
  const jx=(Math.random()-.5)*22, jy=(Math.random()-.5)*22, jz=(Math.random()-.5)*16;
  const hw=Math.max(b.w,b.d,6)*(0.7+Math.random()*0.6);
  const h0=b.z, h1=b.z+(b.h||14);
  const ang=b.ang+(Math.random()-.5)*0.6;
  pushBox(SCENE,b.x+jx,b.y+jy,ang,hw*0.9,hw*0.9,h0+jz,h1+jz,
          [Math.min(255,colA[0]+90),colA[1]*0.4,colA[2]*0.4],fog,1.3);
  pushBox(SCENE,b.x-jx*0.6,b.y-jy*0.6,ang,hw*0.75,hw*0.75,h0-jz*0.5,h1-jz*0.5,
          [colB[0]*0.4,Math.min(255,colB[1]+70),Math.min(255,colB[2]+90)],fog,1.3);
}

function pushBox(SCENE,cx,cy,ang,hl,hw,z0,z1,base,fog,roofBoost){
  const co=Math.cos(ang), si=Math.sin(ang);
  const C=(fx,fy)=>[cx+fx*co-fy*si, cy+fx*si+fy*co];
  const q=[C(hl,-hw),C(hl,hw),C(-hl,hw),C(-hl,-hw)];
  SCENE.push({
    poly:q.map(v=>toCam(v[0],z1,v[1])),
    z:toCam(cx,z1,cy)[2],
    style:rgbs(mix(shade(base,roofBoost||1.15),HAZE,fog))
  });
  for(let k=0;k<4;k++){
    const a=q[k], e=q[(k+1)%4];
    const mx=(a[0]+e[0])/2, my=(a[1]+e[1])/2;
    let nx=-(e[1]-a[1]), ny=e[0]-a[0];
    const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
    if((mx-cx)*nx+(my-cy)*ny<0){ nx=-nx; ny=-ny; }
    if((EYE[0]-mx)*nx+(EYE[2]-my)*ny<=0) continue;
    const face=Math.abs(nx*0.6+ny*0.8);
    const poly=[toCam(a[0],z0,a[1]),toCam(e[0],z0,e[1]),toCam(e[0],z1,e[1]),toCam(a[0],z1,a[1])];
    const zc=(poly[0][2]+poly[1][2])/2;
    SCENE.push({poly, z:zc+0.5, style:rgbs(mix(shade(base,0.52+face*0.36),HAZE,fog))});
  }
}

function collectBuildings(SCENE,glows){
  const vis=[];
  const cutoff=CIRCUITS[pickedTrack].boundless?2800:1300;
  for(const b of BUILDINGS){
    const dx=b.x-EYE[0], dz=b.y-EYE[2];
    if(dx*FW[0]+dz*FW[2] < -260) continue;              // behind the camera
    const d=Math.hypot(dx,dz);
    if(d>cutoff) continue;
    vis.push({b,d});
  }
  vis.sort((a,b)=>a.d-b.d);
  const capN=CIRCUITS[pickedTrack].boundless?96:64;
  if(vis.length>capN) vis.length=capN;                  // bounded draw cost

  for(const item of vis){
    const b=item.b, dist=item.d;
    const fog=Math.min(0.9,Math.pow(dist/(cutoff+100),1.25));

    if(b.kind==="tree"){
      const trunk=[86,64,44];
      const leaf=mix([44,88,52],[70,112,66],b.tone);
      if(b.glitchy&&Math.random()<0.4){ renderGlitchProp(SCENE,b,trunk,leaf,fog); continue; }
      pushBox(SCENE,b.x,b.y,b.ang,b.tw,b.tw,b.z,b.z+b.trunkH,trunk,fog,0.6);
      pushBox(SCENE,b.x,b.y,b.ang,b.w*0.65,b.d*0.65,b.z+b.trunkH*0.45,b.z+b.trunkH+(b.h-b.trunkH)*0.55,leaf,fog,1.0);
      pushBox(SCENE,b.x,b.y,b.ang,b.w,b.d,b.z+b.trunkH,b.z+b.h,leaf,fog,1.12);
      continue;
    }
    if(b.kind==="rock"){
      const col=mix([98,94,88],[72,68,64],b.tone);
      if(b.glitchy&&Math.random()<0.4){ renderGlitchProp(SCENE,b,col,col,fog); continue; }
      pushBox(SCENE,b.x,b.y,b.ang,b.w,b.d,b.z,b.z+b.h,col,fog,0.95);
      continue;
    }

    const co=Math.cos(b.ang), si=Math.sin(b.ang);
    const C=(fx,fy)=>[b.x+fx*co-fy*si, b.y+fx*si+fy*co];
    const q=[C(b.d,-b.w),C(b.d,b.w),C(-b.d,b.w),C(-b.d,-b.w)];
    const base=mix(BLD_A,BLD_B,b.tone);
    const top=b.z+b.h;

    if(b.glitchy&&Math.random()<0.28){ renderGlitchProp(SCENE,b,base,base,fog); continue; }

    // windows go on whichever wall faces us most directly
    let bestK=-1, bestDot=0;
    for(let k=0;k<4;k++){
      const a=q[k], e=q[(k+1)%4];
      const mx=(a[0]+e[0])/2, my=(a[1]+e[1])/2;
      let nx=-(e[1]-a[1]), ny=e[0]-a[0];
      const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
      if((mx-b.x)*nx+(my-b.y)*ny<0){ nx=-nx; ny=-ny; }
      const vx=EYE[0]-mx, vy=EYE[2]-my, vl=Math.hypot(vx,vy)||1;
      const dot=(vx*nx+vy*ny)/vl;
      if(dot>bestDot){ bestDot=dot; bestK=k; }
    }

    // roof
    SCENE.push({
      poly:q.map(v=>toCam(v[0],top,v[1])),
      z:toCam(b.x,top,b.y)[2],
      style:rgbs(mix(shade(base,1.18),HAZE,fog))
    });

    for(let k=0;k<4;k++){
      const a=q[k], e=q[(k+1)%4];
      const mx=(a[0]+e[0])/2, my=(a[1]+e[1])/2;
      let nx=-(e[1]-a[1]), ny=e[0]-a[0];
      const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
      if((mx-b.x)*nx+(my-b.y)*ny<0){ nx=-nx; ny=-ny; }
      if((EYE[0]-mx)*nx+(EYE[2]-my)*ny<=0) continue;    // facade faces away

      const face=Math.abs(nx*0.6+ny*0.8);
      const poly=[toCam(a[0],b.z,a[1]),toCam(e[0],b.z,e[1]),
                  toCam(e[0],top,e[1]),toCam(a[0],top,a[1])];
      const zc=(poly[0][2]+poly[1][2])/2;
      SCENE.push({poly, z:zc+0.5, style:rgbs(mix(shade(base,0.52+face*0.36),HAZE,fog))});

      // lit floors, close in and on the front wall only
      if(dist<520&&k===bestK){
        const step=b.h/b.rows;
        for(let r=0;r<Math.min(b.rows,5);r++){
          if(!b.win[r]) continue;
          const z0=b.z+4+r*step, z1=z0+step*0.52;
          const ax=a[0]+(e[0]-a[0])*0.12, ay=a[1]+(e[1]-a[1])*0.12;
          const ex=a[0]+(e[0]-a[0])*0.88, ey=a[1]+(e[1]-a[1])*0.88;
          SCENE.push({
            poly:[toCam(ax,z0,ay),toCam(ex,z0,ey),toCam(ex,z1,ey),toCam(ax,z1,ay)],
            z:zc,
            style:rgbs(mix(WINCOL,HAZE,Math.min(0.92,fog+0.12)))
          });
        }
      }
    }

    if(b.h>210&&glows){                                  // aircraft warning light
      const g=toCam(b.x,top+4,b.y);
      if(g[2]>NEAR) glows.push({c:g, warm:false, fog:fog*0.6});
    }
  }
}

// A fixed field of stars, seeded once, scattered across the upper sky in
// azimuth/elevation (not screen space) so they wheel naturally with the
// camera, like a real skybox, rather than being pinned to the screen.
function buildStars(){
  STARS=[];
  let seed=90125;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  for(let i=0;i<240;i++){
    STARS.push({ az:rnd()*6.283185, el:0.08+rnd()*0.86, r:0.6+rnd()*1.3, ph:rnd()*6.283185, sp:0.4+rnd()*2.2 });
  }
}
function celestialDir(az,el){ return [Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)]; }

// Sun, moon and stars — drawn as a skybox using the *current* EYE/FW/RT/UP/
// focal, so it works for both the main camera (render3D) and a mirror's
// temporarily-swapped-in camera (renderMirror) with no extra plumbing.
function drawCelestial(){
  if(!STARS) buildStars();
  let sunVisible=false, sunEl=0, sunCol=[255,246,214];
  let moonVisible=false;
  let starA=0;

  if(DAYMODE==="night"){
    moonVisible=true; starA=1;
  } else if(DAYMODE==="sunset"){
    sunVisible=true;
    sunEl=-0.08+sunProgress*0.72;                       // "slowly rises"
    sunCol=mix([255,88,16],[255,190,86],Math.min(1,sunProgress*1.3));  // orange sun
    starA=Math.max(0,1-sunProgress*1.7);
  } else {
    sunVisible=true; sunEl=0.58; sunCol=[255,246,214];
  }

  if(starA>0.01){
    const now=performance.now()/1000;
    for(const s of STARS){
      const d=celestialDir(s.az,s.el);
      const c=toCam(EYE[0]+d[0]*10000, EYE[1]+d[1]*10000, EYE[2]+d[2]*10000);
      if(c[2]<NEAR) continue;
      const sx=VW/2+c[0]*focal/c[2], sy=VH/2-c[1]*focal/c[2];
      if(sx<-20||sx>VW+20||sy<-20||sy>VH*0.68) continue;
      const tw=0.5+0.5*Math.sin(now*s.sp+s.ph);
      ctx.globalAlpha=starA*tw;
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(sx,sy,s.r,0,6.3); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  if(moonVisible){
    const d=celestialDir(SUN_AZ+Math.PI, 0.58);
    const c=toCam(EYE[0]+d[0]*10000, EYE[1]+d[1]*10000, EYE[2]+d[2]*10000);
    if(c[2]>NEAR){
      const sx=VW/2+c[0]*focal/c[2], sy=VH/2-c[1]*focal/c[2];
      if(sx>-140&&sx<VW+140&&sy>-140&&sy<VH+140){
        const r=Math.max(10,26000/c[2]);
        const halo=ctx.createRadialGradient(sx,sy,0,sx,sy,r*3.2);
        halo.addColorStop(0,"rgba(226,232,242,.55)");
        halo.addColorStop(0.25,"rgba(226,232,242,.18)");
        halo.addColorStop(1,"rgba(226,232,242,0)");
        ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(sx,sy,r*3.2,0,6.3); ctx.fill();

        const mg=ctx.createRadialGradient(sx-r*0.25,sy-r*0.25,0,sx,sy,r);
        mg.addColorStop(0,"#fdfbf4"); mg.addColorStop(0.7,"#dfe3ea"); mg.addColorStop(1,"#b9bfca");
        ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(sx,sy,r,0,6.3); ctx.fill();
        ctx.fillStyle="rgba(150,155,165,.35)";
        ctx.beginPath(); ctx.arc(sx-r*0.32,sy-r*0.18,r*0.17,0,6.3); ctx.fill();
        ctx.beginPath(); ctx.arc(sx+r*0.22,sy+r*0.30,r*0.12,0,6.3); ctx.fill();
        ctx.beginPath(); ctx.arc(sx+r*0.05,sy-r*0.35,r*0.09,0,6.3); ctx.fill();
      }
    }
  }

  if(sunVisible){
    const d=celestialDir(SUN_AZ, sunEl);
    const c=toCam(EYE[0]+d[0]*10000, EYE[1]+d[1]*10000, EYE[2]+d[2]*10000);
    if(c[2]>NEAR){
      const sx=VW/2+c[0]*focal/c[2], sy=VH/2-c[1]*focal/c[2];
      if(sx>-220&&sx<VW+220&&sy>-220&&sy<VH+220){
        const r=Math.max(12,30000/c[2]);
        const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,r*4.2);
        glow.addColorStop(0,rgbs(sunCol,0.55));
        glow.addColorStop(0.3,rgbs(sunCol,0.22));
        glow.addColorStop(1,rgbs(sunCol,0));
        ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,r*4.2,0,6.3); ctx.fill();

        ctx.fillStyle=rgbs(sunCol);
        ctx.beginPath(); ctx.arc(sx,sy,r,0,6.3); ctx.fill();
      }
    }
  }
}

function render3D(p){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,SKYT); sky.addColorStop(0.55,SKYM); sky.addColorStop(1,SKYB);
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);

  setupCam(p);
  drawCelestial();

  // horizon and ground plane
  const far=toCam(p.x+Math.cos(cam.yaw)*40000,0,p.y+Math.sin(cam.yaw)*40000);
  const hy=far[2]>NEAR ? VH/2-far[1]*focal/far[2] : VH*0.36;
  const hg=ctx.createLinearGradient(0,hy-70,0,hy+8);
  hg.addColorStop(0,"rgba("+HORIZ+",0)"); hg.addColorStop(1,"rgba("+HORIZ+","+HORIZA+")");
  ctx.fillStyle=hg; ctx.fillRect(0,hy-70,VW,78);
  const gg=ctx.createLinearGradient(0,hy,0,VH);
  gg.addColorStop(0,rgbs(HAZE)); gg.addColorStop(0.25,rgbs(GROUND)); gg.addColorStop(1,GROUNDB);
  ctx.fillStyle=gg; ctx.fillRect(0,hy,VW,VH-hy);

  drawRoad(p);
  drawLamps();

  for(const m of skid3d){
    const mx=(m[0]+m[2])/2, my=(m[1]+m[3])/2;
    if(Math.hypot(mx-EYE[0],my-EYE[2])>760) continue;
    const dx=m[2]-m[0], dy=m[3]-m[1], L=Math.hypot(dx,dy)||1;
    const px=-dy/L*2.8, py=dx/L*2.8;
    ground([m[0]+px,m[1]+py],[m[2]+px,m[3]+py],[m[2]-px,m[3]-py],[m[0]-px,m[1]-py],
           "rgba(0,0,0,.5)",(m[4]||0)+0.15);
  }

  const SCENE=[], glows=[];

  for(const c of cars){
    if((camMode===1||camMode===4)&&c.human) continue;
    if(toCam(c.x,c.z+10,c.y)[2]<NEAR) continue;
    carDecals(c);
  }
  collectBuildings(SCENE,glows);
  drawGlitchPatches(SCENE);
  for(const c of cars){
    if((camMode===1||camMode===4)&&c.human) continue;
    if(toCam(c.x,c.z+10,c.y)[2]<NEAR) continue;
    carBody(c,SCENE,glows);
  }

  SCENE.sort((a,b)=>b.z-a.z);
  for(const o of SCENE) fillPoly(o.poly,o.style);

  for(const q of particles){
    const c=toCam(q.x,q.z||3,q.y);
    if(c[2]<NEAR) continue;
    const sx=VW/2+c[0]*focal/c[2], sy=VH/2-c[1]*focal/c[2];
    const t=q.life/q.max;
    if(q.smoke){
      // smoke puffs start tight and balloon out much larger as they age
      // and thin, rather than a flat dot — a real cloud, not a spark
      const grow=1+(1-t)*4.6;
      const r=Math.max(3,(760/c[2])*grow*(q.size||1));
      const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
      g.addColorStop(0,`rgba(${q.col},${t*0.30})`);
      g.addColorStop(0.55,`rgba(${q.col},${t*0.16})`);
      g.addColorStop(1,`rgba(${q.col},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
    } else {
      const r=Math.max(1,260/c[2]);
      ctx.fillStyle=`rgba(${q.col||"120,140,110"},${t*(q.col?0.7:0.45)})`;
      ctx.fillRect(sx-r/2,sy-r/2,r,r);
    }
  }

  for(const g of glows){
    const sx=VW/2+g.c[0]*focal/g.c[2], sy=VH/2-g.c[1]*focal/g.c[2];
    const r=Math.max(4,1100/g.c[2]), a=(1-g.fog)*Math.max(0.3,LAMPA);
    const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
    const inner=g.col?`rgba(${g.col},${0.55*a})`:(g.warm?`rgba(255,236,190,${0.5*a})`:`rgba(255,70,50,${0.45*a})`);
    const outer=g.col?`rgba(${g.col},0)`:(g.warm?"rgba(255,220,150,0)":"rgba(255,60,40,0)");
    grd.addColorStop(0, inner);
    grd.addColorStop(1, outer);
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
  }
}


// half-length, half-width, wheel half-track, wheel length/width
const SHAPE={
  proto : {l:27, w:12,  tr:12.5, wl:6,  wr:3.5},
  gt    : {l:22, w:11,  tr:11.5, wl:5.5,wr:3.2},
  rally : {l:20, w:11.5,tr:12,   wl:5.5,wr:3.6},
  muscle: {l:24, w:12,  tr:12.5, wl:6,  wr:3.8},
  open  : {l:23, w:6.5, tr:13,   wl:6,  wr:3.8},
  kei   : {l:16, w:10,  tr:10.5, wl:4.5,wr:3.0},
  city  : {l:19, w:10,  tr:10.8, wl:5.2,wr:3.0},
  crawler:{l:15, w:9,   tr:10.2, wl:5.6,wr:3.6}
};

function rr(g,x,y,w,h,r){
  g.beginPath();
  if(g.roundRect) g.roundRect(x,y,w,h,r);
  else g.rect(x,y,w,h);
  g.fill();
}

function drawCar(g,c,zoom){
  const s=SHAPE[c.shape]||SHAPE.gt;
  g.save();
  g.translate(c.x,c.y); g.rotate(c.ang);
  const lift2=1+Math.min(0.55,((c.z||0)-(c.gz||0))/110);
  if(lift2>1.001){
    g.save(); g.rotate(-c.ang); g.fillStyle="rgba(0,0,0,.4)";
    g.beginPath(); g.ellipse(0,0,s.l*0.8,s.w*0.8,0,0,7); g.fill(); g.restore();
    g.scale(lift2,lift2);
  }

  // headlight wash
  const beam=g.createLinearGradient(s.l*0.5,0,s.l*6,0);
  beam.addColorStop(0,"rgba(255,240,200,.20)");
  beam.addColorStop(1,"rgba(255,240,200,0)");
  g.fillStyle=beam;
  g.beginPath();
  g.moveTo(s.l-8,-s.w*0.6); g.lineTo(s.l*6,-s.l*2); g.lineTo(s.l*6,s.l*2); g.lineTo(s.l-8,s.w*0.6);
  g.closePath(); g.fill();

  // tyres
  g.fillStyle="#0e1216";
  for(const fx of [s.l-s.wl-1, -s.l+1]){
    for(const fy of [-s.tr, s.tr-s.wr]) g.fillRect(fx,fy,s.wl,s.wr);
  }

  g.fillStyle="rgba(0,0,0,.4)";
  rr(g,-s.l+1,-s.w+1,s.l*2-2,s.w*2-2,4);

  g.fillStyle=c.color;
  switch(c.shape){
    case "proto":
      g.beginPath();
      g.moveTo(s.l,-s.w*0.42); g.lineTo(s.l,s.w*0.42);
      g.lineTo(s.l*0.2,s.w); g.lineTo(-s.l,s.w);
      g.lineTo(-s.l,-s.w); g.lineTo(s.l*0.2,-s.w);
      g.closePath(); g.fill();
      g.fillStyle="#12161b"; g.fillRect(-s.l-4,-s.tr-1,5,(s.tr+1)*2);
      g.fillStyle=c.accent; g.fillRect(-s.l+4,-s.w,5,s.w*2);
      g.fillStyle="rgba(10,14,20,.85)"; rr(g,-9,-6,13,12,3);
      break;
    case "open":
      g.beginPath();
      g.moveTo(s.l,-2.5); g.lineTo(s.l,2.5);
      g.lineTo(-s.l,s.w); g.lineTo(-s.l,-s.w);
      g.closePath(); g.fill();
      g.fillStyle="#12161b";
      g.fillRect(s.l-2,-9,3,18);
      g.fillRect(-s.l-4,-10,5,20);
      g.fillStyle="rgba(10,14,20,.9)"; rr(g,-8,-4.5,9,9,3);
      break;
    case "muscle":
      rr(g,-s.l,-s.w,s.l*2,s.w*2,3);
      g.fillStyle="#12161b"; g.fillRect(2,-6,9,12);
      g.fillStyle=c.accent; g.fillRect(-s.l,-3.5,s.l*2,7);
      g.fillStyle="rgba(10,14,20,.85)"; g.fillRect(-11,-8,11,16);
      g.fillStyle="#12161b"; g.fillRect(-s.l-3,-10,4,20);
      break;
    case "rally":
      rr(g,-s.l,-s.w,s.l*2,s.w*2,4);
      g.fillStyle="rgba(10,14,20,.85)"; rr(g,-9,-8,14,16,3);
      g.fillStyle=c.accent; g.fillRect(-s.l+2,-s.w,4,s.w*2);
      g.fillStyle="#12161b"; g.fillRect(-s.l-3,-9,4,18);
      g.fillStyle="rgba(255,244,214,.9)";
      g.fillRect(s.l-3,-9.5,4,3); g.fillRect(s.l-3,6.5,4,3);
      break;
    case "kei":
      rr(g,-s.l,-s.w,s.l*2,s.w*2,5);
      g.fillStyle="rgba(10,14,20,.85)"; rr(g,-7,-7,12,14,3);
      g.fillStyle=c.accent; g.fillRect(-s.l,-2.5,s.l*2,5);
      break;
    case "city": // plain hatchback — no stripe, no scoop, nothing to see
      rr(g,-s.l,-s.w,s.l*2,s.w*2,4);
      g.fillStyle="rgba(10,14,20,.85)"; rr(g,-9,-6.5,15,13,3);
      break;
    case "crawler": // short and boxy, with the roll bar as the giveaway
      rr(g,-s.l,-s.w,s.l*2,s.w*2,4);
      g.fillStyle="rgba(10,14,20,.85)"; rr(g,-6,-6,11,12,3);
      g.fillStyle=c.accent; g.fillRect(-7,-1,11,2);
      break;
    default: // gt
      g.beginPath();
      g.moveTo(s.l,-s.w*0.6); g.lineTo(s.l,s.w*0.6);
      g.lineTo(s.l*0.35,s.w); g.lineTo(-s.l,s.w*0.9);
      g.lineTo(-s.l,-s.w*0.9); g.lineTo(s.l*0.35,-s.w);
      g.closePath(); g.fill();
      g.fillStyle=c.accent; g.fillRect(-3,-s.w,6,s.w*2);
      g.fillStyle="rgba(10,14,20,.85)"; rr(g,-10,-7.5,12,15,3);
      g.fillStyle="#12161b"; g.fillRect(-s.l-3,-9,4,18);
      break;
  }

  g.fillStyle="rgba(255,244,214,.95)";
  g.fillRect(s.l-3,-s.w*0.8,3,4); g.fillRect(s.l-3,s.w*0.8-4,3,4);
  g.fillStyle="#c8342b";
  g.fillRect(-s.l,-s.w*0.75,2,3.5); g.fillRect(-s.l,s.w*0.75-3.5,2,3.5);

  if(zoom>0.75){
    g.rotate(-c.ang);
    g.fillStyle="rgba(255,255,255,.9)";
    g.font="700 9px ui-monospace,Menlo,monospace";
    g.textAlign="center";
    g.fillText(c.num,0,-s.tr-5);
  }
  g.restore();
}

function render(){
  const p=cars.length?cars[0]:null;
  if(p&&camMode!==3){ render3D(p); if(MP.on&&MP.racing) mpNameTags(p); } else render2D(p);

  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,"+VIGN+")");
  ctx.fillStyle=v; ctx.fillRect(0,0,VW,VH);

}

// Size, position and shape all vary per car — a wing mirror on the open-
// wheeler is a tiny aero stalk, the crawler's are a pair of squared-off
// utility boxes.
const MIRROR={
  proto  :{rearW:0.100,rearH:0.028,rearY:0.045,sideW:0.050,sideH:0.074,sideX:0.020,sideY:0.30,shape:"oval"},
  gt     :{rearW:0.115,rearH:0.032,rearY:0.050,sideW:0.058,sideH:0.082,sideX:0.018,sideY:0.32,shape:"rounded"},
  rally  :{rearW:0.130,rearH:0.036,rearY:0.055,sideW:0.070,sideH:0.090,sideX:0.014,sideY:0.34,shape:"rounded"},
  muscle :{rearW:0.140,rearH:0.038,rearY:0.060,sideW:0.075,sideH:0.100,sideX:0.012,sideY:0.35,shape:"rect"},
  open   :{rearW:0.065,rearH:0.020,rearY:0.028,sideW:0.036,sideH:0.052,sideX:0.028,sideY:0.24,shape:"oval"},
  kei    :{rearW:0.095,rearH:0.026,rearY:0.040,sideW:0.050,sideH:0.070,sideX:0.020,sideY:0.28,shape:"rounded"},
  city   :{rearW:0.100,rearH:0.028,rearY:0.045,sideW:0.055,sideH:0.075,sideX:0.018,sideY:0.30,shape:"rounded"},
  crawler:{rearW:0.150,rearH:0.042,rearY:0.065,sideW:0.080,sideH:0.110,sideX:0.010,sideY:0.36,shape:"rect"}
};

function mirrorClip(cx,cy,w,h,shape){
  ctx.beginPath();
  if(shape==="oval"){
    ctx.ellipse(cx,cy,w,h,0,0,6.283185);
  } else if(shape==="rect"){
    ctx.rect(cx-w,cy-h,w*2,h*2);
  } else {
    const r=Math.min(w,h)*0.35;
    ctx.moveTo(cx-w+r,cy-h);
    ctx.lineTo(cx+w-r,cy-h); ctx.arcTo(cx+w,cy-h,cx+w,cy-h+r,r);
    ctx.lineTo(cx+w,cy+h-r); ctx.arcTo(cx+w,cy+h,cx+w-r,cy+h,r);
    ctx.lineTo(cx-w+r,cy+h); ctx.arcTo(cx-w,cy+h,cx-w,cy+h-r,r);
    ctx.lineTo(cx-w,cy-h+r); ctx.arcTo(cx-w,cy-h,cx-w+r,cy-h,r);
    ctx.closePath();
  }
}

function normalize3(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }

// Renders a scoped rear-facing view of the other cars into one mirror.
// toCam()/fillPoly() are untouched — they always project relative to the
// live global camera and the full VW×VH frame, so instead of teaching them
// about a second viewport, the whole VW×VH space is squeezed down and
// moved into the mirror's clip region with an ordinary canvas transform;
// everything drawn inside just lands correctly scaled and positioned.
function renderMirror(p,cx,cy,w,h,shape,camFW){
  const savedEYE=EYE, savedFW=FW, savedRT=RT, savedUP=UP, savedFocal=focal;
  ctx.save();
  mirrorClip(cx,cy,w,h,shape); ctx.clip();
  ctx.translate(cx-w,cy-h); ctx.scale((w*2)/VW,(h*2)/VH);

  const sky=ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,SKYT); sky.addColorStop(0.55,SKYM); sky.addColorStop(1,SKYB);
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);

  // The camera swap below is temporary and MUST come back — if anything
  // downstream throws (a scenery or car edge case), the whole game's
  // camera would otherwise stay pointed backward for every frame after.
  try{
    EYE=savedEYE.slice();
    FW=camFW;
    const rl=Math.hypot(-FW[2],FW[0])||1; RT=[-FW[2]/rl,0,FW[0]/rl];
    UP=[RT[1]*FW[2]-RT[2]*FW[1], RT[2]*FW[0]-RT[0]*FW[2], RT[0]*FW[1]-RT[1]*FW[0]];
    focal=(VH/2)/Math.tan(52*Math.PI/360);
    drawCelestial();

    // horizon and ground — same gradients and colours the main view uses,
    // just built against the mirror's own backward-facing camera
    const far=toCam(p.x+FW[0]*40000,0,p.y+FW[2]*40000);
    const hy=far[2]>NEAR ? VH/2-far[1]*focal/far[2] : VH*0.36;
    const hg=ctx.createLinearGradient(0,hy-70,0,hy+8);
    hg.addColorStop(0,"rgba("+HORIZ+",0)"); hg.addColorStop(1,"rgba("+HORIZ+","+HORIZA+")");
    ctx.fillStyle=hg; ctx.fillRect(0,hy-70,VW,78);
    const gg=ctx.createLinearGradient(0,hy,0,VH);
    gg.addColorStop(0,rgbs(HAZE)); gg.addColorStop(0.25,rgbs(GROUND)); gg.addColorStop(1,GROUNDB);
    ctx.fillStyle=gg; ctx.fillRect(0,hy,VW,VH-hy);

    const SCENE=[];
    collectBuildings(SCENE,null);       // scenery — buildings, trees, rocks
    for(const c of cars){
      if(c===p) continue;
      if(toCam(c.x,c.z+10,c.y)[2]<NEAR) continue;
      carDecals(c); carBody(c,SCENE,null);
    }
    SCENE.sort((a,b)=>b.z-a.z);
    for(const o of SCENE) fillPoly(o.poly,o.style);
  } finally {
    EYE=savedEYE; FW=savedFW; RT=savedRT; UP=savedUP; focal=savedFocal;
    ctx.restore();
  }

  // bezel, drawn in the untouched outer transform
  ctx.strokeStyle="#15181c"; ctx.lineWidth=Math.max(2,w*0.10);
  mirrorClip(cx,cy,w,h,shape); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.10)"; ctx.lineWidth=1;
  mirrorClip(cx,cy,w-1,h-1,shape); ctx.stroke();
}

function drawMirrors(p){
  const m=MIRROR[p.shape]||MIRROR.gt;
  const rearFW=normalize3([-FW[0],-FW[1],-FW[2]]);
  const leftFW=normalize3([rearFW[0]-RT[0]*0.55,rearFW[1]-RT[1]*0.55,rearFW[2]-RT[2]*0.55]);
  const rightFW=normalize3([rearFW[0]+RT[0]*0.55,rearFW[1]+RT[1]*0.55,rearFW[2]+RT[2]*0.55]);

  // each mirror is isolated — one failing (a scenery or car edge case) must
  // not skip the other two, or the rest of the frame after them
  try{ renderMirror(p, VW*0.5, VH*m.rearY, VW*m.rearW, VH*m.rearH, "rounded", rearFW); } catch(e){}
  try{ renderMirror(p, VW*m.sideX, VH*m.sideY, VW*m.sideW, VH*m.sideH, m.shape, leftFW); } catch(e){}
  try{ renderMirror(p, VW*(1-m.sideX), VH*m.sideY, VW*m.sideW, VH*m.sideH, m.shape, rightFW); } catch(e){}
}

// Each shape gets its own trim, wheel size, spoke count and gauge glow —
// a rally car's cockpit shouldn't read like a city car's.
const DASH={
  proto  :{trim:"#141822",wheelR:0.082,spokes:3,dashRise:0.55,pillar:0.045,flatWheel:true, vents:false},
  gt     :{trim:"#1d2129",wheelR:0.110,spokes:3,dashRise:0.95,pillar:0.060,flatWheel:false,vents:false},
  rally  :{trim:"#241d13",wheelR:0.125,spokes:4,dashRise:1.15,pillar:0.075,flatWheel:true, vents:true },
  muscle :{trim:"#2a1414",wheelR:0.145,spokes:3,dashRise:1.35,pillar:0.075,flatWheel:false,vents:true },
  open   :{trim:"#101010",wheelR:0.068,spokes:2,dashRise:0.25,pillar:0.022,flatWheel:true, vents:false},
  kei    :{trim:"#152018",wheelR:0.090,spokes:4,dashRise:0.70,pillar:0.050,flatWheel:false,vents:false},
  city   :{trim:"#161b26",wheelR:0.100,spokes:4,dashRise:0.85,pillar:0.055,flatWheel:false,vents:false},
  crawler:{trim:"#1b2014",wheelR:0.155,spokes:5,dashRise:1.45,pillar:0.085,flatWheel:false,vents:true }
};

function drawCockpit(p){
  const d=DASH[p.shape]||DASH.gt;
  const kmh=Math.round(Math.abs(p.speed)*0.62);
  const topSpeedKmh=Math.round((p.maxSpeed||685)*0.62*1.16);
  const accent=p.accent||"#8a8f96";
  const TAU=6.283185;

  // the same corruption that hits the HUD panels reaches the cockpit too —
  // the whole dash shakes/skews as one unit during a burst, on top of a
  // chromatic-split flicker on the speed readout specifically
  const glitching=CIRCUITS[pickedTrack]&&CIRCUITS[pickedTrack].glitchy&&performance.now()<hudGlitchUntil;
  ctx.save();
  if(glitching){
    const jx=(Math.random()-.5)*16, jy=(Math.random()-.5)*9, rot=(Math.random()-.5)*0.05;
    ctx.translate(VW/2,VH/2); ctx.rotate(rot); ctx.translate(-VW/2+jx,-VH/2+jy);
  }

  // dash moulding — a real gradient instead of a flat fill, so it reads as
  // a curved, lit surface rather than a cardboard cutout, plus a soft
  // shadow underneath it and a crisp highlight along the top edge. dashRise
  // varies hugely per car — the open-wheeler barely has a dash at all,
  // the crawler's rises almost to a hood scoop.
  const dashH=VH*0.20, hump=dashH*d.dashRise;
  const grad=ctx.createLinearGradient(0,VH-dashH*1.3,0,VH);
  grad.addColorStop(0,shadeHex(d.trim,1.55));
  grad.addColorStop(0.18,shadeHex(d.trim,1.15));
  grad.addColorStop(1,shadeHex(d.trim,0.55));
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(0,VH); ctx.lineTo(0,VH-dashH*0.55);
  ctx.quadraticCurveTo(VW*0.5,VH-hump,VW,VH-dashH*0.55);
  ctx.lineTo(VW,VH); ctx.closePath(); ctx.fill();

  ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=14; ctx.shadowOffsetY=-6;
  ctx.fillStyle="rgba(0,0,0,.001)"; ctx.fill();
  ctx.shadowColor="transparent"; ctx.shadowBlur=0; ctx.shadowOffsetY=0;

  ctx.strokeStyle=accent; ctx.lineWidth=2.4; ctx.globalAlpha=0.7;
  ctx.beginPath();
  ctx.moveTo(0,VH-dashH*0.55);
  ctx.quadraticCurveTo(VW*0.5,VH-hump,VW,VH-dashH*0.55);
  ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.10)"; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(0,VH-dashH*0.55+3);
  ctx.quadraticCurveTo(VW*0.5,VH-hump+3,VW,VH-dashH*0.55+3);
  ctx.stroke();
  ctx.globalAlpha=1;

  // vents — a pair of recessed slots, only on the cars built for it
  if(d.vents){
    for(const side of [-1,1]){
      const vx=VW*0.5+side*VW*0.16, vy=VH-hump*0.6;
      ctx.fillStyle="rgba(0,0,0,.55)";
      ctx.save(); ctx.translate(vx,vy); ctx.rotate(side*0.08);
      ctx.fillRect(-VW*0.028,-VH*0.006,VW*0.056,VH*0.012);
      ctx.fillRect(-VW*0.028,VH*0.014,VW*0.056,VH*0.012);
      ctx.restore();
    }
  }

  // A-pillars, shaded to match — width varies a lot per car: the open-
  // wheeler barely has one, the crawler's is a thick roll-cage upright
  ctx.fillStyle=shadeHex(d.trim,0.85);
  const pw=d.pillar;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(VW*pw,0);
  ctx.lineTo(VW*pw*0.25,VH*0.62); ctx.lineTo(0,VH*0.58); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(VW,0); ctx.lineTo(VW*(1-pw),0);
  ctx.lineTo(VW*(1-pw*0.25),VH*0.62); ctx.lineTo(VW,VH*0.58); ctx.closePath(); ctx.fill();

  // steering wheel — grippy outer rim, machined inner ring, beveled spokes
  // with a highlight edge, hub badge in the car's own colour. Flat-bottom
  // cars get an actual D-shaped rim, not just a smaller circle.
  const wx=VW*0.5, wy=VH-dashH*0.30, wr=Math.min(VW,VH)*d.wheelR;
  const wheelAng=Math.max(-1,Math.min(1,p.steer||0))*2.5;

  function rimPath(r){
    ctx.beginPath();
    if(!d.flatWheel){ ctx.arc(0,0,r,0,TAU); return; }
    // the flat chord sits 60% of the way to the rim; everything above it
    // is a normal circular arc, everything below is a straight edge
    const cut=r*0.60;
    const beta=Math.acos(Math.min(1,cut/r));          // half-angle of the missing wedge
    const a0=Math.PI/2-beta, sweep=-(TAU-2*beta);      // start bottom-right, go the long way over the top
    const N=28;
    ctx.moveTo(Math.cos(a0)*r,Math.sin(a0)*r);
    for(let i=1;i<=N;i++){
      const a=a0+sweep*(i/N);
      ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath();
  }

  ctx.save();
  ctx.translate(wx,wy); ctx.rotate(wheelAng);
  ctx.strokeStyle="#050607"; ctx.lineWidth=wr*0.36; rimPath(wr); ctx.stroke();
  ctx.strokeStyle="#22262c"; ctx.lineWidth=wr*0.30; rimPath(wr); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.lineWidth=wr*0.04;
  ctx.beginPath(); ctx.arc(0,0,wr+wr*0.16,-0.5,1.9); ctx.stroke();
  ctx.strokeStyle="#3d434c"; ctx.lineWidth=wr*0.02;
  ctx.beginPath(); ctx.arc(0,0,wr*0.42,0,TAU); ctx.stroke();
  for(let i=0;i<d.spokes;i++){
    const a=i*TAU/d.spokes - 1.5708;
    const sx=Math.cos(a)*wr*0.92, sy=Math.sin(a)*wr*0.92;
    ctx.strokeStyle="#2a2e35"; ctx.lineWidth=wr*0.14;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(sx,sy); ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.10)"; ctx.lineWidth=wr*0.03;
    ctx.beginPath();
    ctx.moveTo(-Math.sin(a)*wr*0.03,Math.cos(a)*wr*0.03);
    ctx.lineTo(sx-Math.sin(a)*wr*0.03,sy+Math.cos(a)*wr*0.03); ctx.stroke();
  }
  ctx.fillStyle="#16181c"; ctx.beginPath(); ctx.arc(0,0,wr*0.20,0,TAU); ctx.fill();
  ctx.fillStyle=p.color||"#c8342b"; ctx.beginPath(); ctx.arc(0,0,wr*0.13,0,TAU); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,wr*0.13,0,TAU); ctx.stroke();
  ctx.restore();

  // gauge cluster — recessed bezel, tick marks, needle with a drop shadow
  const gx=VW*0.5+wr*2.2, gy=wy-wr*0.1, gr=wr*0.95;
  ctx.fillStyle="#05060750"; ctx.beginPath(); ctx.arc(gx,gy,gr*1.14,0,TAU); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.12)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(gx,gy,gr*1.08,0,TAU); ctx.stroke();
  ctx.fillStyle="rgba(6,8,10,.92)"; ctx.beginPath(); ctx.arc(gx,gy,gr,0,TAU); ctx.fill();
  ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.stroke();

  const startA=2.356, sweepA=4.712;   // 135deg to 405deg, a 270deg gauge
  for(let i=0;i<=10;i++){
    const a=startA+sweepA*(i/10), major=i%2===0;
    const r0=gr*(major?0.86:0.90), r1=gr*0.96;
    ctx.strokeStyle=major?"rgba(232,227,216,.75)":"rgba(232,227,216,.35)";
    ctx.lineWidth=major?2:1;
    ctx.beginPath();
    ctx.moveTo(gx+Math.cos(a)*r0,gy+Math.sin(a)*r0);
    ctx.lineTo(gx+Math.cos(a)*r1,gy+Math.sin(a)*r1); ctx.stroke();
  }

  const frac=Math.min(1,kmh/topSpeedKmh);
  ctx.strokeStyle="rgba(255,171,61,.22)"; ctx.lineWidth=gr*0.12;
  ctx.beginPath(); ctx.arc(gx,gy,gr*0.74,startA,startA+sweepA); ctx.stroke();
  ctx.strokeStyle="#ffab3d"; ctx.lineWidth=gr*0.12;
  ctx.beginPath(); ctx.arc(gx,gy,gr*0.74,startA,startA+sweepA*frac); ctx.stroke();

  const needleA=startA+sweepA*frac;
  ctx.strokeStyle="rgba(0,0,0,.5)"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(gx+1,gy+2);
  ctx.lineTo(gx+Math.cos(needleA)*gr*0.66+1,gy+Math.sin(needleA)*gr*0.66+2); ctx.stroke();
  ctx.strokeStyle="#e8e3d8"; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(gx,gy);
  ctx.lineTo(gx+Math.cos(needleA)*gr*0.66,gy+Math.sin(needleA)*gr*0.66); ctx.stroke();
  ctx.fillStyle="#e8e3d8"; ctx.beginPath(); ctx.arc(gx,gy,gr*0.06,0,TAU); ctx.fill();

  ctx.font=`700 ${Math.round(gr*0.34)}px Arial`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  if(glitching){
    // a chromatic split on the readout itself — same red/cyan language as
    // everywhere else this map corrupts things
    ctx.fillStyle="rgba(255,70,70,.75)"; ctx.fillText(String(kmh),gx-2,gy+gr*0.24);
    ctx.fillStyle="rgba(80,200,255,.75)"; ctx.fillText(String(kmh),gx+2,gy+gr*0.24);
  }
  ctx.fillStyle="#e8e3d8";
  ctx.fillText(String(glitching&&Math.random()<0.3?Math.floor(Math.random()*999):kmh),gx,gy+gr*0.24);
  ctx.font=`600 ${Math.round(gr*0.13)}px "Arial Narrow",Arial`;
  ctx.fillStyle="rgba(232,227,216,.55)";
  ctx.fillText("KM/H",gx,gy+gr*0.44);

  // HP — reads the same damage the fire/steering system already tracks,
  // with a per-zone breakdown so you can see what's actually hurt
  const dz=p.dmgZone||{front:0,rear:0,left:0,right:0};
  const hp=Math.max(0,1-Math.max(dz.front,dz.rear,dz.left,dz.right,p.damage||0));
  const hpCol = hp>0.6?"#7fd47f":hp>0.3?"#ffab3d":"#e8503f";
  const bx=gx-gr*0.62, by=gy-gr*1.42, bw=gr*1.24, bh=gr*0.15;

  // a pale trailing segment that catches down slowly, so a hit that just
  // landed is visible as "this much you had a second ago" until it fades
  if(p.hpGhost===undefined||p.hpGhost<hp) p.hpGhost=hp;
  else p.hpGhost=Math.max(hp,p.hpGhost-(frameDt||0.016)*0.12);

  ctx.fillStyle="rgba(20,24,30,.9)"; ctx.fillRect(bx,by,bw,bh);
  if(p.hpGhost>hp){
    ctx.fillStyle="rgba(232,227,216,.35)";
    ctx.fillRect(bx+bw*hp,by,bw*(p.hpGhost-hp),bh);
  }
  ctx.fillStyle=hpCol; ctx.fillRect(bx,by,bw*hp,bh);
  ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
  ctx.font=`700 ${Math.round(bh*0.9)}px "Arial Narrow",Arial`;
  ctx.fillStyle="#e8e3d8"; ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.fillText("HP",bx,by-3);
  ctx.textAlign="right";
  ctx.fillText(Math.round(hp*100)+"%",bx+bw,by-3);
  ctx.textAlign="center"; ctx.textBaseline="middle";

  // a small top-down car diagram — each panel shaded by its own real
  // damage: red once it's badly hurt, orange once it's merely dented,
  // nothing at all if that part's never been touched
  const zoneCol=(v)=> v>0.5?"#e8503f" : v>0.12?"#ffab3d" : "rgba(255,255,255,.05)";
  const mcx=bx+bw/2, mcy=by+bh+bh*1.65, mcw=bw*0.30, mch=bw*0.50;
  ctx.save();
  ctx.translate(mcx,mcy);
  ctx.beginPath();
  ctx.moveTo(-mcw/2,-mch/2+mcw*0.22);
  ctx.quadraticCurveTo(-mcw/2,-mch/2,0,-mch/2);
  ctx.quadraticCurveTo(mcw/2,-mch/2,mcw/2,-mch/2+mcw*0.22);
  ctx.lineTo(mcw/2,mch/2-mcw*0.22);
  ctx.quadraticCurveTo(mcw/2,mch/2,0,mch/2);
  ctx.quadraticCurveTo(-mcw/2,mch/2,-mcw/2,mch/2-mcw*0.22);
  ctx.closePath();
  ctx.save(); ctx.clip();
  ctx.fillStyle="#0c0e11"; ctx.fillRect(-mcw,-mch,mcw*2,mch*2);
  ctx.fillStyle=zoneCol(dz.front); ctx.fillRect(-mcw,-mch,mcw*2,mch*0.30);
  ctx.fillStyle=zoneCol(dz.rear);  ctx.fillRect(-mcw,mch*0.70-mch,mcw*2,mch*0.30);
  ctx.fillStyle=zoneCol(dz.left);  ctx.fillRect(-mcw,-mch*0.20,mcw*0.55,mch*0.40);
  ctx.fillStyle=zoneCol(dz.right); ctx.fillRect(mcw*0.45,-mch*0.20,mcw*0.55,mch*0.40);
  ctx.restore();
  ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.lineWidth=1.2; ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.5)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-mcw*0.4,-mch*0.20); ctx.lineTo(mcw*0.4,-mch*0.20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-mcw*0.4,mch*0.20); ctx.lineTo(mcw*0.4,mch*0.20); ctx.stroke();
  ctx.restore();

  // nitro strip, tucked under the gauge
  const nb=(p.nitro||0);
  ctx.fillStyle="rgba(20,24,30,.9)"; ctx.fillRect(gx-gr*0.55,gy+gr*1.15,gr*1.1,gr*0.16);
  ctx.fillStyle=p.nitroActive?"#7fd4ff":"#3d6a82";
  ctx.fillRect(gx-gr*0.55,gy+gr*1.15,gr*1.1*nb,gr*0.16);
  ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.lineWidth=1;
  ctx.strokeRect(gx-gr*0.55,gy+gr*1.15,gr*1.1,gr*0.16);
  ctx.restore();
}

// lightens (f>1) or darkens (f<1) a #rrggbb colour, for dash gradients
function shadeHex(hex,f){
  const n=hex.replace("#","");
  const r=Math.min(255,Math.round(parseInt(n.slice(0,2),16)*f));
  const g=Math.min(255,Math.round(parseInt(n.slice(2,4),16)*f));
  const b=Math.min(255,Math.round(parseInt(n.slice(4,6),16)*f));
  return `rgb(${r},${g},${b})`;
}

function render2D(p){
  const zoom=p ? 0.92-Math.min(0.2,Math.abs(p.speed)/700*0.2) : 0.85;
  const camX=p?p.x:WORLD_W/2, camY=p?p.y:WORLD_H/2;

  ctx.fillStyle=rgbs(mixArr([8,11,15],[143,182,216],DAYT)); ctx.fillRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(VW/2,VH/2); ctx.scale(zoom,zoom); ctx.translate(-camX,-camY);

  ctx.drawImage(worldCv,0,0,WORLD_W,WORLD_H);
  ctx.drawImage(marksCv,0,0,WORLD_W,WORLD_H);

  for(const q of particles){
    const t=q.life/q.max;
    if(q.smoke){
      const r=(4+(1-t)*22)*(q.size||1);
      const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,r);
      g.addColorStop(0,`rgba(${q.col},${t*0.28})`);
      g.addColorStop(1,`rgba(${q.col},0)`);
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x,q.y,r,0,7); ctx.fill();
    } else {
      ctx.fillStyle=`rgba(${q.col||"120,140,110"},${t*(q.col?0.75:0.5)})`;
      ctx.fillRect(q.x,q.y,3,3);
    }
  }
  for(const c of cars) drawCar(ctx,c,zoom);
  ctx.restore();
}

const mm=document.getElementById("minimap"), mctx=mm.getContext("2d");
let MM_S=1, MM_OX=0, MM_OY=0;
function setMinimapScale(){
  // For a normal circuit, WORLD_W/H roughly matches the visible content.
  // For a boundless map it doesn't — WORLD_W/H is sized to the enormous
  // grip corridor, not to where anything actually is, so the real content
  // (the loop and everything scattered around it) would render as a speck
  // in a mostly-empty square. Frame the minimap on the real content area.
  const spec=CIRCUITS[pickedTrack]&&CIRCUITS[pickedTrack].meadowScatter;
  const boundless=CIRCUITS[pickedTrack]&&CIRCUITS[pickedTrack].boundless;
  const spanW=boundless?(spec.area[2]-spec.area[0]):WORLD_W;
  const spanH=boundless?(spec.area[3]-spec.area[1]):WORLD_H;
  const originX=boundless?SHX+spec.area[0]:0;
  const originY=boundless?SHY+spec.area[1]:0;
  MM_S=Math.min(mm.width/spanW, mm.height/spanH)*0.92;
  MM_OX=(mm.width-spanW*MM_S)/2-originX*MM_S;
  MM_OY=(mm.height-spanH*MM_S)/2-originY*MM_S;
}
function mmp(x,y){ return [MM_OX+x*MM_S, MM_OY+y*MM_S]; }

function drawMinimap(){
  mctx.clearRect(0,0,mm.width,mm.height);
  mctx.beginPath();
  for(let i=0;i<N;i+=3){
    const [x,y]=mmp(TRACK[i].x,TRACK[i].y);
    i===0?mctx.moveTo(x,y):mctx.lineTo(x,y);
  }
  mctx.closePath();
  mctx.strokeStyle="rgba(255,171,61,.30)"; mctx.lineWidth=13; mctx.stroke();
  mctx.strokeStyle="rgba(232,227,216,.16)"; mctx.lineWidth=2; mctx.stroke();

  for(const f of FEATS){
    const p=TRACK[f.i], [fx,fy]=mmp(p.x,p.y);
    mctx.fillStyle=f.type===1?"#ffab3d":f.type===3?"#ffd27a":f.type===4?"#7a828e":"#5b86b8";
    mctx.fillRect(fx-3,fy-3,6,6);
  }

  const [sx,sy]=mmp(TRACK[0].x,TRACK[0].y);
  mctx.fillStyle="#e8e3d8"; mctx.fillRect(sx-2,sy-7,4,14);

  for(const c of cars){
    const [x,y]=mmp(c.x,c.y);
    mctx.fillStyle=c.color;
    mctx.beginPath(); mctx.arc(x,y,c.human?7:5,0,7); mctx.fill();
    if(c.human){ mctx.strokeStyle="#0b0f14"; mctx.lineWidth=2; mctx.stroke(); }
  }

  // the map's own corruption shows up here too, so the minimap isn't a
  // mostly-empty void around one small loop — it flickers with the same
  // torn spots the ground itself has
  if(GLITCH_PATCHES.length){
    for(const g of GLITCH_PATCHES){
      if(Math.random()<0.85) continue;
      const [gx,gy]=mmp(g.x,g.y);
      if(gx<-4||gy<-4||gx>mm.width+4||gy>mm.height+4) continue;
      mctx.fillStyle=Math.random()<0.5?"rgba(210,255,90,.8)":"rgba(255,90,220,.8)";
      mctx.fillRect(gx-2,gy-2,4,4);
    }
  }
}

const el=id=>document.getElementById(id);
function fmt(t){
  if(t===null||t===undefined) return "—";
  const m=Math.floor(t/60), s=t-m*60;
  return `${m}:${s<10?"0":""}${s.toFixed(2)}`;
}

function updateHud(){
  const playing=(state==="racing"||state==="countdown");
  updateCarAudio(cars[0]);
  el("pausebtn").style.display=playing?"block":"none";
  el("daybtn").style.display=playing?"block":"none";
  el("mutebtn").style.display=playing?"block":"none";
  el("touch").style.visibility=playing?"visible":"hidden";

  // the HUD itself glitches on a corrupted map — short, random bursts,
  // never while the menus are up
  if(playing&&CIRCUITS[pickedTrack]&&CIRCUITS[pickedTrack].glitchy){
    const now=performance.now();
    if(now>hudGlitchUntil&&Math.random()<0.018) hudGlitchUntil=now+55+Math.random()*160;
    const active=now<hudGlitchUntil;
    el("pitboard").classList.toggle("hudglitch",active);
    el("speedo").classList.toggle("hudglitch",active);
    el("mapwrap").classList.toggle("hudglitch",active);
  } else {
    el("pitboard").classList.remove("hudglitch");
    el("speedo").classList.remove("hudglitch");
    el("mapwrap").classList.remove("hudglitch");
  }

  const p=cars[0]; if(!p) return;
  if(mode==="free"){
    el("poslabel").textContent="Mode";
    el("pos").textContent="FREE";
    el("laplabel").textContent="Laps";
    el("lap").textContent=String(Math.max(0,p.lap));
  } else {
    el("poslabel").textContent="Position";
    el("pos").textContent=`${p.place}/${cars.length}`;
    el("laplabel").textContent="Lap";
    el("lap").textContent=`${Math.min(Math.max(p.lap,1),TOTAL_LAPS)}/${TOTAL_LAPS}`;
  }
  el("cur").textContent=state==="racing"&&p.lap>0?fmt(raceTime-p.lapStart):"0:00.00";
  el("last").textContent=fmt(p.lastLapT);
  el("best").textContent=fmt(p.bestLapT);
  const kmh=Math.round(Math.abs(p.speed)*0.62);
  el("speedVal").textContent=kmh;
  el("speedVal").classList.toggle("redline",kmh>380);
  el("spdlabel").textContent=p.speed<-2?"km/h · reverse":"km/h";
  const nf=el("nitrofill");
  nf.style.width=Math.round((p.nitro||0)*100)+"%";
  nf.classList.toggle("active",!!p.nitroActive);
  nf.classList.toggle("empty",(p.nitro||0)<0.03);
  const ct=el("countText");
  if(state==="countdown"){
    const n=Math.ceil(countdown-0.6);
    ct.textContent=n>0?String(n):"GO";
  } else if(MP.on&&MP.racing&&mode==="race"&&p.finished) ct.textContent="P"+p.place;
  else ct.textContent="";
  mpBoard();
}

function drawTrackPreview(cnv,i){
  const g=cnv.getContext("2d");
  const pts=trackPoints(i), b=bounds(pts), w=CIRCUITS[i].width;
  g.clearRect(0,0,cnv.width,cnv.height);
  const pad=22;
  const s=Math.min((cnv.width-pad*2)/b.w,(cnv.height-pad*2)/b.h);
  const ox=(cnv.width-b.w*s)/2-b.minx*s, oy=(cnv.height-b.h*s)/2-b.miny*s;
  g.beginPath();
  for(let k=0;k<pts.length;k+=3){
    const x=pts[k].x*s+ox, y=pts[k].y*s+oy;
    k===0?g.moveTo(x,y):g.lineTo(x,y);
  }
  g.closePath();
  g.lineJoin="round"; g.lineCap="round";
  g.strokeStyle="rgba(255,171,61,.24)"; g.lineWidth=Math.max(7,w*s); g.stroke();
  g.strokeStyle="rgba(232,227,216,.5)";  g.lineWidth=1.5; g.stroke();
  const p=pts[0], half=Math.max(5,w*s/2);
  g.save(); g.translate(p.x*s+ox,p.y*s+oy); g.rotate(p.ang);
  g.fillStyle="#e8e3d8"; g.fillRect(-1.5,-half,3,half*2); g.restore();
}

/* ── peer-to-peer transport ─────────────────────────────────────────────
   Used when the game is hosted anywhere other than claude.ai (GitHub Pages,
   Vercel…). It offers the same small room interface the claude.ai runtime
   does — join, presence, peers, onPeers, leave — so the multiplayer code
   above it doesn't change.
   Browsers talk to each other directly over WebRTC (PeerJS handles the
   introductions through its free public matchmaking server; no account or
   key). The first player to open a room code registers a "hub" id derived
   from the code, and everyone else connects to that hub, which relays
   presence between members. Players keep their own stable member id, so if
   the hub's tab closes, a remaining player re-registers as the new hub and
   the others reconnect to it without losing their place in the race. */

function mpLoadPeerLib(){
  if(window.Peer) return Promise.resolve(true);
  const urls=["https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",
              "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"];
  return new Promise(resolve=>{
    let i=0;
    const next=()=>{
      if(window.Peer) return resolve(true);
      if(i>=urls.length) return resolve(false);
      const s=document.createElement("script");
      s.src=urls[i++];
      s.onload=()=>{ if(window.Peer) resolve(true); else next(); };
      s.onerror=next;
      document.head.appendChild(s);
    };
    next();
  });
}

const p2pApi={
  async join(name){
    if(!(await mpLoadPeerLib())) throw {code:"upstream_error",message:"peer library unavailable"};
    const cfg=window.SODIUM_PEER||{};
    const hubId="sodiumcircuit-"+String(name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
    const uid="u"+Math.random().toString(36).slice(2,12)+Date.now().toString(36).slice(-4);

    const st={
      me:uid, hub:false, left:false,
      peer:null,                 // our PeerJS object (hub id when hub, anonymous when client)
      up:null,                   // client: connection to the hub
      members:new Map(),         // hub: uid -> connection
      map:new Map(),             // uid -> frozen presence
      stamp:new Map(),           // uid -> ms of last change
      mine:{}, handlers:new Set(), errHandlers:new Set(),
      nq:false, sendT:0, mig:false, pruneT:0
    };

    const notify=()=>{
      if(st.nq||st.left) return;
      st.nq=true;
      setTimeout(()=>{
        st.nq=false; if(st.left) return;
        const peers=snap();
        st.handlers.forEach(h=>{ try{ h({peers,joined:[],left:[],updated:[]}); }catch(e){} });
      },12);
    };
    const snap=()=>[...st.map.entries()].map(([id,p])=>({
      peer:id, presence:p, sameTab:id===st.me, isMe:id===st.me,
      kind:"viewer", guest:false, updatedAt:st.stamp.get(id)||0
    }));
    const setPres=(id,p)=>{ st.map.set(id,Object.freeze({...p})); st.stamp.set(id,Date.now()); notify(); };
    const dropPres=id=>{ if(st.map.delete(id)){ st.stamp.delete(id); notify(); } };
    const allPres=()=>{ const o={}; st.map.forEach((p,id)=>{ o[id]=p; }); return o; };
    const safeSend=(c,m)=>{ try{ if(c&&c.open!==false) c.send(m); }catch(e){} };
    const relay=(m,except)=>{ st.members.forEach((c,id)=>{ if(id!==except) safeSend(c,m); }); };

    /* hub role */
    const hubAccept=conn=>{
      let uidOf=null;
      conn.on("data",m=>{
        if(!m||typeof m!=="object") return;
        if(m.t==="hi"&&typeof m.uid==="string"&&m.uid.length<40&&m.uid!==st.me){
          uidOf=m.uid;
          const old=st.members.get(uidOf);
          if(old&&old!==conn){ try{ old.close(); }catch(e){} }
          st.members.set(uidOf,conn);
          if(m.p&&typeof m.p==="object") setPres(uidOf,m.p);
          safeSend(conn,{t:"snap",p:allPres()});
          relay({t:"u",id:uidOf,p:st.map.get(uidOf)||{}},uidOf);
        } else if(m.t==="p"&&uidOf&&m.p&&typeof m.p==="object"){
          setPres(uidOf,m.p);
          relay({t:"u",id:uidOf,p:m.p},uidOf);
        }
      });
      const gone=()=>{
        if(uidOf&&st.members.get(uidOf)===conn){
          st.members.delete(uidOf); dropPres(uidOf); relay({t:"bye",id:uidOf});
        }
      };
      conn.on("close",gone); conn.on("error",gone);
    };
    const becomeHub=peer=>{
      st.hub=true; st.peer=peer; st.up=null;
      peer.on("connection",hubAccept);
      peer.on("disconnected",()=>{ try{ if(!st.left) peer.reconnect(); }catch(e){} });
      peer.on("error",()=>{});
      if(!st.map.has(st.me)) setPres(st.me,st.mine);
      // after a hub hand-over, members that never reconnect are let go
      if(st.mig){
        clearTimeout(st.pruneT);
        st.pruneT=setTimeout(()=>{
          [...st.map.keys()].forEach(id=>{ if(id!==st.me&&!st.members.has(id)){ dropPres(id); relay({t:"bye",id}); } });
          st.mig=false;
        },5000);
      }
    };

    /* client role */
    const clientData=m=>{
      if(!m||typeof m!=="object") return;
      if(m.t==="snap"&&m.p&&typeof m.p==="object"){
        for(const id in m.p) if(id!==st.me&&m.p[id]&&typeof m.p[id]==="object") setPres(id,m.p[id]);
      } else if(m.t==="u"&&typeof m.id==="string"&&m.id!==st.me&&m.p&&typeof m.p==="object"){
        setPres(m.id,m.p);
      } else if(m.t==="bye"&&typeof m.id==="string"&&m.id!==st.me){
        dropPres(m.id);
      }
    };

    const makePeer=(id)=>new Promise(resolve=>{
      let done=false;
      const fin=v=>{ if(!done){ done=true; resolve(v); } };
      let p;
      try{ p=id?new window.Peer(id,cfg):new window.Peer(cfg); }
      catch(e){ return fin({err:"fail"}); }
      p.on("open",()=>fin({peer:p}));
      p.on("error",e=>{ if(!done){ fin({err:(e&&e.type)||"fail"}); try{ p.destroy(); }catch(x){} } });
      setTimeout(()=>{ if(!done){ fin({err:"timeout"}); try{ p.destroy(); }catch(x){} } },10000);
    });

    const connectToHub=peer=>new Promise(resolve=>{
      let done=false;
      const fin=v=>{ if(!done){ done=true; resolve(v); } };
      let conn;
      try{ conn=peer.connect(hubId,{serialization:"json"}); }catch(e){ return fin("fail"); }
      conn.on("open",()=>{
        st.up=conn;
        conn.on("data",clientData);
        safeSend(conn,{t:"hi",uid:st.me,p:st.mine});
        fin("ok");
      });
      conn.on("close",()=>{ if(st.up===conn){ st.up=null; migrate(); } });
      conn.on("error",()=>{ if(st.up===conn){ st.up=null; migrate(); } else fin("fail"); });
      peer.on("error",e=>{ if(e&&e.type==="peer-unavailable") fin("gone"); });
      setTimeout(()=>fin("timeout"),9000);
    });

    // one attempt at taking a role: first try to be the hub, else join it
    const attach=async()=>{
      const h=await makePeer(hubId);
      if(h.peer){ becomeHub(h.peer); return "ok"; }
      if(h.err!=="unavailable-id") return "fail";
      const c=await makePeer(null);
      if(!c.peer) return "fail";
      const r=await connectToHub(c.peer);
      if(r==="ok"){ st.hub=false; st.peer=c.peer; return "ok"; }
      try{ c.peer.destroy(); }catch(e){}
      return r==="gone"?"retry":"fail";
    };

    let migrating=false;
    async function migrate(){
      if(st.left||migrating) return;
      migrating=true; st.mig=true;
      for(let i=0;i<5&&!st.left;i++){
        await new Promise(r=>setTimeout(r,350+Math.random()*900));
        if(st.left) break;
        try{ if(st.peer) st.peer.destroy(); }catch(e){}
        st.peer=null;
        const r=await attach();
        if(r==="ok"){ migrating=false; return; }
      }
      migrating=false;
      if(!st.left) st.errHandlers.forEach(h=>{ try{ h({code:"upstream_error",message:"lost the room"}); }catch(e){} });
    }

    setPres(st.me,st.mine);
    let ok=false;
    for(let i=0;i<4&&!ok;i++){
      const r=await attach();
      if(r==="ok") ok=true;
      else if(r==="fail") break;
      else await new Promise(res=>setTimeout(res,300));
    }
    if(!ok){ st.left=true; throw {code:"upstream_error",message:"could not reach the matchmaking service"}; }

    const flush=()=>{
      st.sendT=0;
      if(st.left) return;
      if(st.hub) relay({t:"u",id:st.me,p:st.mine});
      else if(st.up) safeSend(st.up,{t:"p",p:st.mine});
    };
    return {
      peers:()=>snap(),
      onPeers(h,onError){
        st.handlers.add(h); if(onError) st.errHandlers.add(onError);
        return ()=>{ st.handlers.delete(h); if(onError) st.errHandlers.delete(onError); };
      },
      presence(patch){
        for(const k in patch){ if(patch[k]===null) delete st.mine[k]; else st.mine[k]=patch[k]; }
        setPres(st.me,st.mine);
        if(!st.sendT) st.sendT=setTimeout(flush,33);
        return Promise.resolve();
      },
      leave(){
        st.left=true; clearTimeout(st.sendT); clearTimeout(st.pruneT);
        try{ st.members.forEach(c=>{ try{ c.close(); }catch(e){} }); }catch(e){}
        try{ if(st.up) st.up.close(); }catch(e){}
        try{ if(st.peer) st.peer.destroy(); }catch(e){}
        st.handlers.clear(); st.errHandlers.clear();
        return Promise.resolve();
      }
    };
  }
};

/* ────────────────────────────── multiplayer ──────────────────────────────
   Players meet in a named room on the page's shared-room channel. Nothing is
   simulated centrally: every machine drives its own car with the normal
   physics and publishes its state (position, heading, speed, lap, damage)
   as presence about fifteen times a second; everyone else draws that car,
   eased toward where it should be by now. The host's presence carries the
   "go" that starts a race — circuit, mode and the grid order — so late
   packets and reconnects can't lose it. Only presence is used, so any
   level of access to the page is enough to take part. */

const MP={
  on:false, racing:false,
  api:null, room:null, code:"", name:"", me:"",
  ep:0, roster:[], rem:{}, unsubs:[],
  lobbyTrack:0, lobbyMode:"race",
  lastSend:0, finSince:0, boardHtml:"", boardOn:false, ctlSig:"", dead:false
};
const MP_MAX=8;

function mpClean(s,n){ return String(s==null?"":s).replace(/[^A-Za-z0-9 _\-]/g,"").trim().slice(0,n||12).toUpperCase(); }
function mpNum(v,d){ return (typeof v==="number"&&isFinite(v))?v:(d||0); }
function mpLoadName(){
  try{ const n=localStorage.getItem("sodium_name"); if(n){ const c=mpClean(n); if(c) return c; } }catch(e){}
  return "RACER"+(10+Math.floor(Math.random()*90));
}
function mpSaveName(n){ try{ localStorage.setItem("sodium_name",n); }catch(e){} }
function mpRandomCode(){
  const a="abcdefghjkmnpqrstuvwxyz"; let s="";
  for(let i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)];
  return s;
}

async function mpGetApi(){
  if(MP.api) return MP.api;
  try{ if(window.claude&&typeof window.claude.use==="function") MP.api=await window.claude.use("room"); }
  catch(e){ MP.api=null; }
  if(!MP.api) MP.api=p2pApi;           // anywhere but claude.ai: direct peer-to-peer
  return MP.api;
}

function mpMyPeer(){
  if(MP.me) return MP.me;
  if(!MP.room) return "";
  const m=MP.room.peers().find(p=>p.sameTab);
  if(m) MP.me=m.peer;
  return MP.me;
}

// everyone in the paddock, in one fixed order (the host is first)
function mpPlayers(){
  if(!MP.room) return [];
  const out=[];
  for(const p of MP.room.peers()){
    const pr=p.presence||{};
    if(p.kind!=="viewer"||typeof pr.nm!=="string") continue;
    const v=Math.floor(mpNum(pr.vh,0));
    out.push({
      peer:p.peer, me:!!p.sameTab, nm:mpClean(pr.nm)||"DRIVER",
      vh:(v>=0&&v<VEHICLES.length)?v:0,
      ph:pr.ph==="race"?"race":"lobby",
      lt:Math.floor(mpNum(pr.lt,0)), lm:pr.lm==="free"?"free":"race",
      go:pr.go||null
    });
  }
  out.sort((a,b)=>a.peer<b.peer?-1:a.peer>b.peer?1:0);
  return out;
}

function mpSendLobby(){
  if(!MP.room) return;
  MP.room.presence({nm:MP.name, vh:pickedVeh, ph:"lobby", lt:MP.lobbyTrack, lm:MP.lobbyMode}).catch(()=>{});
}

    if(msg&&el("mpErr")){ el("mpErr").textContent=msg; el("mpJoinBtn").disabled=false; }
  };
  el("mpJoinBtn").focus();
}

async function mpJoin(raw){
  const api=await mpGetApi();
  if(!api||typeof api.join!=="function") return "Multiplayer isn't available here.";
  const code=String(raw||"").toLowerCase().replace(/[^a-z0-9_.\-]/g,"").slice(0,24);
  if(!code) return "Enter a room code.";
  let room;
  try{ room=await api.join("sc-"+code); }
  catch(e){
    return (e&&e.code==="not_permitted")
      ? "Shared rooms aren't available to your account on this page."
      : "Couldn't reach the matchmaking service. Check your connection and try again.";
  }
  MP.room=room; MP.code=code; MP.on=true; MP.racing=false; MP.me="";
  MP.ep=0; MP.rem={}; MP.finSince=0; MP.dead=false; MP.ctlSig="";
  MP.lobbyTrack=0; MP.lobbyMode="race";
  MP.unsubs=[ room.onPeers(mpPeersChanged, ()=>{ MP.dead=true; if(state==="lobby"&&el("mpErr")) el("mpErr").textContent="Lost the connection to the room."; }) ];
  mpSendLobby();
  showLobby();
  return "";
}

async function mpLeave(){
  for(const u of MP.unsubs){ try{ u(); }catch(e){} }
  MP.unsubs=[];
  const r=MP.room;
  MP.room=null; MP.on=false; MP.racing=false; MP.rem={}; MP.me=""; MP.roster=[];
  try{ if(r) await r.leave(); }catch(e){}
  mode="race";
  cars=buildField(); snapCam();
  el("mpboard").style.display="none"; MP.boardOn=false;
  showMenu();
}

function showLobby(){
  state="lobby";
  overlay.classList.remove("hidden");
  MP.ctlSig="";
  ovc.innerHTML=`
    <div class="eyebrow">Multiplayer · room ${MP.code.toUpperCase()}</div>
    <h1 class="title">The <span>paddock</span></h1>
    <p class="sub" id="mpSub"></p>
    <div class="plist" id="mpList"></div>
    <div id="mpCtl" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
    <div class="mperr" id="mpErr"></div>
    <button class="cta" id="mpStart" disabled>Waiting for the host</button>
    <div class="mpform" style="max-width:260px;margin-top:14px">
      <label for="mpName2">Your name</label>
      <input id="mpName2" maxlength="12" autocomplete="off" spellcheck="false" value="${MP.name}">
    </div>
    <div class="btnrow">
      <button class="ghost" id="mpCar">Change car</button>
      <button class="ghost" id="mpLeaveBtn">Leave room</button>
    </div>`;
  el("mpName2").onchange=()=>{
    MP.name=mpClean(el("mpName2").value)||MP.name; el("mpName2").value=MP.name;
    mpSaveName(MP.name); mpSendLobby();
  };
  el("mpCar").onclick=showGarage;
  el("mpLeaveBtn").onclick=mpLeave;
  el("mpStart").onclick=mpStartRace;
  mpRefreshLobby();
}

function mpRefreshLobby(){
  if(state!=="lobby"||!MP.on||!el("mpList")) return;
  const ps=mpPlayers(), host=ps[0], iHost=!!(host&&host.me);
  if(host&&!iHost){ MP.lobbyTrack=host.lt; MP.lobbyMode=host.lm; }
  if(!(MP.lobbyTrack>=0&&MP.lobbyTrack<CIRCUITS.length)) MP.lobbyTrack=0;
  if(MP.lobbyMode==="race"&&CIRCUITS[MP.lobbyTrack].freeOnly){
    MP.lobbyTrack=Math.max(0,CIRCUITS.findIndex(c=>!c.freeOnly));
  }

  el("mpList").innerHTML=ps.map((p,i)=>`
    <div class="pl${p.me?" me":""}">
      <span class="sw" style="background:${VEHICLES[p.vh].color}"></span>
      <span class="nm">${p.nm}${p.me?" (you)":""}</span>
      <span class="tag">${VEHICLES[p.vh].name}</span>
      <span class="tag${i===0?" host":""}">${i===0?"host":p.ph==="race"?"racing":"ready"}</span>
    </div>`).join("")||`<div class="pl"><span class="nm">Connecting…</span></div>`;

  const inProgress=host&&host.go&&host.go.e!==MP.ep&&!(Array.isArray(host.go.r)&&host.go.r.some(a=>a&&a[0]===mpMyPeer()));
  el("mpSub").textContent = inProgress
    ? "A session is already under way. You'll join the next one."
    : ps.length<2
      ? "Share the room code, or wait for someone to join. You can start alone to try the circuit."
      : ps.length+" drivers in the paddock.";

  const sig=[iHost,MP.lobbyMode,MP.lobbyTrack,host?host.lt:"",host?host.lm:""].join("|");
  if(sig!==MP.ctlSig){
    MP.ctlSig=sig;
    const ctl=el("mpCtl");
    if(iHost){
      const opts=CIRCUITS.map((c,i)=>(MP.lobbyMode==="race"&&c.freeOnly)?"":
        `<option value="${i}"${i===MP.lobbyTrack?" selected":""}>${c.name}</option>`).join("");
      ctl.innerHTML=`
        <div class="seg">
          <button data-m="race" class="${MP.lobbyMode==="race"?"on":""}">Race · ${TOTAL_LAPS} laps</button>
          <button data-m="free" class="${MP.lobbyMode==="free"?"on":""}">Free drive</button>
        </div>
        <div class="mpform"><label for="mpTrack">Circuit</label><select id="mpTrack">${opts}</select></div>`;
      [...ctl.querySelectorAll(".seg button")].forEach(b=>b.onclick=()=>{
        MP.lobbyMode=b.dataset.m; mpSendLobby(); mpRefreshLobby();
      });
      el("mpTrack").onchange=()=>{ MP.lobbyTrack=+el("mpTrack").value; mpSendLobby(); mpRefreshLobby(); };
    } else {
      const c=CIRCUITS[MP.lobbyTrack];
      ctl.innerHTML=`<p class="sub" style="margin-top:16px">Host's pick: <b>${c.name}</b> · ${MP.lobbyMode==="race"?TOTAL_LAPS+"-lap race":"free drive"}</p>`;
    }
  }
  const st=el("mpStart");
  if(st){
    st.disabled=!iHost;
    st.textContent=iHost?(MP.lobbyMode==="race"?"Start race":"Start free drive"):"Waiting for the host";
  }
}

/* ── starting a session ── */

function mpStartRace(){
  if(!MP.room) return;
  const ps=mpPlayers();
  if(!ps.length||!ps[0].me) return;
  const crew=ps.filter(p=>p.me||p.ph==="lobby").slice(0,MP_MAX);
  const go={e:1+Math.floor(Math.random()*1e9), t:MP.lobbyTrack, m:MP.lobbyMode, r:crew.map(p=>[p.peer,p.nm,p.vh])};
  MP.room.presence({go}).catch(()=>{});
}

function mpCheckGo(){
  if(!MP.on||(state!=="lobby"&&state!=="garage")) return;
  const host=mpPlayers()[0];
  if(!host||!host.go) return;
  const g=host.go;
  if(typeof g.e!=="number"||g.e===MP.ep||!Array.isArray(g.r)) return;
  const track=Math.floor(mpNum(g.t,-1));
  if(!(track>=0&&track<CIRCUITS.length)) return;
  const roster=g.r.slice(0,MP_MAX).filter(a=>Array.isArray(a)&&typeof a[0]==="string").map(a=>({
    p:a[0], n:mpClean(a[1])||"DRIVER",
    v:(()=>{ const v=Math.floor(mpNum(a[2],0)); return (v>=0&&v<VEHICLES.length)?v:0; })()
  }));
  if(!roster.some(r=>r.p===mpMyPeer())) return;       // started without us
  mpBegin(track,g.m==="free"?"free":"race",g.e,roster);
}

function mpBegin(track,m,ep,roster){
  MP.roster=roster; MP.ep=ep; MP.rem={}; MP.racing=true; MP.finSince=0; MP.boardHtml="";
  mode=m;
  mpIngest(MP.room.peers());
  loadTrack(track);
  overlay.classList.add("hidden");
  resetRace();
  MP.lastSend=0;
  mpSendRace();
}

function mpToLobby(){
  MP.racing=false; MP.finSince=0;
  cars=buildField(); snapCam();
  const patch={ph:"lobby",ep:null,x:null,y:null,z:null,a:null,s:null,vx:null,vy:null,st:null,ro:null,pi:null,
               ni:null,ai:null,lp:null,ix:null,fn:null,ft:null,bl:null,dz:null};
  const host=mpPlayers()[0];
  if(host&&host.me) patch.go=null;
  if(MP.room) MP.room.presence(patch).catch(()=>{});
  mpSendLobby();
  showLobby();
}

function mpShowPause(){
  overlay.classList.remove("hidden");
  ovc.innerHTML=`
    <div class="eyebrow">Room ${MP.code.toUpperCase()} · ${CIRCUITS[pickedTrack].name}</div>
    <h1 class="title">Menu</h1>
    <p class="sub">A shared room can't be paused. Everyone else keeps driving while this is open.</p>
    <button class="cta" id="mpResumeBtn">Back to the track</button>
    <div class="btnrow">
      <button class="ghost" id="mpLobbyBtn">Back to the paddock</button>
      <button class="ghost" id="mpLeaveBtn2">Leave room</button>
    </div>`;
  el("mpResumeBtn").focus();
  el("mpResumeBtn").onclick=mpResume;
  el("mpLobbyBtn").onclick=mpToLobby;
  el("mpLeaveBtn2").onclick=mpLeave;
}
function mpResume(){ overlay.classList.add("hidden"); }

/* ── live traffic ── */

function mpIngest(list){
  const now=performance.now(), live={};
  for(const p of list){
    if(p.sameTab) continue;
    live[p.peer]=1;
    const prev=MP.rem[p.peer];
    if(!prev||prev.pr!==p.presence) MP.rem[p.peer]={pr:p.presence, at:now};
  }
  for(const k in MP.rem) if(!live[k]) delete MP.rem[k];
}

function mpPeersChanged(ch){
  if(!MP.on) return;
  mpIngest(ch.peers);
  if(MP.racing){
    const live=new Set(ch.peers.map(p=>p.peer));
    for(let i=cars.length-1;i>0;i--){
      const c=cars[i]; if(!c.remote) continue;
      const e=MP.rem[c.peer];
      if(!live.has(c.peer)||(c.seen&&e&&e.pr.ph!=="race")) cars.splice(i,1);
    }
  }
  if(state==="lobby") mpRefreshLobby();
  mpCheckGo();
}

function mpSendRace(){
  if(!MP.room||!MP.racing) return;
  const p=cars[0]; if(!p||!p.human) return;
  const R=(v,m)=>Math.round(mpNum(v)*m)/m;
  const dz=p.dmgZone||{};
  MP.room.presence({
    ph:"race", ep:MP.ep,
    x:R(p.x,10), y:R(p.y,10), z:R(p.z,10), a:R(p.ang,1000),
    s:R(p.speed,10), vx:R(p.vx,10), vy:R(p.vy,10),
    st:R(p.steer,100), ro:R(p.roll,100), pi:R(p.pitch,100), ni:R(p.nitroT||0,100), ai:p.air?1:0,
    lp:p.lap|0, ix:p.idx|0, fn:p.finished?1:0, ft:R(p.finishT||0,100),
    bl:p.bestLapT==null?null:R(p.bestLapT,100),
    dz:[R(dz.front,100),R(dz.rear,100),R(dz.left,100),R(dz.right,100)]
  }).catch(()=>{});
}

function mpTick(now){
  if(!MP.racing||MP.dead) return;
  if(state!=="racing"&&state!=="countdown") return;
  if(now-MP.lastSend>66){ MP.lastSend=now; mpSendRace(); }
}

// ease a remote car toward where its owner says it is, a little ahead
function mpApplyRemote(c,dt){
  const e=MP.rem[c.peer]; if(!e) return;
  const r=e.pr;
  if(!r||r.ph!=="race"||r.ep!==MP.ep) return;
  c.seen=true;
  const age=Math.min(0.3,(performance.now()-e.at)/1000);
  const vx=mpNum(r.vx), vy=mpNum(r.vy);
  const tx=mpNum(r.x)+vx*age, ty=mpNum(r.y)+vy*age;
  const far=Math.hypot(tx-c.x,ty-c.y)>160;
  const k=far?1:1-Math.exp(-dt*14);
  c.x+=(tx-c.x)*k; c.y+=(ty-c.y)*k;
  c.z+=(mpNum(r.z)-c.z)*k; c.gz=c.z;
  let da=mpNum(r.a)-c.ang;
  while(da>Math.PI) da-=6.283185; while(da<-Math.PI) da+=6.283185;
  c.ang+=da*(far?1:k);
  c.vx=vx; c.vy=vy; c.speed=mpNum(r.s);
  c.steer=mpNum(r.st); c.roll=mpNum(r.ro); c.pitch=mpNum(r.pi);
  c.nitroT=mpNum(r.ni); c.air=!!r.ai;
  c.lap=mpNum(r.lp)|0; c.idx=mpNum(r.ix)|0;
  c.finished=!!r.fn; c.finishT=mpNum(r.ft);
  c.bestLapT=(r.bl==null)?null:mpNum(r.bl);
  const dz=Array.isArray(r.dz)?r.dz:[];
  c.dmgZone={front:mpNum(dz[0]),rear:mpNum(dz[1]),left:mpNum(dz[2]),right:mpNum(dz[3])};
  c.damage=Math.max(c.dmgZone.front,c.dmgZone.rear,c.dmgZone.left,c.dmgZone.right);
}

/* ── on-screen: standings panel and name tags ── */

function mpBoard(){
  const b=el("mpboard"); if(!b) return;
  if(!(MP.on&&MP.racing&&(state==="racing"||state==="countdown"))){
    if(MP.boardOn){ b.style.display="none"; MP.boardOn=false; }
    return;
  }
  const racing=(mode==="race");
  const order=racing?standings():cars.slice();
  const html=order.map((c,i)=>{
    const who=c.human?"YOU":mpClean(c.name);
    const right=racing
      ? (c.finished?"FIN":"L"+Math.min(Math.max(c.lap,1),TOTAL_LAPS))
      : Math.round(Math.abs(c.speed)*0.62)+" km/h";
    return `<div class="mprow${c.human?" me":""}"><span>${racing?(i+1)+" ":""}${who}</span><i>${right}</i></div>`;
  }).join("");
  if(html!==MP.boardHtml){ MP.boardHtml=html; b.innerHTML=html; }
  if(!MP.boardOn){ b.style.display="block"; MP.boardOn=true; }
}

function mpNameTags(p){
  ctx.save();
  ctx.font="600 12px ui-monospace,Menlo,Consolas,monospace";
  ctx.textAlign="center";
  for(const c of cars){
    if(!c.remote) continue;
    const t=toCam(c.x,(c.gz||c.z||0)+24,c.y);
    if(t[2]<NEAR||t[2]>1500) continue;
    const sx=VW/2+t[0]*focal/t[2], sy=VH/2-t[1]*focal/t[2];
    if(sx<-80||sx>VW+80||sy<-20||sy>VH+20) continue;
    ctx.globalAlpha=Math.max(0.3,Math.min(1,1.25-t[2]/1200));
    const label=mode==="race"?c.name+" · P"+c.place:c.name;
    const w=ctx.measureText(label).width+16;
    ctx.fillStyle="rgba(11,15,20,.74)"; ctx.fillRect(sx-w/2,sy-9,w,18);
    ctx.fillStyle=c.color; ctx.fillRect(sx-w/2,sy-9,3,18);
    ctx.fillStyle="#e8e3d8"; ctx.fillText(label,sx+1,sy+4);
  }
  ctx.restore();
}

/* ────────────────────────────── loop ────────────────────────────── */

let prevT=performance.now(), acc=0;
const FIXED=1/120;
function frame(now){
  let dt=(now-prevT)/1000; prevT=now;
  if(dt>0.25) dt=0.25;
  frameDt=dt;
  if(DAYMODE==="sunset"){
    sunProgress=Math.min(1,sunProgress+dt/SUNSET_SECONDS);
    applyPalette();
    if(sunProgress>=1) setDayMode("day");   // "automatically changes to day ... after going to the high"
  }
  if(state==="racing"||state==="countdown"){
    acc+=dt;
    while(acc>=FIXED){ step(FIXED); acc-=FIXED; }
  }
  render();
  updateHud();
  if(MP.on) mpTick(now);
  requestAnimationFrame(frame);
}

applyPalette();
loadTrack(0);
cars=buildField();
showMenu();
requestAnimationFrame(frame);

})();
</script>
