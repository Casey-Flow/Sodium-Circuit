/* ────────────────────────────── audio ──────────────────────────────
   Everything synthesised with Web Audio — no sample files, so the game
   stays one self-contained document. Engine, tyres and nitro are three
   always-on nodes whose gain/pitch track the car each frame; crashes,
   the countdown, lap splits and menu clicks are short one-shot voices. */

let actx=null, masterGain=null, muted=false;
let engOsc1=null, engOsc2=null, engFilter=null, engGain=null;
let noiseBuf=null, tyreSrc=null, tyreFilter=null, tyreGain=null;
let nitroSrc=null, nitroFilter=null, nitroGain=null;
let lastBeepN=99, lastLapSeen=0;

function ensureAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  actx=new AC();
  masterGain=actx.createGain();
  masterGain.gain.value=muted?0:0.5;
  masterGain.connect(actx.destination);

  const len=actx.sampleRate*2;
  noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) nd[i]=Math.random()*2-1;

  engOsc1=actx.createOscillator(); engOsc1.type="sawtooth"; engOsc1.frequency.value=55;
  engOsc2=actx.createOscillator(); engOsc2.type="sawtooth"; engOsc2.frequency.value=55; engOsc2.detune.value=11;
  engFilter=actx.createBiquadFilter(); engFilter.type="lowpass"; engFilter.frequency.value=500; engFilter.Q.value=0.7;
  engGain=actx.createGain(); engGain.gain.value=0;
  engOsc1.connect(engFilter); engOsc2.connect(engFilter);
  engFilter.connect(engGain); engGain.connect(masterGain);
  engOsc1.start(); engOsc2.start();

  tyreSrc=actx.createBufferSource(); tyreSrc.buffer=noiseBuf; tyreSrc.loop=true;
  tyreFilter=actx.createBiquadFilter(); tyreFilter.type="bandpass";
  tyreFilter.frequency.value=1700; tyreFilter.Q.value=5;
  tyreGain=actx.createGain(); tyreGain.gain.value=0;
  tyreSrc.connect(tyreFilter); tyreFilter.connect(tyreGain); tyreGain.connect(masterGain);
  tyreSrc.start();

  nitroSrc=actx.createBufferSource(); nitroSrc.buffer=noiseBuf; nitroSrc.loop=true;
  nitroFilter=actx.createBiquadFilter(); nitroFilter.type="bandpass";
  nitroFilter.frequency.value=2400; nitroFilter.Q.value=1.1;
  nitroGain=actx.createGain(); nitroGain.gain.value=0;
  nitroSrc.connect(nitroFilter); nitroFilter.connect(nitroGain); nitroGain.connect(masterGain);
  nitroSrc.start();
}

function setMuted(v){
  muted=v;
  if(masterGain) masterGain.gain.setTargetAtTime(muted?0:0.5,actx.currentTime,0.05);
  const b=document.getElementById("mutebtn");
  if(b) b.textContent=muted?"MUTED":"SOUND";
}

// short synth voices for one-off events
function beep(freq,dur,type,vol){
  if(!actx) return;
  const o=actx.createOscillator(); o.type=type||"sine"; o.frequency.value=freq;
  const g=actx.createGain(); g.gain.value=0;
  o.connect(g); g.connect(masterGain);
  const t=actx.currentTime;
  g.gain.linearRampToValueAtTime(vol||0.3,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur+0.03);
}

function clickSfx(){ beep(1200,0.05,"square",0.10); }

function chime(){
  beep(660,0.16,"triangle",0.22);
  setTimeout(()=>beep(880,0.22,"triangle",0.20),70);
}

function thud(strength,human){
  if(!actx) return;
  const amt=Math.min(1,strength/500)*(human?1:0.4);
  const t=actx.currentTime;

  const o=actx.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(38,t+0.18);
  const g=actx.createGain(); g.gain.value=0;
  o.connect(g); g.connect(masterGain);
  g.gain.linearRampToValueAtTime(0.85*amt+0.12,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
  o.start(t); o.stop(t+0.26);

  const src=actx.createBufferSource(); src.buffer=noiseBuf;
  const f=actx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1100;
  const ng=actx.createGain(); ng.gain.value=0;
  src.connect(f); f.connect(ng); ng.connect(masterGain);
  ng.gain.linearRampToValueAtTime(0.55*amt+0.06,t+0.005);
  ng.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  src.start(t); src.stop(t+0.19);
}

function scrape(amt){
  if(!actx) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource(); src.buffer=noiseBuf;
  const f=actx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=2.2;
  const g=actx.createGain(); g.gain.value=0;
  src.connect(f); f.connect(g); g.connect(masterGain);
  g.gain.linearRampToValueAtTime(Math.min(0.28,amt),t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  src.start(t); src.stop(t+0.18);
}

// continuous engine/tyre/nitro voices, updated once a frame from the player car
function updateCarAudio(p){
  if(!actx||!p) return;
  const spd=Math.min(1,Math.abs(p.speed)/760);
  const gassing=(state==="racing")&&!p.flying;

  const f=55+spd*spd*400+(p.nitroActive?60:0);
  engOsc1.frequency.setTargetAtTime(f,actx.currentTime,0.03);
  engOsc2.frequency.setTargetAtTime(f,actx.currentTime,0.03);
  engFilter.frequency.setTargetAtTime(400+spd*2600,actx.currentTime,0.05);
  const eg=gassing?(0.10+spd*0.16):0.03;
  engGain.gain.setTargetAtTime(eg,actx.currentTime,0.06);

  const slipAmt=Math.min(1,(p.slip||0)*2.6);
  tyreFilter.frequency.setTargetAtTime(p.offTrack?900:1900,actx.currentTime,0.08);
  tyreGain.gain.setTargetAtTime(state==="racing"?slipAmt*0.30:0,actx.currentTime,0.05);

  nitroGain.gain.setTargetAtTime((p.nitroT||0)*0.22,actx.currentTime,0.04);
}

/* ────────────────────────────── simulation ────────────────────────────── */

function driveHuman(c,dt){
  if(MP.on&&!overlay.classList.contains("hidden")){ applyDrive(c,dt,0,0,0,false); return; }
  const gas=keys.gas?1:0, brake=keys.brake?1:0;
  let steerIn=(keys.left?-1:0)+(keys.right?1:0);
  applyDrive(c,dt,gas,brake,steerIn,keys.hand,keys.nitro);
}

function driveAI(c,dt){
  c.wobble+=dt*0.6;

  // A car with a rival close ahead presses harder rather than driving a
  // textbook line — same crash rules as everyone else, just more willing
  // to risk them. That's what actually gets an AI to spin, not a special case.
  const progress=c.lap*TRACK_LEN+c.idx*SPACING;
  let attack=0, rival=null, rivalGap=1e9;
  for(const o of cars){
    if(o===c||o.finished) continue;
    const gap=(o.lap*TRACK_LEN+o.idx*SPACING)-progress;
    if(gap>0&&gap<160&&gap<rivalGap){ rivalGap=gap; rival=o; attack=1-gap/160; }
  }

  // aim closer on tight or narrow circuits, or the line cuts across the road
  const look=Math.max(10,Math.round((20+c.speed*0.085)*Math.min(2.2,ROAD_W/130)*(c.lookMult||1)));
  const t=TRACK[(c.idx+look)%N];

  // signed turn direction ahead, so a car's own line style can pull it
  // toward the outside or the inside of THIS corner specifically — not a
  // fixed lateral offset, so different cars genuinely diverge through the
  // same bend instead of all riding an identical line with a paint-stripe
  // wobble on top
  let turnDir=TRACK[(c.idx+look)%N].ang-TRACK[c.idx].ang;
  while(turnDir>Math.PI) turnDir-=6.283185;
  while(turnDir<-Math.PI) turnDir+=6.283185;
  // a car's own line style shifts it toward the outside or inside of the
  // corner ahead — but only where there's road to spare. Scaling this UP
  // with corner sharpness (as a first pass did) adds the most lateral
  // demand exactly where the margin is smallest; it has to fade out under
  // a committed, tight apex instead and only show on straights and easy bends.
  const sharpness=Math.min(1,Math.abs(turnDir)*3);
  const styleOff=(c.lineStyle||0)*Math.sign(turnDir||1)*(1-sharpness*0.85)*Math.min(20,ROAD_W*0.13);

  // under attack the move isn't always clean — some of the time it drifts
  // toward whatever side the car ahead already occupies
  const squeeze=rival ? Math.sin(c.wobble*1.7+c.lane)*attack*ROAD_W*0.26 : 0;
  const laneOff=c.lane+styleOff+Math.sin(c.wobble)*Math.min(10,ROAD_W*0.065)+squeeze;
  const tx=t.x+t.nx*laneOff, ty=t.y+t.ny*laneOff;

  let want=Math.atan2(ty-c.y,tx-c.x)-c.ang;
  while(want>Math.PI)want-=6.283185;
  while(want<-Math.PI)want+=6.283185;
  const steerIn=Math.max(-1,Math.min(1,want*2.1));

  // brake for the sharpest thing in reach, not just one sample point
  const bl=Math.max(10,Math.round((30+c.speed*0.12)*Math.min(2.2,ROAD_W/130)*(c.lookMult||1)));
  let k=0;
  for(const m of [0.6,1.15]) k=Math.max(k,curvatureAhead(c.idx,Math.max(8,Math.round(bl*m))));
  const press=1-attack*0.86;                     // a real dive, not a nudge, at full attack
  // banking makes a corner genuinely easier, so the AI can rightly commit
  // to more speed through one, not just the player's own grip
  const bankRelief=1-Math.min(0.5,Math.abs((TRACK[c.idx]&&TRACK[c.idx].bank)||0)*1.6);
  const target=Math.max(190, c.maxSpeed*(1-Math.min(0.86,k*1.10*press*bankRelief)));
  const gas=c.speed<target?1:0;
  const brake=c.speed>target*(1.1+attack*0.3)?1:0;   // slow to react while committed to the move
  const behind=cars[0]&&!cars[0].finished&&c.place>cars[0].place&&c.nitro>0.3;
  applyDrive(c,dt,gas,brake,steerIn,false,(behind||attack>0.5)&&k<0.15);
}

function applyDrive(c,dt,gas,brake,steerIn,hand,nitroKey){
  if(c.immune>0) c.immune-=dt;
  if(c.crash>0){                       // spinning, but you can still catch it
    c.crash-=dt;
    steerIn*=0.55; gas*=0.45;
  }

  // Nitro: a burnable resource, not a free multiplier. Full tank is about
  // three seconds of continuous boost; empty takes roughly ten to refill.
  const wantNitro=!!nitroKey && gas && c.crash<=0 && !c.flying && c.nitro>0.01;
  c.nitroActive=wantNitro;
  if(wantNitro) c.nitro=Math.max(0,c.nitro-dt/3.0);
  else          c.nitro=Math.min(1,c.nitro+dt/9.5);
  const boost=wantNitro?1:0;
  c.nitroT=(c.nitroT||0)+((boost?1:0)-c.nitroT)*Math.min(1,dt*9);   // eased, for the flame/FOV

  // steering authority falls off with speed, weakest at standstill
  const spd=Math.abs(c.speed);
  // steering authority normally falls to zero at a standstill — a
  // four-wheel-steer car doesn't need forward speed to rotate, so it
  // gets a real floor instead of ramping from nothing
  const sf=c.pivot ? Math.max(1.0,Math.min(1,spd/70)) : Math.min(1,spd/70);
  // heavy damage starts eating into steering authority — noticeable, but
  // never total: a wrecked car should be hard to control, not undrivable
  const dmgPenalty=(c.damage>0.4)?1-Math.min(0.65,(c.damage-0.4)/0.6*0.65):1;
  let rate=(2.6-Math.min(1.35,spd/690*1.35))*sf*(c.turn||1)*dmgPenalty;
  // four-wheel steer keeps real authority in the air too — every other
  // car is nearly helpless once airborne, this one is barely troubled
  if(c.flying) rate*=c.pivot?0.85:0.32;
  c.steer+=(steerIn-c.steer)*Math.min(1,dt*11);
  c.ang+=c.steer*rate*dt*(c.speed<0?-1:1);   // steering mirrors when reversing

  c.ang+=c.av*dt;                      // impact-induced rotation
  c.av*=Math.pow(0.16,dt);

  const grassy=(c.offTrack&&!c.flying)?c.offGrip:1;
  c.stopT = spd<3 ? (c.stopT||0)+dt : 0;   // how long we have been stationary

  if(c.flying){
    c.speed-=18*dt;                    // just air drag up there
  } else {
    if(gas){
      if(c.speed<-0.5) c.speed=Math.min(0,c.speed+840*dt);   // brake out of reverse
      else c.speed+=c.accel*(1+0.6*boost)*grassy*dt;
    }
    // how hard the drive wheels are working, for wheelspin smoke off the line
    c.wheelForce=gas&&Math.abs(c.speed)<140 ? Math.min(1,c.accel*(1+0.6*boost)/460) : 0;
    c.gas=!!gas; c.braking=!!brake;
    if(brake){
      if(c.speed>0.5) c.speed=Math.max(0,c.speed-560*dt);    // service brake
      else if(c.speed<-0.5||c.stopT>0.22) c.speed-=c.accel*0.5*grassy*dt;   // then reverse
    }
    if(!gas&&!brake){
      const d=(80+spd*0.30)*dt;
      c.speed = spd<=d ? 0 : c.speed-Math.sign(c.speed)*d;
    }
    if(hand){
      const d=170*dt;
      c.speed = spd<=d ? 0 : c.speed-Math.sign(c.speed)*d;
    }
    if(c.crash>0){
      const d=130*dt;
      c.speed = spd<=d ? 0 : c.speed-Math.sign(c.speed)*d;
    }
  }

  const cap=c.maxSpeed*(1+0.16*boost)*((c.offTrack&&!c.flying)?(0.30+c.offGrip*0.42):1);
  const rcap=-Math.min(240,cap*0.4);

  if(wantNitro){
    c.nitroEmit=(c.nitroEmit||0)+dt;
    if(c.nitroEmit>0.02){
      c.nitroEmit=0;
      const hx=Math.cos(c.ang), hy=Math.sin(c.ang);
      for(let k=0;k<2;k++) particles.push({
        x:c.x-hx*22+(Math.random()-.5)*6, y:c.y-hy*22+(Math.random()-.5)*6,
        z:(c.gz||0)+8+Math.random()*3,
        vx:-hx*(60+Math.random()*40)+(Math.random()-.5)*30,
        vy:-hy*(60+Math.random()*40)+(Math.random()-.5)*30,
        life:.28, max:.28, col:Math.random()<0.4?"120,175,255":"225,240,255"
      });
    }
  }
  if(c.speed>cap) c.speed-=(c.speed-cap)*Math.min(1,dt*22);
  if(c.speed<rcap) c.speed-=(c.speed-rcap)*Math.min(1,dt*22);

  // velocity blends toward heading — the gap is the drift
  const hx=Math.cos(c.ang), hy=Math.sin(c.ang);
  // Lateral grip as a RATE — how quickly the velocity swings back in line with
  // the nose. Treating it as a per-frame retention made slides collapse in about
  // ten milliseconds, so nothing could ever hold a drift.
  let k=(4+(c.grip-0.884)*61)
        *((c.offTrack&&!c.flying)?(0.44+c.offGrip*0.42):1)
        *(hand?0.25:1)
        *(c.crash>0?0.6:1)
        *(c.flying?0.08:1)
        *(c.human?1:1.3)                   // the AI keeps a little more bite
        *(1+Math.abs((TRACK[c.idx]&&TRACK[c.idx].bank)||0)*1.8);   // banking holds the line for you
  const blend=1-Math.exp(-Math.max(0.2,k)*dt);
  c.vx=c.vx+((hx*c.speed)-c.vx)*blend;
  c.vy=c.vy+((hy*c.speed)-c.vy)*blend;

  const vmag=Math.hypot(c.vx,c.vy)||1;
  c.slip=Math.abs(c.vx/vmag*hy - c.vy/vmag*hx);   // |sin| of drift angle
  // This model has no true longitudinal-slip simulation — braking just
  // scales the speed scalar directly, so velocity always tracks heading
  // regardless of brake force. A real lockup signal can't be derived from
  // that, so it's approximated the same honest way wheelspin is: brake
  // force and speed stand in for how hard the tyres are working.
  // signed, not abs — once stopped, holding brake shifts into reverse
  // (by design), and that's acceleration, not a locked-up wheel
  c.lockup = (c.braking&&c.speed>90) ? Math.min(1,c.speed/520) : 0;
  if(!c.flying&&c.slip>0.08){
    const scrub=c.slip*c.slip*115*dt;
    c.speed = Math.abs(c.speed)<=scrub ? 0 : c.speed-Math.sign(c.speed)*scrub;
  }

  c.x+=c.vx*dt; c.y+=c.vy*dt;

  // small, unprompted position/heading pops — nothing the driver caused,
  // just the landscape's own corruption bleeding into the car itself.
  // Kept tiny and rare enough that it reads as a glitch, not a crash: any
  // overlap it happens to create gets caught and resolved by the same
  // tick's collision pass immediately afterward.
  if(!c.flying && CIRCUITS[pickedTrack].glitchy && Math.random()<0.0016){
    const jang=Math.random()*6.283185, jmag=3+Math.random()*8;
    c.x+=Math.cos(jang)*jmag; c.y+=Math.sin(jang)*jmag;
    c.ang+=(Math.random()-.5)*0.24;
  }
}

const GRAV=380;
let shake=0;

function crash(c,strength,dir,hitDX,hitDY){
  if(c.crash>0||c.immune>0) return;              // no chain reactions
  const sev=Math.max(0,Math.min(1,(strength-272)/480));
  c.crash=0.34+sev*0.72;
  c.av+=dir*(1.25+sev*2.5);
  c.speed*=0.88;
  c.immune=c.crash+1.25;

  // where it actually got hit, not just how hard — so damage (and the fire
  // that comes from it later) shows up on the right part of the car
  c.dmgZone=c.dmgZone||{front:0,rear:0,left:0,right:0};
  let zone;
  if(hitDX!==undefined){
    const hx=Math.cos(c.ang), hy=Math.sin(c.ang);
    const lf=hitDX*hx+hitDY*hy, lr=-hitDX*hy+hitDY*hx;
    zone=Math.abs(lf)>Math.abs(lr) ? (lf>0?"front":"rear") : (lr>0?"left":"right");
  } else {
    zone=["front","rear","left","right"][Math.floor(Math.random()*4)];
  }
  c.dmgZone[zone]=Math.min(1,c.dmgZone[zone]+0.18+sev*0.5);   // even a light knock starts a fire now
  c.damage=Math.max(c.dmgZone.front,c.dmgZone.rear,c.dmgZone.left,c.dmgZone.right);

  thud(strength,c.human);
  if(c.human) shake=Math.min(1.2,shake+0.45+strength/1120);
  for(let k=0;k<12;k++) particles.push({
    x:c.x, y:c.y, z:(c.gz||0)+4,
    vx:(Math.random()-.5)*180, vy:(Math.random()-.5)*180, life:.75, max:.75});
}

function vertical(c,dt){
  // Inside a loop the car is stuck to the road, not falling through the world.
  // Gravity acts along the path instead: climbing costs speed, dropping returns it.
  if(TRACK[c.idx].feat===3){
    const roll=TRACK[c.idx].roll||0;
    c.gz=terrainAt(c); c.z=c.gz; c.vz=0; c.air=false; c.flying=false;
    c.roll=roll; c.inLoop=true;
    c.pitch+=(0-c.pitch)*Math.min(1,dt*8);
    const dhds=LOOP_R*6.283185*Math.sin(roll)/(LOOP_LEN*SPACING);
    c.speed-=GRAV*dhds*dt;
    if(c.speed<115) c.speed=115;            // never quite stall on the ceiling
    const p=TRACK[c.idx], pull=Math.min(1,dt*2.6);
    c.x-=p.nx*c.off*pull; c.y-=p.ny*c.off*pull;   // the loop gathers you to its middle
    return;
  }
  if(c.inLoop){ c.roll=0; c.inLoop=false; }   // drop the loop's full turn cleanly
  const inTunnel=TRACK[c.idx].feat===4;

  let gz, slopeB, curv;
  if(HILLS){
    // sample the ground along the car's own heading — works on any street,
    // not just where the racing line happens to run
    const S=7, hx=Math.cos(c.ang), hy=Math.sin(c.ang);
    const h0=hillZ(c.x,c.y);
    const hb=hillZ(c.x-hx*S,c.y-hy*S), hf=hillZ(c.x+hx*S,c.y+hy*S);
    gz=h0; slopeB=(hf-hb)/(2*S); curv=(hf-2*h0+hb)/(S*S);
  } else {
    gz=terrainAt(c); slopeB=TRACK[c.idx].slopeB; curv=TRACK[c.idx].curv;
  }
  c.gz=gz;

  if(!c.air){
    c.z=gz;
    c.vz=slopeB*c.speed;                   // vertical rate implied by the slope

    // Leaving the ground is a question of speed, not just shape: holding the car
    // to a crest of curvature k needs v*v*k of downward acceleration, and gravity
    // only has GRAV to give. Go fast enough over the rise out of a dip and you fly
    // — unless the car is built to stay glued regardless, in which case it never does.
    const k=-curv;
    if(!c.grounded && !inTunnel && k>0 && k*c.speed*c.speed > GRAV*1.02) c.air=true;
  }

  if(c.air){
    c.vz-=GRAV*dt;
    c.z+=c.vz*dt;
    if(c.z<=gz){
      const impact=-c.vz;
      c.air=false; c.z=gz; c.vz=0;
      if(impact>100){
        for(let k=0;k<6;k++) particles.push({
          x:c.x, y:c.y, z:gz+3,
          vx:(Math.random()-.5)*90, vy:(Math.random()-.5)*90, life:.5, max:.5});
      }
      if(impact>190){
        c.speed*=0.88;
        if(c.human){ shake=Math.min(1.2,shake+impact/500); scrape(impact/900); }
      }
      // land sideways off a big jump and you are a passenger again
      if(impact>205&&c.slip>0.62) crash(c,impact,Math.random()<.5?1:-1);
    }
  }
  // only real air changes how the car drives
  c.flying=c.air&&(c.z-c.gz)>3;

  // Pitch: nose follows the slope on the ground, and the flight path in the air.
  const fwd=Math.max(60,Math.abs(c.speed));
  // slopeB is the ground's rise in the track's own forward direction — correct
  // for a car facing that way, but wrong if the car has actually turned around
  // and is touring the circuit backward: its nose then faces the opposite way,
  // and the slope it feels is the negative of what the raw track data says.
  const headAlign=Math.cos(c.ang-(TRACK[c.idx]?TRACK[c.idx].ang:c.ang));
  const tp=c.air ? Math.atan2(c.vz,fwd) : Math.atan(slopeB*headAlign);
  c.pitch+=(tp-c.pitch)*Math.min(1,dt*(c.air?5:10));

  // Roll: lean out of the corner, whatever camber is under the wheels, and
  // the track's own banking — the car should sit flush with a banked
  // corner exactly the way it sits flush with a cambered hill.
  let tr=0;
  if(!c.flying){
    tr=-c.steer*Math.min(1,Math.abs(c.speed)/430)*0.15;
    if(HILLS){
      const S=8, px=-Math.sin(c.ang), py=Math.cos(c.ang);
      tr+=Math.atan((hillZ(c.x+px*S,c.y+py*S)-hillZ(c.x-px*S,c.y-py*S))/(2*S));
    } else if(TRACK[c.idx]&&TRACK[c.idx].bank){
      tr-=TRACK[c.idx].bank;
    }
  }
  c.roll+=(tr-c.roll)*Math.min(1,dt*7);
}

// Circle against an oriented box, in the building's own frame.
function overlapWith(b,c){
  if(c.z>b.z+b.h) return null;                      // clear over the roof
  const co=Math.cos(b.ang), si=Math.sin(b.ang);
  const dx=c.x-b.x, dy=c.y-b.y;
  const lx=dx*co+dy*si, ly=-dx*si+dy*co;
  const qx=Math.max(-b.d,Math.min(b.d,lx));
  const qy=Math.max(-b.w,Math.min(b.w,ly));
  let nx=lx-qx, ny=ly-qy;
  const d=Math.hypot(nx,ny);
  let push;
  if(d>CAR_R) return null;
  if(d>0.001){ nx/=d; ny/=d; push=CAR_R-d; }
  else {                                            // centre inside: shortest way out
    const px=b.d-Math.abs(lx), py=b.w-Math.abs(ly);
    if(px<py){ nx=Math.sign(lx)||1; ny=0; push=px+CAR_R; }
    else     { nx=0; ny=Math.sign(ly)||1; push=py+CAR_R; }
  }
  return {push, nx:nx*co-ny*si, ny:nx*si+ny*co};    // normal in world space
}

// Deepest overlap only. Resolving every contact in turn would shove the car
// out of one building and straight into its neighbour.
function deepestOverlap(c){
  const gx=Math.floor(c.x/BCELL), gy=Math.floor(c.y/BCELL);
  let best=null;
  for(let ix=gx-1;ix<=gx+1;ix++){
    for(let iy=gy-1;iy<=gy+1;iy++){
      const list=BGRID.get(ix+":"+iy); if(!list) continue;
      for(const b of list){
        const o=overlapWith(b,c);
        if(o&&(!best||o.push>best.push)) best=o;
      }
    }
  }
  return best;
}

// Last resort: walk back to the racing line. Nothing may ever stay wedged.
function unstick(c){
  const p=TRACK[c.idx];
  for(let s=0;s<40;s++){
    if(!deepestOverlap(c)) break;
    const dx=p.x-c.x, dy=p.y-c.y, L=Math.hypot(dx,dy)||1;
    c.x+=dx/L*14; c.y+=dy/L*14;
  }
  if(deepestOverlap(c)){ c.x=p.x; c.y=p.y; c.z=p.z; }
  c.speed*=0.2; c.vx*=0.2; c.vy*=0.2;
  c.air=false; c.flying=false; c.vz=0;
  c.immune=Math.max(c.immune,1.0);
}

function hitBuildings(c){
  if(!BGRID||BGRID.size===0) return;
  const first=deepestOverlap(c);
  if(!first) return;

  c.x+=first.nx*first.push; c.y+=first.ny*first.push;
  for(let pass=0;pass<3;pass++){
    const o=deepestOverlap(c);
    if(!o) break;
    c.x+=o.nx*o.push; c.y+=o.ny*o.push;
  }
  if(deepestOverlap(c)){ unstick(c); return; }      // wedged: recover, do not jam

  const wx=first.nx, wy=first.ny;
  const vn=c.vx*wx+c.vy*wy;
  if(vn<0){
    c.vx-=wx*vn*1.12; c.vy-=wy*vn*1.12;             // slide along the wall
    const impact=-vn;
    c.speed*=1-0.85*Math.min(1,impact/(Math.abs(c.speed)+1));
    if(c.human){ shake=Math.min(1.2,shake+impact/900); scrape(impact/700); }
    if(impact>240) crash(c,impact,(Math.random()<0.5?1:-1),-wx,-wy);
    for(let k=0;k<4;k++) particles.push({
      x:c.x-wx*11, y:c.y-wy*11, z:(c.gz||0)+6,
      vx:-wx*(40+Math.random()*60)+(Math.random()-.5)*40,
      vy:-wy*(40+Math.random()*60)+(Math.random()-.5)*40,
      life:.35, max:.35, col:"255,238,190"});
  }
}

// Armco down both sides: you can still run wide onto the runoff, but you
// cannot cut across the infield to shorten a corner.
function hitBarrier(c){
  if(!BARRIER) return;
  const f=TRACK[c.idx].feat;
  if(f===3||f===4) return;                     // loops roll; tunnels have their own walls
  const lim=ROAD_W/2+BOFF-CAR_R;
  if(Math.abs(c.off)<=lim) return;

  const p=TRACK[c.idx], side=Math.sign(c.off)||1;
  const push=Math.abs(c.off)-lim;
  c.x-=p.nx*side*push; c.y-=p.ny*side*push;
  c.off=side*lim;

  const wx=-p.nx*side, wy=-p.ny*side;
  const vn=c.vx*wx+c.vy*wy;
  if(vn<0){
    c.vx-=wx*vn*1.1; c.vy-=wy*vn*1.1;          // scrape along it rather than stop dead
    const impact=-vn;
    c.speed*=1-0.72*Math.min(1,impact/(Math.abs(c.speed)+1));
    if(c.human){ shake=Math.min(1.2,shake+impact/950); scrape(impact/700); }
    if(impact>250) crash(c,impact,-side,-wx,-wy);
    for(let k=0;k<3;k++) particles.push({
      x:c.x-wx*11, y:c.y-wy*11, z:(c.gz||0)+7,
      vx:-wx*(40+Math.random()*60)+(Math.random()-.5)*40,
      vy:-wy*(40+Math.random()*60)+(Math.random()-.5)*40,
      life:.32, max:.32, col:"255,238,190"});
  }
}

// Tunnel walls and roof.
function hitTunnel(c){
  if(TRACK[c.idx].feat!==4) return;
  const p=TRACK[c.idx], lim=ROAD_W/2+16-CAR_R;
  if(Math.abs(c.off)>lim){
    const side=Math.sign(c.off)||1;
    const push=Math.abs(c.off)-lim;
    c.x-=p.nx*side*push; c.y-=p.ny*side*push;
    c.off=side*lim;
    const wx=-p.nx*side, wy=-p.ny*side;
    const vn=c.vx*wx+c.vy*wy;
    if(vn<0){
      c.vx-=wx*vn*1.1; c.vy-=wy*vn*1.1;
      const impact=-vn;
      c.speed*=1-0.7*Math.min(1,impact/(Math.abs(c.speed)+1));
      if(c.human){ shake=Math.min(1.2,shake+impact/900); scrape(impact/700); }
      if(impact>240) crash(c,impact,-side,-wx,-wy);
    }
  }
  if(p.roofed){
    const head=p.base-6-22;                    // ceiling, less the height of a car
    if(c.z>head){ c.z=head; if(c.vz>0) c.vz=0; }
  }
}

// Fire comes from wherever the car actually took damage — front, rear, or
// either side — not one fixed spot picked at random. A car hit head-on
// burns at the nose; T-boned on the left, it burns from the left.
function emitFireIfDamaged(c){
  if(!c.dmgZone||c.flying) return;
  const hx=Math.cos(c.ang), hy=Math.sin(c.ang), px=-hy, py=hx;
  const spots={
    front:[c.x+hx*11, c.y+hy*11],
    rear: [c.x-hx*11, c.y-hy*11],
    left: [c.x+px*6-hx*2, c.y+py*6-hy*2],
    right:[c.x-px*6-hx*2, c.y-py*6-hy*2]
  };
  for(const zone in c.dmgZone){
    const d=c.dmgZone[zone];
    if(!(d>0.12)) continue;
    const heat=(d-0.12)/0.88;
    const n=heat>0.7?3:heat>0.4?2:1;
    const [bx,by]=spots[zone];
    for(let k=0;k<n;k++){
      const tone=Math.random()<0.6;
      particles.push({
        x:bx+(Math.random()-.5)*7, y:by+(Math.random()-.5)*7, z:(c.gz||0)+4,
        vx:(Math.random()-.5)*10, vy:(Math.random()-.5)*10, vz:20+Math.random()*22,
        drag:0.965, size:0.55+Math.random()*0.55*heat,
        life:0.35+Math.random()*0.25, max:0.6, smoke:true,
        col: tone ? `255,${140+Math.floor(Math.random()*70)},40` : `${90+Math.floor(Math.random()*40)},${90+Math.floor(Math.random()*40)},${90+Math.floor(Math.random()*40)}`
      });
    }
  }
}

function laySkid(c){
  const shed=c.slip>0.20||(c.offTrack&&Math.abs(c.speed)>190);
  const hx=Math.cos(c.ang),hy=Math.sin(c.ang);
  const px=-hy,py=hx;
  const rear=-13;
  for(const s of [-1,1]){
    const x=c.x+hx*rear+px*s*8.5, y=c.y+hy*rear+py*s*8.5;
    const key=s<0?"skidL":"skidR";
    const prev=c[key];
    if(shed&&prev){
      marksCtx.strokeStyle=c.offTrack?"rgba(60,74,60,.5)":"rgba(0,0,0,.42)";
      marksCtx.lineWidth=5; marksCtx.lineCap="round";
      marksCtx.beginPath(); marksCtx.moveTo(prev[0],prev[1]); marksCtx.lineTo(x,y); marksCtx.stroke();
      skid3d.push([prev[0],prev[1],x,y,(c.gz||0)]);
      if(skid3d.length>300) skid3d.shift();
    }
    c[key]=[x,y];
  }
  if(c.offTrack&&c.speed>90&&Math.random()<0.5){
    particles.push({x:c.x-hx*14,y:c.y-hy*14,z:(c.gz||0)+3,
                    vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,life:.6,max:.6});
  }

  // tyre smoke: real slip (drifting), wheelspin off the line, or lockup
  // under a hard brake all cook the same rubber, just from different causes
  const wheelSpin=c.gas>0&&Math.abs(c.speed)<140&&c.wheelForce>0.55;
  const lockup=c.lockup>0.15;
  const smoking=!c.flying&&(c.slip>0.13||wheelSpin||lockup);
  if(smoking){
    const heat=Math.max(c.slip,c.wheelForce||0,c.lockup||0);
    const n=heat>0.6?3:2;
    for(let k=0;k<n;k++){
      const s=Math.random()<0.5?-1:1;
      const bx=c.x+hx*rear+px*s*8.5+(Math.random()-.5)*6;
      const by=c.y+hy*rear+py*s*8.5+(Math.random()-.5)*6;
      const tone=185+Math.floor(Math.random()*45);
      const life=0.8+Math.random()*0.5;
      particles.push({
        x:bx, y:by, z:(c.gz||0)+3,
        vx:-hx*(6+Math.random()*11)+(Math.random()-.5)*13,
        vy:-hy*(6+Math.random()*11)+(Math.random()-.5)*13,
        vz:9+Math.random()*13,           // billows upward rather than hanging flat
        drag:0.972,                      // slows and balloons out as it ages
        size:0.8+Math.random()*0.9,
        life, max:life, smoke:true,
        col:`${tone},${tone},${tone}`
      });
    }
  }
}

function collide(){
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
    const a=cars[i],b=cars[j];
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    const min=30;
    if(d<min&&d>0.01&&Math.abs(a.z-b.z)<14){
      const nx=dx/d, ny=dy/d, push=(min-d)/2;
      a.x-=nx*push; a.y-=ny*push; b.x+=nx*push; b.y+=ny*push;
      const bump=0.86;
      a.speed*=bump; b.speed*=bump;
      a.vx-=nx*40; a.vy-=ny*40; b.vx+=nx*40; b.vy+=ny*40;

      const rvx=a.vx-b.vx, rvy=a.vy-b.vy;
      const closing=rvx*nx+rvy*ny;          // along the contact normal only
      const ta=(a.human||a.remote)?296:22, tb=(b.human||b.remote)?296:22;
      if(closing>Math.min(ta,tb)){
        const sgn=Math.sign(nx*rvy-ny*rvx)||1;
        // the player's own threshold never drops — only how easily an AI spins does.
        // A remote driver's own machine decides whether *they* crash.
        if(closing>ta&&!a.remote) crash(a,closing,sgn,nx,ny);
        if(closing>tb&&!b.remote) crash(b,closing,-sgn,-nx,-ny);
      }
    }
  }
}

function updateProgress(c){
  const pr=project(c.x,c.y,c.idx);
  const prev=c.idx;
  c.idx=pr.idx; c.off=pr.off;
  const inside=STREETS.length
    ? Math.max(ROAD_W/2-Math.abs(pr.off), streetInside(c.x,c.y))
    : ROAD_W/2-Math.abs(pr.off);
  if(CIRCUITS[pickedTrack].boundless){
    // there is no track here to leave — full grip and no gravel-excursion
    // trigger, at any distance, unconditionally, not just within some
    // wide-but-finite corridor
    c.offTrack=false; c.edge=-1e7;
  } else {
    c.offTrack=inside<4;
    c.edge=-inside;                     // how far beyond the tarmac we are
  }

  // crossing the line: index wraps from the last quarter to the first
  if(prev>N*0.75 && c.idx<N*0.25){
    c.lap++;
    if(c.lap>1){
      const t=raceTime-c.lapStart;
      c.lastLapT=t;
      if(c.bestLapT===null||t<c.bestLapT) c.bestLapT=t;
    }
    c.lapStart=raceTime;
    if(c.human && c.lap>1) chime();
    if(mode==="race" && c.lap>TOTAL_LAPS && !c.finished){
      c.finished=true; c.finishT=raceTime; finishOrder.push(c);
    }
  } else if(prev<N*0.25 && c.idx>N*0.75){
    c.lap--;
  }
}

function standings(){
  return [...cars].sort((a,b)=>{
    if(a.finished&&b.finished) return a.finishT-b.finishT;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return (b.lap*TRACK_LEN+b.idx*SPACING)-(a.lap*TRACK_LEN+a.idx*SPACING);
  });
}

function step(dt){
  if(state==="countdown"){
    countdown-=dt;
    const n=Math.ceil(countdown-0.6);
    if(n!==lastBeepN){
      lastBeepN=n;
      if(n>0) beep(520,0.12,"square",0.22);
      else if(n<=0) beep(880,0.26,"square",0.28);
    }
    if(countdown<=0){ state="racing"; cars.forEach(c=>c.lapStart=0); }
    return;
  }
  if(state!=="racing") return;
  raceTime+=dt;
  tick++;

  for(const c of cars){
    if(c.remote){ mpApplyRemote(c,dt); if(tick%2===0) emitFireIfDamaged(c); continue; }
    if(c.finished){ applyDrive(c,dt,0,0,0,true); }
    else if(c.human) driveHuman(c,dt);
    else driveAI(c,dt);
    if(tick%3===0) laySkid(c);
    if(tick%2===0) emitFireIfDamaged(c);
    updateProgress(c);
    hitBuildings(c);
    hitBarrier(c);
    hitTunnel(c);
    hitLamps(c,dt);
    vertical(c,dt);
    if(!c.air&&Math.abs(c.speed)>(c.human?528:140)&&c.edge>(c.human?135:14))
      crash(c,c.speed*0.42,Math.random()<0.5?1:-1);
  }
  collide();

  for(const p of particles){
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z=(p.z||0)+(p.vz||0)*dt; p.life-=dt;
    if(p.drag){ p.vx*=p.drag; p.vy*=p.drag; p.vz*=p.drag; }
  }
  shake*=Math.pow(0.02,dt);
  particles=particles.filter(p=>p.life>0);
  if(particles.length>520) particles.splice(0,particles.length-520);

  const order=standings();
  order.forEach((c,i)=>c.place=i+1);
  if(mode==="race" && cars[0].finished){
    if(!MP.on) endRace();
    else {
      // shared room: wait for the others to cross the line, but not forever
      if(!MP.finSince) MP.finSince=raceTime;
      const rest=cars.filter(c=>c.remote);
      if(rest.every(c=>c.finished)||raceTime-MP.finSince>20) endRace();
    }
  }
}

function endRace(){
  // settle the AI order so the classification is complete
  const order=standings();
  state="results";
  showResults(order);
}

/* ────────────────────────────── 3d renderer ────────────────────────────── */

let camMode=0;                       // 0 chase · 1 bonnet · 2 orbit · 3 top-down · 4 cockpit
const CAMNAME=["Chase","Bonnet","Orbit","Overhead","Cockpit"];
const orbit={yaw:2.5, pitch:0.34, dist:120, idle:0};
const cam={x:0,y:0,h:34,yaw:0};
let EYE=[0,0,0], FW=[0,0,1], RT=[1,0,0], UP=[0,1,0], focal=600;
let frameDt=1/60;

const NEAR=5;
let DAY=false;
let DAYMODE="night";           // "night" | "day" | "sunset"
let sunProgress=0;             // 0..1 while in sunset — the sun's climb
let DAYT=0;                    // 0 (night) .. 1 (day) blend used for the 2D view etc.
const SUNSET_SECONDS=26;       // "slowly rises"
const SUN_AZ=1.15;             // fixed world direction the sun sits in
let STARS=null;
let HAZE=[27,22,20], ASPHALT=[36,40,46], GROUND=[13,17,21];
let SKYT="#04060a", SKYM="#0b0d14", SKYB="#191319";
let HORIZ="255,150,60", HORIZA=0.16, GROUNDB="#090c10";
let LAMPA=1, VIGN=0.62, SHADOWA=0.45;
let AMB=0.32, DIFK=0.74;
let WARM=[255,168,72], WARMK=0.17, COOL=[44,62,92], COOLK=0.11, SPEC=[255,228,186];
let BLD_A=[26,30,38], BLD_B=[46,41,44], WINCOL=[255,196,120];
let W2D_BG="#0d1116", W2D_DOT="rgba(30,42,36,.55)", W2D_SHOULDER="#171b21", W2D_ROAD="#22262c";

const PAL_NIGHT={
  HAZE:[27,22,20], ASPHALT:[36,40,46], GROUND:[13,17,21],
  SKYT:[4,6,10], SKYM:[11,13,20], SKYB:[25,19,25],
  HORIZ:[255,150,60], HORIZA:0.16, GROUNDB:[9,12,16],
  LAMPA:1, VIGN:0.62, SHADOWA:0.45, AMB:0.32, DIFK:0.74,
  WARM:[255,168,72], WARMK:0.17, COOL:[44,62,92], COOLK:0.11, SPEC:[255,228,186],
  BLD_A:[26,30,38], BLD_B:[46,41,44], WINCOL:[255,196,120],
  W2D_BG:[13,17,22], W2D_DOT:"rgba(30,42,36,.55)", W2D_SHOULDER:[23,27,33], W2D_ROAD:[34,38,44]
};
const PAL_DAY={
  HAZE:[158,176,196], ASPHALT:[88,93,100], GROUND:[74,96,62],
  SKYT:[93,146,207], SKYM:[150,189,224], SKYB:[207,226,238],
  HORIZ:[255,240,214], HORIZA:0.30, GROUNDB:[74,99,64],
  LAMPA:0.05, VIGN:0.26, SHADOWA:0.55, AMB:0.54, DIFK:0.58,
  WARM:[255,248,226], WARMK:0.12, COOL:[128,158,196], COOLK:0.16, SPEC:[255,255,248],
  BLD_A:[122,127,136], BLD_B:[152,142,138], WINCOL:[86,104,124],
  W2D_BG:[91,114,72], W2D_DOT:"rgba(96,124,74,.55)", W2D_SHOULDER:[76,81,88], W2D_ROAD:[118,123,131]
};
function lerpN(a,b,t){ return a+(b-a)*t; }
function mixArr(a,b,t){ return [lerpN(a[0],b[0],t),lerpN(a[1],b[1],t),lerpN(a[2],b[2],t)]; }

function applyPalette(){
  const t = DAYMODE==="day" ? 1 : DAYMODE==="sunset" ? sunProgress : 0;
  DAYT=t;
  HAZE=mixArr(PAL_NIGHT.HAZE,PAL_DAY.HAZE,t);
  ASPHALT=mixArr(PAL_NIGHT.ASPHALT,PAL_DAY.ASPHALT,t);
  GROUND=mixArr(PAL_NIGHT.GROUND,PAL_DAY.GROUND,t);
  SKYT=rgbs(mixArr(PAL_NIGHT.SKYT,PAL_DAY.SKYT,t));
  SKYM=rgbs(mixArr(PAL_NIGHT.SKYM,PAL_DAY.SKYM,t));
  SKYB=rgbs(mixArr(PAL_NIGHT.SKYB,PAL_DAY.SKYB,t));
  HORIZ=mixArr(PAL_NIGHT.HORIZ,PAL_DAY.HORIZ,t).map(v=>v|0).join(",");
  HORIZA=lerpN(PAL_NIGHT.HORIZA,PAL_DAY.HORIZA,t);
  GROUNDB=rgbs(mixArr(PAL_NIGHT.GROUNDB,PAL_DAY.GROUNDB,t));
  LAMPA=lerpN(PAL_NIGHT.LAMPA,PAL_DAY.LAMPA,t);
  VIGN=lerpN(PAL_NIGHT.VIGN,PAL_DAY.VIGN,t);
  SHADOWA=lerpN(PAL_NIGHT.SHADOWA,PAL_DAY.SHADOWA,t);
  AMB=lerpN(PAL_NIGHT.AMB,PAL_DAY.AMB,t);
  DIFK=lerpN(PAL_NIGHT.DIFK,PAL_DAY.DIFK,t);
  WARM=mixArr(PAL_NIGHT.WARM,PAL_DAY.WARM,t);
  WARMK=lerpN(PAL_NIGHT.WARMK,PAL_DAY.WARMK,t);
  COOL=mixArr(PAL_NIGHT.COOL,PAL_DAY.COOL,t);
  COOLK=lerpN(PAL_NIGHT.COOLK,PAL_DAY.COOLK,t);
  SPEC=mixArr(PAL_NIGHT.SPEC,PAL_DAY.SPEC,t);
  BLD_A=mixArr(PAL_NIGHT.BLD_A,PAL_DAY.BLD_A,t);
  BLD_B=mixArr(PAL_NIGHT.BLD_B,PAL_DAY.BLD_B,t);
  WINCOL=mixArr(PAL_NIGHT.WINCOL,PAL_DAY.WINCOL,t);
  W2D_BG=rgbs(mixArr(PAL_NIGHT.W2D_BG,PAL_DAY.W2D_BG,t));
  W2D_DOT=t<0.5?PAL_NIGHT.W2D_DOT:PAL_DAY.W2D_DOT;
  W2D_SHOULDER=rgbs(mixArr(PAL_NIGHT.W2D_SHOULDER,PAL_DAY.W2D_SHOULDER,t));
  W2D_ROAD=rgbs(mixArr(PAL_NIGHT.W2D_ROAD,PAL_DAY.W2D_ROAD,t));
}

function setDayMode(m){
  DAYMODE=m;
  DAY=(m==="day");
  if(m==="sunset") sunProgress=0;
  applyPalette();
  if(worldCv) paintWorld();
  const b=document.getElementById("daybtn");
  if(b) b.textContent = m==="day"?"DAY":m==="sunset"?"SUNSET":"NIGHT";
}
function setDay(v){ setDayMode(v?"day":"night"); }
function cycleDayMode(){
  setDayMode(DAYMODE==="night"?"sunset":DAYMODE==="sunset"?"day":"night");
}

function rgbs(c,a){
  const r=Math.max(0,Math.min(255,c[0]|0)),
        g=Math.max(0,Math.min(255,c[1]|0)),
        b=Math.max(0,Math.min(255,c[2]|0));
  return a===undefined ? "rgb("+r+","+g+","+b+")" : "rgba("+r+","+g+","+b+","+a+")";
}
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function shade(c,f){ return [c[0]*f, c[1]*f, c[2]*f]; }
function hex2rgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

// Swings around the car: drag or Q/E to rotate, scroll to pull back.
// Left alone with the car stopped, it turns into a slow turntable.
// Solid buildings mean the chase camera can end up inside one — pull it in.
function pointInBuilding(x,y,h){
  if(!BGRID||BGRID.size===0) return false;
  const list=BGRID.get(Math.floor(x/BCELL)+":"+Math.floor(y/BCELL));
  if(!list) return false;
  for(const b of list){
    if(h>b.z+b.h) continue;
    const co=Math.cos(b.ang), si=Math.sin(b.ang);
    const dx=x-b.x, dy=y-b.y;
    if(Math.abs(dx*co+dy*si)<b.d+7&&Math.abs(-dx*si+dy*co)<b.w+7) return true;
  }
  return false;
}
function cameraClear(p){
  for(let i=0;i<6&&pointInBuilding(cam.x,cam.y,cam.h);i++){
    cam.x+=(p.x-cam.x)*0.3; cam.y+=(p.y-cam.y)*0.3;
  }
}

function setupOrbit(p){
  const dt=frameDt;
  if(keys.orbL){ orbit.yaw-=1.9*dt; orbit.idle=2; }
  if(keys.orbR){ orbit.yaw+=1.9*dt; orbit.idle=2; }
  if(orbit.idle>0) orbit.idle-=dt;
  else if(Math.abs(p.speed)<25) orbit.yaw+=dt*0.32;

  const yaw=p.ang+orbit.yaw;
  const flat=Math.cos(orbit.pitch)*orbit.dist;
  const tx=p.x-Math.cos(yaw)*flat, ty=p.y-Math.sin(yaw)*flat;
  const th=p.z+7+Math.sin(orbit.pitch)*orbit.dist;

  const k=Math.min(1,dt*13);
  cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k; cam.h+=(th-cam.h)*k;
  cam.yaw=yaw;
  cameraClear(p);

  const sk=shake*5;
  EYE=[cam.x+(Math.random()-.5)*sk, cam.h+(Math.random()-.5)*sk*0.8, cam.y+(Math.random()-.5)*sk];

  let fx=p.x-EYE[0], fy=p.z+9-EYE[1], fz=p.y-EYE[2];
  const fl=Math.hypot(fx,fy,fz)||1; FW=[fx/fl,fy/fl,fz/fl];
  const rl=Math.hypot(-FW[2],FW[0])||1; RT=[-FW[2]/rl,0,FW[0]/rl];
  UP=[RT[1]*FW[2]-RT[2]*FW[1], RT[2]*FW[0]-RT[0]*FW[2], RT[0]*FW[1]-RT[1]*FW[0]];
  focal=(VH/2)/Math.tan(50*Math.PI/360);
}

let camRevBlend=0, camRevTarget=0;   // chase cam swings round to look back in reverse

function setupCam(p){
  if(camMode===2) return setupOrbit(p);
  const dt=frameDt;
  const bonnet=camMode===1;
  const cockpit=camMode===4;
  const inside=bonnet||cockpit;
  const back = cockpit ? -2 : bonnet ? -4 : 74;
  const hgt  = cockpit ? 13 : bonnet ? 15 : 33;

  let d=p.ang-cam.yaw;
  while(d>Math.PI)d-=6.283185; while(d<-Math.PI)d+=6.283185;
  cam.yaw+=d*Math.min(1,dt*(inside?16:5.5));

  // hysteresis so the swing doesn't flicker right around a standstill —
  // only chase mode looks back; the inside views stay fixed through the
  // windshield either way
  if(!inside){
    if(p.speed<-14) camRevTarget=1;
    else if(p.speed>14) camRevTarget=0;
  } else camRevTarget=0;
  camRevBlend+=(camRevTarget-camRevBlend)*Math.min(1,dt*3.2);
  const revSign=1-2*camRevBlend;   // +1 normal chase, -1 fully swung round

  const wantX=p.x-Math.cos(cam.yaw)*back*revSign, wantY=p.y-Math.sin(cam.yaw)*back*revSign;
  const k=Math.min(1,dt*(inside?22:10));
  cam.x+=(wantX-cam.x)*k; cam.y+=(wantY-cam.y)*k;
  cam.h+=((p.z+hgt)-cam.h)*Math.min(1,dt*(inside?20:7));
  if(!inside) cameraClear(p);

  const sk=shake*7;
  EYE=[cam.x+(Math.random()-.5)*sk, cam.h+(Math.random()-.5)*sk*0.8, cam.y+(Math.random()-.5)*sk];
  const aim=inside?110:90;
  let fx=p.x+Math.cos(cam.yaw)*aim*revSign-EYE[0],
      fy=p.z+(inside?11:9)-EYE[1],
      fz=p.y+Math.sin(cam.yaw)*aim*revSign-EYE[2];
  const fl=Math.hypot(fx,fy,fz)||1; FW=[fx/fl,fy/fl,fz/fl];

  const rl=Math.hypot(-FW[2],FW[0])||1; RT=[-FW[2]/rl,0,FW[0]/rl];
  UP=[RT[1]*FW[2]-RT[2]*FW[1], RT[2]*FW[0]-RT[0]*FW[2], RT[0]*FW[1]-RT[1]*FW[0]];

  const fovBase=cockpit?76:58;
  const fov=(fovBase+Math.min(16,Math.abs(p.speed)/760*16)+((p.nitroT||0)*7))*Math.PI/180;
  focal=(VH/2)/Math.tan(fov/2);
}
document.getElementById("daybtn").onclick=()=>{ clickSfx(); cycleDayMode(); };
document.getElementById("mutebtn").onclick=()=>{ ensureAudio(); setMuted(!muted); };

document.getElementById("pausebtn").onclick=()=>{
  clickSfx();
  if(state==="racing"||state==="countdown") showPause();
  else if(state==="paused") resume();
};

let orbDrag=false, orbPX=0, orbPY=0;
cv.addEventListener("pointerdown",e=>{
  if(camMode!==2) return;
  orbDrag=true; orbit.idle=2; orbPX=e.clientX; orbPY=e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove",e=>{
  if(!orbDrag) return;
  orbit.yaw-=(e.clientX-orbPX)*0.0085;
  orbit.pitch=Math.max(0.05,Math.min(1.25,orbit.pitch+(e.clientY-orbPY)*0.006));
  orbPX=e.clientX; orbPY=e.clientY; orbit.idle=2;
});
for(const ev of ["pointerup","pointercancel"]) cv.addEventListener(ev,()=>{ orbDrag=false; });
cv.addEventListener("wheel",e=>{
  if(camMode!==2) return;
  orbit.dist=Math.max(46,Math.min(340,orbit.dist*(1+e.deltaY*0.0012)));
  orbit.idle=2; e.preventDefault();
},{passive:false});

function snapCam(){
  const p=cars[0]; if(!p) return;
  cam.yaw=p.ang; cam.h=(p.z||0)+33; shake=0;
  cam.x=p.x-Math.cos(p.ang)*64; cam.y=p.y-Math.sin(p.ang)*64;
  camRevBlend=0; camRevTarget=0;
}

function toCam(x,h,y){
  const dx=x-EYE[0], dy=h-EYE[1], dz=y-EYE[2];
  return [dx*RT[0]+dy*RT[1]+dz*RT[2], dx*UP[0]+dy*UP[1]+dz*UP[2], dx*FW[0]+dy*FW[1]+dz*FW[2]];
}
function clipNear(poly){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const ain=a[2]>=NEAR, bin=b[2]>=NEAR;
    if(ain) out.push(a);
    if(ain!==bin){
      const t=(NEAR-a[2])/(b[2]-a[2]);
      out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, NEAR]);
    }
  }
  return out;
}
function fillPoly(poly,style){
  const c=clipNear(poly);
  if(c.length<3) return;
  ctx.beginPath();
  for(let i=0;i<c.length;i++){
    const sx=VW/2+c[i][0]*focal/c[i][2], sy=VH/2-c[i][1]*focal/c[i][2];
    i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);
  }
  ctx.closePath(); ctx.fillStyle=style; ctx.fill();
}
// flat ground quad from four [x,y] world pairs
function ground(a,b,c,d,style,h){
  const y=h||0;
  fillPoly([toCam(a[0],y,a[1]),toCam(b[0],y,b[1]),toCam(c[0],y,c[1]),toCam(d[0],y,d[1])],style);
}

let DRAW=270;
function segmentList(from,dir){
  const list=[]; let i=from, step=1;
  for(let d=0;d<DRAW;){
    list.push({i,step,d});
    d+=step; i=(i+step*dir+N*4)%N;
    step = URBAN ? (d>120?8:d>60?4:d>22?2:1)
                 : (d>180?8:d>95?4:d>36?2:1);
  }
  return list;
}

function edge(i,side,extra,drop){
  const p=TRACK[i], k=side*(ROAD_W/2+(extra||0));
  if(p.feat===3){                                  // rolled cross-section
    const cr=Math.cos(p.roll), sr=Math.sin(p.roll);
    return [p.x+p.nx*k*cr, p.y+p.ny*k*cr, p.z+k*sr-(drop||0)];
  }
  const x=p.x+p.nx*k, y=p.y+p.ny*k;
  let z=HILLS ? p.z+(hillZ(x,y)-p.base) : p.z;
  if(p.bank) z-=k*Math.tan(p.bank);                // outside rises, inside dips
  return [x, y, z-(drop||0)];
}
// quad from four [x,y,z] points
function quadZ(a,b,c,d,style){
  fillPoly([toCam(a[0],a[2],a[1]),toCam(b[0],b[2],b[1]),
            toCam(c[0],c[2],c[1]),toCam(d[0],d[2],d[1])],style);
}

function drawStreets(){
  const chunks=[];
  for(const st of STREETS){
    const dx=st.bx-st.ax, dy=st.by-st.ay, L=Math.hypot(dx,dy);
    const ux=dx/L, uy=dy/L;
    const n=Math.ceil(L/110);
    for(let k=0;k<n;k++){
      const t0=L*k/n, t1=L*(k+1)/n;
      const mx=st.ax+ux*(t0+t1)/2, my=st.ay+uy*(t0+t1)/2;
      if((mx-EYE[0])*FW[0]+(my-EYE[2])*FW[2] < -320) continue;
      const d=Math.hypot(mx-EYE[0],my-EYE[2]);
      if(d>1250) continue;
      chunks.push({st,ux,uy,t0,t1,d,k});
    }
  }
  chunks.sort((a,b)=>b.d-a.d);

  for(const ch of chunks){
    const st=ch.st, ux=ch.ux, uy=ch.uy, px=-uy, py=ux;
    const fog=Math.min(0.92,Math.pow(ch.d/1350,1.3));
    const a=[st.ax+ux*ch.t0, st.ay+uy*ch.t0];
    const b=[st.ax+ux*ch.t1, st.ay+uy*ch.t1];
    const P=(pt,o,z)=>{
      const X=pt[0]+px*o, Y=pt[1]+py*o;
      return [X, Y, hillZ(X,Y)+(z||0)];
    };

    // pavements
    const kerb=rgbs(mix([62,66,73],HAZE,fog));
    for(const sd of [1,-1]){
      quadZ(P(a,sd*st.hw),P(b,sd*st.hw),P(b,sd*(st.hw+20)),P(a,sd*(st.hw+20)),kerb);
    }
    // carriageway
    quadZ(P(a,st.hw),P(b,st.hw),P(b,-st.hw),P(a,-st.hw),
          rgbs(mix([34,38,45],HAZE,fog)));

    // centre line and a lamp on alternate blocks
    if(ch.d<720){
      const m0=[a[0]+(b[0]-a[0])*0.3, a[1]+(b[1]-a[1])*0.3];
      const m1=[a[0]+(b[0]-a[0])*0.7, a[1]+(b[1]-a[1])*0.7];
      quadZ(P(m0,1.6,0.2),P(m1,1.6,0.2),P(m1,-1.6,0.2),P(m0,-1.6,0.2),
            "rgba(232,227,216,.18)");
    }
    if(ch.k%2===0&&ch.d<900){
      const lx=a[0]+px*(st.hw+15), ly=a[1]+py*(st.hw+15), lz=hillZ(lx,ly);
      fillPoly([toCam(lx,lz,ly),toCam(lx+2.4,lz,ly),
                toCam(lx+2.4,lz+86,ly),toCam(lx,lz+86,ly)],
               rgbs(mix([58,64,72],HAZE,fog)));
      const head=toCam(lx,lz+90,ly);
      if(head[2]>NEAR){
        const sx=VW/2+head[0]*focal/head[2], sy=VH/2-head[1]*focal/head[2];
        const r=Math.max(3,760/head[2]);
        const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r*3);
        g.addColorStop(0,"rgba(255,190,110,"+(0.6*(1-fog)*LAMPA)+")");
        g.addColorStop(1,"rgba(255,170,70,0)");
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,r*3,0,7); ctx.fill();
      }
    }
  }
}

function drawRoad(p){
  // The segment list always used to walk forward (+idx) from the car,
  // which is only correct if the car is actually facing that way. A car
  // that's turned around and is touring the course backward was getting a
  // list of points behind it — nothing was ever added for what its camera
  // was actually looking at, which is exactly what "no render distance
  // when backtracking" looks like.
  const dir=Math.cos(p.ang-(TRACK[p.idx]?TRACK[p.idx].ang:p.ang))>=0 ? 1 : -1;
  const segs=segmentList((p.idx-10*dir+N*4)%N,dir);
  const hw=ROAD_W/2;

  for(let s=segs.length-1;s>=0;s--){
    const {i,step,d}=segs[s];
    const j=(i+step*dir+N*4)%N;
    const fog=Math.min(1,Math.pow(d/DRAW,1.35));

    // pooled light from the trackside lamps
    const ph=Math.abs(((i%44)+22)%44-22)/22;
    const lit=(1-ph)*0.13*LAMPA;
    const band=(Math.floor(i/16)%2)?0.05:0;

    const feat=TRACK[i].feat;
    const inLoop=feat===3, inTun=feat===4;
    const CONC=CIRCUITS[pickedTrack].concrete;
    const MEAD=CIRCUITS[pickedTrack].meadow;
    let road=MEAD ? shade(GROUND,1+((Math.floor(i/20)%2)?0.35:0)+lit*0.6)
      : CONC ? mix([133,136,132],[255,178,80],lit*0.5) : mix(ASPHALT,[255,178,80],lit);
    if(feat===1) road=mix([74,67,58],[255,150,40],(Math.floor(i/4)%2)?0.42:0.04);
    else if(feat===2) road=mix(ASPHALT,[44,64,96],0.30);
    else if(inLoop) road=mix([46,50,58],[255,150,40],(Math.floor(i/5)%2)?0.30:0.05);
    else if(inTun) road=shade(ASPHALT,0.86);
    road=shade(road,1+band);
    const dark=(inTun&&TRACK[i].roofed)?0.55:0;    // only the covered part is dark
    quadZ(edge(i,1),edge(j,1),edge(j,-1),edge(i,-1),
          rgbs(mix(shade(road,1-dark*0.5),HAZE,fog)));

    // verges — meaningless once the road is rolling over
    const vcol=CONC ? [96,98,96] : shade(GROUND,1+((Math.floor(i/20)%2)?0.35:0)+lit*0.6);
    for(const side of MEAD?[]:[1,-1]){
      if(inTun){
        const sa=TRACK[i].base, sb=TRACK[j].base;
        const a=edge(i,side,17), b=edge(j,side,17);
        const c2=edge(j,side,330), d2=edge(i,side,330);
        quadZ([a[0],a[1],sa],[b[0],b[1],sb],[c2[0],c2[1],sb-14],[d2[0],d2[1],sa-14],
              rgbs(mix(vcol,HAZE,fog)));
      } else if(!inLoop)
        quadZ(edge(i,side,9),edge(j,side,9),edge(j,side,330,14),edge(i,side,330,14),
              rgbs(mix(vcol,HAZE,fog)));
      const on=(Math.floor(i/9)%2)===0;
      const kcol=CONC ? [232,227,216]
        : inLoop ? (on?[255,168,60]:[36,38,44])
        : URBAN ? [62,66,73]
        : feat===1 ? (on?[255,168,60]:[30,30,34])
        : (on?[200,52,43]:[226,221,210]);
      quadZ(edge(i,side),edge(j,side),edge(j,side,CONC?3:(URBAN?20:9),1),edge(i,side,CONC?3:(URBAN?20:9),1),
            rgbs(mix(shade(kcol,1-dark*0.55),HAZE,fog)));
    }

    // armco
    if(BARRIER&&!inLoop&&!inTun){
      for(const side of [1,-1]){
        const a=edge(i,side,BOFF), b=edge(j,side,BOFF);
        quadZ([a[0],a[1],a[2]],[b[0],b[1],b[2]],[b[0],b[1],b[2]+4],[a[0],a[1],a[2]+4],
              rgbs(mix([40,43,49],HAZE,fog)));
        const on=(Math.floor(i/12)%2)===0;
        quadZ([a[0],a[1],a[2]+5],[b[0],b[1],b[2]+5],[b[0],b[1],b[2]+17],[a[0],a[1],a[2]+17],
              rgbs(mix(on?[126,133,142]:[196,168,96],HAZE,fog)));
        if(i%24<step&&d<130){
          const o=edge(i,side,BOFF+3);
          quadZ([o[0],o[1],o[2]],[a[0],a[1],a[2]],[a[0],a[1],a[2]+19],[o[0],o[1],o[2]+19],
                rgbs(mix([58,62,70],HAZE,fog)));
        }
      }
    }

    // loop: a band of structure under the ribbon so it reads as built, not floating
    if(inLoop){
      for(const side of [1,-1])
        quadZ(edge(i,side,9),edge(j,side,9),edge(j,side,26,0),edge(i,side,26,0),
              rgbs(mix([40,44,52],HAZE,fog)));
    }

    // tunnel: walls and a ceiling, drawn near-last so they enclose you
    if(inTun){
      const sa=TRACK[i].base, sb=TRACK[j].base;
      const wall=rgbs(mix([54,56,62],HAZE,fog*0.85));
      // retaining walls run from the sunken road up to ground level
      for(const side of [1,-1]){
        const a=edge(i,side,16), b=edge(j,side,16);
        quadZ([a[0],a[1],a[2]],[b[0],b[1],b[2]],[b[0],b[1],sb+2],[a[0],a[1],sa+2],wall);
      }
      if(TRACK[i].roofed&&TRACK[j].roofed){
        const al=edge(i,1,17), bl=edge(j,1,17), ar=edge(i,-1,17), br=edge(j,-1,17);
        quadZ([al[0],al[1],sa-6],[bl[0],bl[1],sb-6],[br[0],br[1],sb-6],[ar[0],ar[1],sa-6],
              rgbs(mix([34,36,42],HAZE,fog*0.7)));
        if(i%8<step){                                // strip lights along the crown
          const ca=TRACK[i], cb=TRACK[(i+2)%N];
          quadZ([ca.x+ca.nx*11,ca.y+ca.ny*11,ca.base-10],[cb.x+cb.nx*11,cb.y+cb.ny*11,cb.base-10],
                [cb.x-cb.nx*11,cb.y-cb.ny*11,cb.base-10],[ca.x-ca.nx*11,ca.y-ca.ny*11,ca.base-10],
                "rgba(255,206,140,"+(0.9*(1-fog)*Math.max(0.4,LAMPA))+")");
        }
      } else if(TRACK[(i+step)%N].roofed||TRACK[(i-step+N)%N].roofed){
        // portal header above the mouth
        const al=edge(i,1,17), ar=edge(i,-1,17);
        quadZ([al[0],al[1],sa-6],[ar[0],ar[1],sa-6],
              [ar[0],ar[1],sa+10],[al[0],al[1],sa+10],
              rgbs(mix([70,72,78],HAZE,fog*0.7)));
      }
    }
  }

  if(STREETS.length) drawStreets();

  // start / finish
  let fd=(0-p.idx+N)%N;
  if(!CIRCUITS[pickedTrack].meadow && fd<DRAW-6){
    const i=0, j=6, cols=8;
    const A=TRACK[i], B=TRACK[j];
    const az=(t)=>A.z-t*Math.tan(A.bank||0)+0.3;
    const bz=(t)=>B.z-t*Math.tan(B.bank||0)+0.3;
    for(let c=0;c<cols;c++){
      const t0=-hw+c*(ROAD_W/cols), t1=t0+ROAD_W/cols;
      const a=[A.x+A.nx*t0, A.y+A.ny*t0], b=[A.x+A.nx*t1, A.y+A.ny*t1];
      const cq=[B.x+B.nx*t1, B.y+B.ny*t1], dq=[B.x+B.nx*t0, B.y+B.ny*t0];
      quadZ([a[0],a[1],az(t0)],[b[0],b[1],az(t1)],
            [cq[0],cq[1],bz(t1)],[dq[0],dq[1],bz(t0)], c%2?"#e8e3d8":"#15191f");
    }
  }
}

// Lamps live outside the per-point road loop now — they're persistent
// objects with their own fallen/upright state, not something recomputed
// fresh every frame.
function drawLamps(){
  if(!LAMPS.length) return;
  const c=CIRCUITS[pickedTrack];
  if(c.concrete||c.meadow) return;
  for(const lp of LAMPS){
    const dx=lp.x-EYE[0], dz=lp.y-EYE[2];
    if(dx*FW[0]+dz*FW[2]<-40) continue;
    const dist=Math.hypot(dx,dz);
    if(dist>340) continue;
    const fog=Math.min(0.85,Math.pow(dist/1500,1.4));
    const fogp=rgbs(mix([60,66,74],HAZE,fog));

    if(lp.fallen){
      // knocked flat, pivoting from the base — no light, it isn't working
      const ca=Math.cos(lp.fallAng), sa=Math.sin(lp.fallAng);
      const tipX=lp.x+ca*94, tipY=lp.y+sa*94;
      fillPoly([toCam(lp.x-1.2,lp.z+1,lp.y),toCam(lp.x+1.2,lp.z+1,lp.y),
                toCam(tipX+1.2,lp.z+3,tipY),toCam(tipX-1.2,lp.z+3,tipY)],fogp);
      continue;
    }

    fillPoly([toCam(lp.x,lp.z,lp.y),toCam(lp.x+2.5,lp.z,lp.y),
              toCam(lp.x+2.5,lp.z+96,lp.y),toCam(lp.x,lp.z+96,lp.y)],fogp);
    const head=toCam(lp.x,lp.z+100,lp.y);
    if(head[2]>NEAR){
      const sx=VW/2+head[0]*focal/head[2], sy=VH/2-head[1]*focal/head[2];
      const r=Math.max(3,900/head[2]);
      const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r*3.2);
      g.addColorStop(0,"rgba(255,190,110,"+(0.75*(1-fog)*LAMPA)+")");
      g.addColorStop(1,"rgba(255,170,70,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,r*3.2,0,7); ctx.fill();
    }
  }
}

/* ── low-poly car meshes ──────────────────────────────────────────────
   Local space: x forward, y right, z up. Bodies are lofted through a
   handful of cross-sections, so each class gets its own silhouette. */

function MB(){ return {v:[],f:[]}; }
function addV(mb,x,y,z){ mb.v.push([x,y,z]); return mb.v.length-1; }
function quad(mb,a,b,c,d,m,ref){ mb.f.push({v:[a,b,c,d],m,ref}); }

function loft(mb,st,mats){
  const rings=st.map(s=>[
    addV(mb,s[0],-s[1],s[2]), addV(mb,s[0],s[1],s[2]),
    addV(mb,s[0],s[1],s[3]), addV(mb,s[0],-s[1],s[3])
  ]);
  for(let i=0;i<rings.length-1;i++){
    const a=rings[i], b=rings[i+1];
    quad(mb,a[0],a[1],b[1],b[0],mats.bot||"dark");
    quad(mb,a[1],a[2],b[2],b[1],mats.side);
    quad(mb,a[2],a[3],b[3],b[2],mats.top||mats.side);
    quad(mb,a[3],a[0],b[0],b[3],mats.side);
  }
  const f=rings[rings.length-1], r=rings[0];
  quad(mb,f[0],f[1],f[2],f[3],mats.capF||mats.side);
  quad(mb,r[3],r[2],r[1],r[0],mats.capR||mats.side);
}

function slab(mb,x0,x1,y0,y1,z0,z1,m){
  const v=[];
  for(const x of [x0,x1]) for(const y of [y0,y1]) for(const z of [z0,z1]) v.push(addV(mb,x,y,z));
  const [a,b,c,d,e,f,g,h]=v;
  quad(mb,a,b,d,c,m); quad(mb,e,f,h,g,m);
  quad(mb,a,b,f,e,m); quad(mb,c,d,h,g,m);
  quad(mb,a,c,g,e,m); quad(mb,b,d,h,f,m);
}

function wheelMesh(mb,x,y,r,w,sides,spin,steer){
  const co=Math.cos(steer), si=Math.sin(steer), ref=[x,y,r];
  const ring=[[],[]];
  for(let k=0;k<sides;k++){
    // angle decreases as spin advances: the top of the wheel travels forwards
    const a=k*6.283185/sides-spin, dx=Math.cos(a)*r, dz=Math.sin(a)*r;
    for(let sd=0;sd<2;sd++){
      const ly=sd?w/2:-w/2;
      ring[sd].push(addV(mb, x+dx*co-ly*si, y+dx*si+ly*co, r+dz));
    }
  }
  for(let k=0;k<sides;k++){
    const n=(k+1)%sides;
    quad(mb,ring[0][k],ring[0][n],ring[1][n],ring[1][k],"tyre",ref);
  }
  mb.f.push({v:ring[0].slice().reverse(),m:"rim",ref:[x,y-w,r]});
  mb.f.push({v:ring[1].slice(),          m:"rim",ref:[x,y+w,r]});

  // spoke bar across the outer face, so the rotation is legible
  const ca=Math.cos(-spin), sa=Math.sin(-spin), L=r*0.86, T=r*0.19;
  const ly=y>0 ? w/2+0.4 : -w/2-0.4;
  const bar=[];
  for(const [u,v] of [[L,T],[L,-T],[-L,-T],[-L,T]]){
    const px=u*ca-v*sa, pz=u*sa+v*ca;
    bar.push(addV(mb, x+px*co-ly*si, y+px*si+ly*co, r+pz));
  }
  mb.f.push({v:bar, m:"spoke", ref:[x, y*2, r]});
}
