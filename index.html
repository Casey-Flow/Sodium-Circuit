<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sodium Circuit — Night Endurance</title>
<style>
  :root{
    --night:#0b0f14;
    --asphalt:#22262c;
    --sodium:#ffab3d;
    --sodium-dim:#8a5a1d;
    --bone:#e8e3d8;
    --blood:#c8342b;
    --steel:#5d6873;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--night);}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    user-select:none;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  .board{
    position:absolute;
    background:linear-gradient(180deg,rgba(10,13,17,.94),rgba(10,13,17,.82));
    border:1px solid rgba(255,171,61,.28);
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 12px 40px rgba(0,0,0,.55);
  }
  .eyebrow{
    font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--sodium-dim);
  }
  .num{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }

  /* Pit wall board */
  #pitboard{
    top:14px;left:14px;padding:12px 14px 11px;min-width:186px;
    border-left:3px solid var(--sodium);
  }
  #pitboard .row{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:3px 0}
  #pitboard .row .v{font-size:15px;letter-spacing:.04em}
  #pitboard .big{font-size:30px;line-height:1;letter-spacing:-.01em;color:var(--sodium)}
  #pitboard hr{border:0;border-top:1px solid rgba(255,171,61,.16);margin:8px 0}

  .hudglitch{
    text-shadow:-2px 0 rgba(255,60,60,.75), 2px 0 rgba(80,200,255,.75);
    filter:contrast(1.3) saturate(1.4);
    animation:hudglitchflicker .07s steps(2) infinite;
  }
  @keyframes hudglitchflicker{
    0%  { transform:translate(0,0); }
    35% { transform:translate(-2px,1px) skewX(1.2deg); }
    70% { transform:translate(2px,-1px) skewX(-0.8deg); }
    100%{ transform:translate(-1px,0); }
  }

  /* Speed */
  #speedo{
    bottom:16px;left:14px;padding:8px 16px 10px;text-align:left;
    border-bottom:3px solid var(--sodium);
  }
  #speedVal{font-size:52px;line-height:.92;letter-spacing:-.04em;color:var(--bone)}
  #speedVal.redline{color:var(--sodium)}
  #nitrotrack{
    margin-top:7px;width:140px;height:6px;
    background:rgba(255,171,61,.14);border:1px solid rgba(255,171,61,.22);
  }
  #nitrofill{
    height:100%;width:100%;background:#5db8ff;
    box-shadow:0 0 8px rgba(93,184,255,.7);
    transition:background-color .15s;
  }
  #nitrofill.empty{background:rgba(255,171,61,.3);box-shadow:none}
  #nitrofill.active{background:#bfe4ff;box-shadow:0 0 14px rgba(191,228,255,.9)}

  /* Minimap */
  #mapwrap{top:14px;right:14px;padding:10px}
  #minimap{display:block;width:150px;height:112px}

  /* Overlays */
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;text-align:center;
    background:radial-gradient(ellipse at center,rgba(6,8,11,.72),rgba(6,8,11,.94));
    padding:24px 24px 44px;
    overflow-y:auto;overflow-x:hidden;
    touch-action:pan-y;                 /* the body blocks touch, this screen must not */
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,171,61,.5) rgba(0,0,0,.35);
  }
  #overlay::-webkit-scrollbar{width:10px}
  #overlay::-webkit-scrollbar-track{background:rgba(0,0,0,.35)}
  #overlay::-webkit-scrollbar-thumb{background:rgba(255,171,61,.45)}
  #overlay::-webkit-scrollbar-thumb:hover{background:rgba(255,171,61,.8)}
  #overlay.hidden{display:none}
  .title{
    font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
    font-weight:700;text-transform:uppercase;letter-spacing:.3em;
    font-size:clamp(30px,7vw,60px);line-height:1;color:var(--bone);
  }
  .title span{color:var(--sodium)}
  .sub{margin-top:14px;max-width:440px;font-size:13px;line-height:1.7;color:#9aa3ad}
  .keys{margin-top:22px;display:grid;grid-template-columns:auto auto;gap:6px 16px;font-size:12px;color:#9aa3ad}
  .keys b{
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--bone);
    border:1px solid rgba(232,227,216,.25);padding:1px 7px;border-radius:3px;font-weight:400;
  }
  .cta{
    margin-top:26px;padding:13px 30px;background:var(--sodium);color:#12161b;
    border:0;font-family:"Arial Narrow",Arial,sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.2em;font-size:14px;cursor:pointer;
  }
  .cta:hover{background:#ffbe66}
  .cta:focus-visible{outline:3px solid var(--bone);outline-offset:3px}

  #countdown{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #countText{
    font-family:"Arial Narrow",Arial,sans-serif;font-weight:700;
    font-size:clamp(70px,18vw,180px);letter-spacing:.06em;color:var(--sodium);
    text-shadow:0 0 60px rgba(255,171,61,.5);
  }

  /* Results */
  table.res{margin-top:22px;border-collapse:collapse;font-size:13px;min-width:min(420px,86vw)}
  table.res th{
    font-family:"Arial Narrow",Arial,sans-serif;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--sodium-dim);text-align:left;padding:0 12px 7px;font-weight:400;
  }
  table.res td{padding:7px 12px;border-top:1px solid rgba(232,227,216,.12);text-align:left}
  table.res tr.you td{color:var(--sodium)}
  .swatch{display:inline-block;width:9px;height:9px;margin-right:8px;vertical-align:baseline}

  .tname{
    font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,sans-serif;
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone);
    padding-bottom:7px;margin-bottom:5px;border-bottom:1px solid rgba(255,171,61,.16);
  }
  .cmeta{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;
    letter-spacing:.06em;color:var(--sodium);margin-top:8px;
  }

  #pausebtn{
    top:14px;left:50%;transform:translateX(-50%);
    font-family:"Arial Narrow",Arial,sans-serif;
    width:44px;height:34px;color:var(--bone);font-size:11px;letter-spacing:.12em;
    cursor:pointer;padding:0;
  }
  #pausebtn:hover,#daybtn:hover,#mutebtn:hover{border-color:var(--sodium);color:var(--sodium)}
  #daybtn{
    top:14px;left:50%;transform:translateX(calc(-50% + 60px));
    font-family:"Arial Narrow",Arial,sans-serif;
    height:34px;padding:0 12px;color:var(--bone);font-size:10px;letter-spacing:.18em;
    cursor:pointer;
  }
  #mutebtn{
    top:14px;left:50%;transform:translateX(calc(-50% + 138px));
    font-family:"Arial Narrow",Arial,sans-serif;
    height:34px;padding:0 12px;color:var(--bone);font-size:10px;letter-spacing:.18em;
    cursor:pointer;
  }
  /* Multiplayer */
  #mpboard{
    top:168px;right:14px;min-width:150px;padding:9px 12px;display:none;
    border-right:3px solid var(--sodium);font-size:12px;letter-spacing:.06em;
  }
  #mpboard .mprow{display:flex;gap:8px;justify-content:space-between;padding:2px 0;color:var(--bone)}
  #mpboard .mprow.me{color:var(--sodium)}
  #mpboard .mprow i{font-style:normal;color:#7d858f}
  .mpform{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;margin-top:20px;text-align:left}
  .mpform label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7d858f}
  .mpform input,.mpform select{
    width:100%;background:rgba(14,18,24,.9);color:var(--bone);border:1px solid rgba(232,227,216,.2);
    padding:11px 12px;font:inherit;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  }
  .mpform input:focus,.mpform select:focus{outline:none;border-color:var(--sodium)}
  .mperr{min-height:18px;font-size:12px;color:#ff8a7a;letter-spacing:.04em;max-width:420px;text-align:center;margin-top:8px}
  .plist{width:100%;max-width:520px;margin-top:20px;display:flex;flex-direction:column;gap:6px}
  .pl{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(14,18,24,.82);
      border:1px solid rgba(232,227,216,.13);text-align:left}
  .pl.me{border-color:var(--sodium)}
  .pl .sw{width:10px;height:10px;flex:0 0 auto}
  .pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.08em}
  .pl .tag{font-size:10px;letter-spacing:.16em;color:#7d858f;text-transform:uppercase}
  .pl .tag.host{color:var(--sodium)}
  .seg{display:flex;gap:0;margin-top:14px}
  .seg button{padding:9px 16px;background:rgba(14,18,24,.9);color:var(--bone);border:1px solid rgba(232,227,216,.2);
              font:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
  .seg button.on{background:var(--sodium);color:#0b0f14;border-color:var(--sodium)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .btnrow .ghost{margin-top:8px}

  /* Garage */
  #ovContent{width:100%;max-width:900px;display:flex;flex-direction:column;
             align-items:center;margin:auto 0;flex:0 0 auto}
  #cars{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));
    gap:9px;margin-top:22px;width:100%;
  }
  .card{
    background:rgba(14,18,24,.82);border:1px solid rgba(232,227,216,.13);
    padding:11px 12px 13px;text-align:left;color:inherit;font:inherit;cursor:pointer;
    transition:border-color .12s,background .12s;
  }
  .card:hover,.card:focus-visible{border-color:var(--sodium);background:rgba(255,171,61,.08);outline:none}
  .card.disabled{opacity:.4;cursor:not-allowed}
  .card.disabled:hover{border-color:rgba(232,227,216,.13);background:rgba(14,18,24,.82)}

  .cardglitch{position:relative;animation:cardglitchflicker 2.7s infinite steps(1);border-color:rgba(210,255,90,.3)}
  .cardglitch::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,rgba(255,60,60,.10),transparent 45%,rgba(80,200,255,.10));
    mix-blend-mode:screen;animation:cardglitchsheen 1.9s infinite steps(1);
  }
  .cardglitch-near{animation:cardglitchflicker 6.4s infinite steps(1);animation-delay:1.3s}
  @keyframes cardglitchflicker{
    0%,100%{ transform:translate(0,0); filter:none; text-shadow:none; }
    4%     { transform:translate(-3px,1px) skewX(2deg); filter:contrast(1.4) hue-rotate(8deg);
             text-shadow:-2px 0 rgba(255,60,60,.7),2px 0 rgba(80,200,255,.7); }
    6%     { transform:translate(2px,-1px); filter:none; text-shadow:none; }
    47%    { transform:translate(1px,2px) skewX(-1.5deg); filter:saturate(1.7);
             text-shadow:2px 0 rgba(255,60,60,.6),-2px 0 rgba(80,200,255,.6); }
    49%    { transform:translate(0,0); filter:none; text-shadow:none; }
    73%    { transform:translate(-2px,0); filter:contrast(1.3);
             text-shadow:-1px 0 rgba(255,60,60,.5),1px 0 rgba(80,200,255,.5); }
    75%    { transform:translate(0,0); filter:none; text-shadow:none; }
  }
  @keyframes cardglitchsheen{
    0%,90%,100%{ opacity:0; }
    92%,96%    { opacity:1; }
  }

  .card canvas{display:block;width:100%;height:auto}
  .cclass{font-family:"Arial Narrow",Arial,sans-serif;font-size:9px;letter-spacing:.2em;
          text-transform:uppercase;color:var(--sodium-dim);margin-top:8px}
  .cname{font-family:"Arial Narrow",Arial,sans-serif;font-weight:700;text-transform:uppercase;
         letter-spacing:.1em;font-size:15px;line-height:1.1;margin-top:2px}
  .cblurb{font-size:11px;color:#8b939d;line-height:1.5;margin:7px 0 10px;min-height:50px}
  .bar{display:grid;grid-template-columns:46px 1fr;align-items:center;gap:8px;margin-top:4px}
  .bar span{font-family:"Arial Narrow",Arial,sans-serif;font-size:9px;letter-spacing:.1em;
            text-transform:uppercase;color:#6f7883}
  .bar i{display:block;height:4px;background:rgba(232,227,216,.11);position:relative}
  .bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--sodium)}
  .ghost{
    margin-top:14px;background:none;border:1px solid rgba(232,227,216,.28);color:var(--bone);
    padding:10px 22px;font-family:"Arial Narrow",Arial,sans-serif;text-transform:uppercase;
    letter-spacing:.18em;font-size:12px;cursor:pointer;
  }
  .ghost:hover{border-color:var(--sodium);color:var(--sodium)}

  /* Touch controls */
  #touch{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;padding:0 14px 14px;pointer-events:none}
  #touch .pad{display:flex;gap:10px;pointer-events:auto}
  #touch button{
    width:74px;height:74px;border-radius:50%;background:rgba(20,25,32,.8);
    border:1px solid rgba(255,171,61,.35);color:var(--bone);font-size:22px;
    font-family:"Arial Narrow",Arial,sans-serif;letter-spacing:.05em;
  }
  #touch button.active{background:rgba(255,171,61,.3)}
  #tNitro{width:56px;height:56px;align-self:center;font-size:13px;
          border-color:rgba(93,184,255,.5);color:#bfe4ff}
  #tNitro.active{background:rgba(93,184,255,.35);border-color:#5db8ff}
  body.touch #touch{display:flex}
  body.touch #speedo{bottom:auto;top:118px;left:14px}

  @media (max-width:560px){
    #pitboard{min-width:150px;padding:9px 11px}
    #pitboard .big{font-size:24px}
    #speedVal{font-size:38px}
    #nitrotrack{width:100px}
    #minimap{width:104px;height:78px}
  }
  @media (prefers-reduced-motion:reduce){
    #countText{text-shadow:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="board" id="pitboard">
    <div class="tname" id="tname">Sodium Circuit</div>
    <div class="row"><span class="eyebrow" id="poslabel">Position</span><span class="big num" id="pos">1/4</span></div>
    <div class="row"><span class="eyebrow" id="laplabel">Lap</span><span class="v num" id="lap">1/3</span></div>
    <hr>
    <div class="row"><span class="eyebrow">Current</span><span class="v num" id="cur">0:00.00</span></div>
    <div class="row"><span class="eyebrow">Last</span><span class="v num" id="last">—</span></div>
    <div class="row"><span class="eyebrow">Best</span><span class="v num" id="best">—</span></div>
    <div class="row"><span class="eyebrow">Camera · C</span><span class="v num" id="cammode">Chase</span></div>
  </div>

  <div class="board" id="speedo">
    <div class="eyebrow" id="spdlabel">km/h</div>
    <div class="num" id="speedVal">0</div>
    <div id="nitrotrack"><div id="nitrofill"></div></div>
  </div>

  <div class="board" id="mapwrap">
    <canvas id="minimap" width="300" height="224"></canvas>
  </div>
  <div class="board" id="mpboard"></div>

  <button class="board" id="pausebtn" aria-label="Pause menu">❚❚</button>
  <button class="board" id="daybtn" aria-label="Toggle day and night">NIGHT</button>
  <button class="board" id="mutebtn" aria-label="Toggle sound">SOUND</button>

  <div id="countdown"><div id="countText"></div></div>

  <div id="touch">
    <div class="pad">
      <button id="tLeft" aria-label="Steer left">◄</button>
      <button id="tRight" aria-label="Steer right">►</button>
    </div>
    <div class="pad">
      <button id="tBrake" aria-label="Brake">BR</button>
      <button id="tNitro" aria-label="Nitro">N2O</button>
      <button id="tGas" aria-label="Throttle">GAS</button>
    </div>
  </div>

  <div id="overlay">
    <div id="ovContent"></div>
  </div>
</div>

<script>
/* If the game ever fails to start, say why on screen instead of showing a dark page. */
(function(){
  function show(msg){
    try{
      var d=document.getElementById("errbox");
      if(!d){
        d=document.createElement("pre"); d.id="errbox";
        d.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;margin:0;padding:12px 14px;"+
          "background:#2a0d0d;color:#ffb4a8;border:1px solid #c8342b;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;"+
          "white-space:pre-wrap;max-height:40vh;overflow:auto;user-select:text";
        (document.body||document.documentElement).appendChild(d);
      }
      d.textContent+=msg+"\n";
    }catch(x){}
  }
  window.addEventListener("error",function(e){
    show("Error: "+(e.message||e.type)+(e.filename?"\n  at line "+e.lineno+":"+e.colno:"")+
         (e.error&&e.error.stack?"\n"+String(e.error.stack).split("\n").slice(0,4).join("\n"):"")+
         "\nBrowser: "+navigator.userAgent);
  });
  window.addEventListener("unhandledrejection",function(e){ show("Promise error: "+(e.reason&&e.reason.message||e.reason)); });
})();
</script>

let TRACK=[], N=0, TRACK_LEN=0, ROAD_W=132, WORLD_W=0, WORLD_H=0;
let pickedTrack=0;

function catmull(p0,p1,p2,p3,t){
  const t2=t*t, t3=t2*t;
  return [
    0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}

function buildTrack(CONTROL){
  const dense=[], n=CONTROL.length;
  for(let i=0;i<n;i++){
    const p0=CONTROL[(i-1+n)%n],p1=CONTROL[i],p2=CONTROL[(i+1)%n],p3=CONTROL[(i+2)%n];
    for(let j=0;j<30;j++) dense.push(catmull(p0,p1,p2,p3,j/30));
  }
  dense.push(dense[0].slice());

  // resample at constant arc length
  const pts=[]; let carry=0;
  for(let i=0;i<dense.length-1;i++){
    const a=dense[i], b=dense[i+1];
    const dx=b[0]-a[0], dy=b[1]-a[1];
    const seg=Math.hypot(dx,dy);
    let d=carry;
    while(d<seg){ const t=d/seg; pts.push({x:a[0]+dx*t, y:a[1]+dy*t}); d+=SPACING; }
    carry=d-seg;
  }
  const M=pts.length;
  for(let i=0;i<M;i++){
    const a=pts[(i-1+M)%M], b=pts[(i+1)%M];
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
    pts[i].tx=dx/L; pts[i].ty=dy/L;      // tangent
    pts[i].nx=-dy/L; pts[i].ny=dx/L;     // left normal
    pts[i].ang=Math.atan2(dy,dx);
  }
  return pts;
}

const trackCache={};
function trackPoints(i){
  if(!trackCache[i]) trackCache[i]=buildTrack(CIRCUITS[i].pts);
  return trackCache[i];
}

function bounds(pts){
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const p of pts){ a=Math.min(a,p.x); b=Math.max(b,p.x); c=Math.min(c,p.y); d=Math.max(d,p.y); }
  return {minx:a,maxx:b,miny:c,maxy:d,w:b-a,h:d-c};
}

function rng(seed){ let x=seed>>>0; return ()=>{ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; }

const RAMP_LEN=26, RAMP_H=26, RAMP_DROP=7, SINK_LEN=36, SINK_D=14;
const LOOP_LEN=60, LOOP_R=80;        // 300 units of track, 160 units tall
const TUN_LEN=140, TUN_D=76, TUN_RAMP=46, TUN_H=70;  // depth, entry ramp, headroom
let FEATS=[];

// Ramps go on the flattest stretches, sinks anywhere reasonably open.
function buildElevation(seed){
  for(const p of TRACK){ p.base=HILLS?hillZ(p.x,p.y):0; p.z=p.base; p.feat=0; p.roll=0; }
  FEATS=[];
  if(CIRCUITS[pickedTrack].flat){ elevationDerivatives(); return; }

  const flat=[];
  for(let i=0;i<N;i++){
    let k=0;
    for(let d=0;d<96;d+=8) k+=curvatureAhead((i+d)%N,10);
    flat.push(k);
  }
  const order=[...Array(N).keys()].sort((a,b)=>flat[a]-flat[b]);
  const used=[];
  const clear=(i,min)=>used.every(u=>{const d=Math.abs(u-i); return Math.min(d,N-d)>min;});
  const gridClear=(i,min)=>Math.min(i,N-i)>min;   // never on the starting grid

  const rnd=rng(seed*7919+31);
  const wantR=N>1000?3:2, wantS=N>900?4:3;

  // Long features need a real overlap test — a point-radius check rules out
  // far more of the lap than the feature actually occupies.
  const SPANOF={1:RAMP_LEN+RAMP_DROP, 2:SINK_LEN, 3:LOOP_LEN, 4:TUN_LEN};
  const spanFree=(i,len,margin)=>{
    if(Math.min(i,N-i)<150) return false;                 // clear of the grid
    const a1=i-margin, b1=i+len+margin;
    for(const f of FEATS){
      const a2=f.i, b2=f.i+SPANOF[f.type];
      for(const sh of [-N,0,N]) if(a1<b2+sh&&a2+sh<b1) return false;
    }
    return true;
  };

  // Loops need the straightest ground of all — you cannot steer inside one.
  const wantL=CIRCUITS[pickedTrack].loops||0, wantT=CIRCUITS[pickedTrack].tunnels||0;
  for(const i of order){
    if(FEATS.filter(f=>f.type===3).length>=wantL) break;
    if(spanFree(i,LOOP_LEN,60)) { FEATS.push({i,type:3}); used.push(i,(i+LOOP_LEN)%N); }
  }
  for(const i of order.slice().reverse()){
    if(FEATS.filter(f=>f.type===4).length>=wantT) break;
    if(spanFree(i,TUN_LEN,40)) { FEATS.push({i,type:4}); used.push(i,(i+TUN_LEN)%N); }
  }

  // Straightest stretches first. Twisty circuits have nowhere truly flat, so
  // relax the requirement until every track gets at least one of each.
  for(const lim of [1.5,3,6,1e9]){
    for(const i of order){
      if(FEATS.filter(f=>f.type===1).length>=wantR) break;
      if(gridClear(i,240)&&clear(i,150)&&flat[i]<lim){ FEATS.push({i,type:1}); used.push(i,(i+RAMP_LEN+RAMP_DROP)%N); }
    }
    if(FEATS.some(f=>f.type===1)) break;
  }
  for(const lim of [3.6,8,1e9]){
    for(const i of order){
      if(FEATS.filter(f=>f.type===2).length>=wantS) break;
      if(gridClear(i,110)&&clear(i,100)&&flat[i]<lim){ FEATS.push({i,type:2}); used.push(i,(i+SINK_LEN)%N); }
    }
    if(FEATS.filter(f=>f.type===2).length>=2) break;
  }

  for(const st of STREETS){
    const [ax,ay]=mmp(st.ax,st.ay), [bx,by]=mmp(st.bx,st.by);
    mctx.strokeStyle="rgba(255,171,61,.30)"; mctx.lineWidth=Math.max(2,st.hw*2*MM_S);
    mctx.beginPath(); mctx.moveTo(ax,ay); mctx.lineTo(bx,by); mctx.stroke();
  }

  for(const f of FEATS){
    if(f.type===3){                       // loop: the surface rolls a full turn
      for(let k=0;k<=LOOP_LEN;k++){
        const t=k/LOOP_LEN, th=t*6.283185;
        const p=TRACK[(f.i+k)%N];
        p.z+=LOOP_R*(1-Math.cos(th));
        p.roll=th; p.feat=3;
      }
      continue;
    }
    if(f.type===4){                       // tunnel: the road goes underground
      for(let k=0;k<=TUN_LEN;k++){
        const p=TRACK[(f.i+k)%N];
        let t=1;
        if(k<TUN_RAMP) t=k/TUN_RAMP;
        else if(k>TUN_LEN-TUN_RAMP) t=(TUN_LEN-k)/TUN_RAMP;
        // quintic ease: flat curvature at both ends, so nobody launches at the portal
        const d=t*t*t*(t*(t*6-15)+10);
        p.z-=TUN_D*d;
        p.feat=4;
        p.roofed=d>0.93;
      }
      continue;
    }
    if(f.type===1){
      for(let k=0;k<=RAMP_LEN;k++){
        const t=k/RAMP_LEN, e=t*t*(3-2*t)*0.3+t*0.7;
        const p=TRACK[(f.i+k)%N]; p.z+=RAMP_H*e; p.feat=1;
      }
      for(let k=1;k<=RAMP_DROP;k++){          // the far side falls away sharply
        const p=TRACK[(f.i+RAMP_LEN+k)%N];
        p.z+=RAMP_H*(1-k/RAMP_DROP); p.feat=1;
      }
    } else {
      const jitter=0.8+rnd()*0.5;
      for(let k=0;k<=SINK_LEN;k++){
        const t=k/SINK_LEN;
        const p=TRACK[(f.i+k)%N];
        p.z+=-SINK_D*jitter*(1-Math.cos(t*6.283185))/2; p.feat=2;
      }
    }
  }

  elevationDerivatives();
}

function elevationDerivatives(){
  for(let i=0;i<N;i++){
    const a=TRACK[(i-1+N)%N].z, b=TRACK[(i+1)%N].z;
    TRACK[i].slope=(b-a)/(2*SPACING);              // for the road surface
    TRACK[i].slopeB=(TRACK[i].z-a)/SPACING;        // what the car has just climbed
  }
  for(let i=0;i<N;i++){
    // vertical curvature: negative over a crest or the lip of a rise
    TRACK[i].curv=(TRACK[(i+1)%N].slope-TRACK[(i-1+N)%N].slope)/(2*SPACING);
  }
  // Banking: the road tilts into a corner, same as a real track. Signed so
  // it leans the correct way for a left or a right, scaled up from nothing
  // on a straight to a real lean on a tight bend, and only on plain track —
  // ramps, dips, loops and tunnels keep their own distinct cross-section.
  // Banking is a designed racetrack feature — it doesn't belong anywhere
  // HILLS already provides organic camber (Open Fields, The Open Range,
  // Verge City, Kingsgate), or the two fight each other. Real corner
  // banking only applies where the ground is otherwise flat.
  if(HILLS){
    for(let i=0;i<N;i++) TRACK[i].bank=0;
    return;
  }
  const rawBank=[];
  for(let i=0;i<N;i++){
    const span=10;
    const a=TRACK[(i-span+N)%N].ang, b=TRACK[(i+span)%N].ang;
    let d=b-a; while(d>Math.PI)d-=6.283185; while(d<-Math.PI)d+=6.283185;
    const curveRate=d/(span*2*SPACING);             // signed, 1/units
    rawBank[i]=TRACK[i].feat ? 0 : Math.max(-0.30,Math.min(0.30,curveRate*95));
  }
  // The road's draw distance thins out sampled points at range (up to every
  // 8th), so a value that changes smoothly point-to-point can still snap
  // hard between two points that end up next to each other on screen. Widen
  // it with a moving average so the surface itself transitions gradually,
  // the way a real banked corner's transition zone does.
  const W=14;
  for(let i=0;i<N;i++){
    let sum=0;
    for(let o=-W;o<=W;o++) sum+=rawBank[(i+o+N)%N];
    TRACK[i].bank=sum/(W*2+1);
  }
}

let STREETS=[], SHX=0, SHY=0, URBAN=false, HILLS=null;
let BARRIER=true, BOFF=78;
const BARRIER_MAX=78;   // set back from the kerb, so runoff still exists

// Where the circuit doubles back near itself, pull the fence in so it never
// crosses the neighbouring stretch of road.
function fitBarrier(){
  if(!BARRIER){ BOFF=0; return; }
  const skip=Math.round((ROAD_W*2+80)/SPACING)+14;
  let best=1e12;
  for(let i=0;i<N;i+=3){
    for(let j=i+skip;j<N;j+=3){
      const sep=Math.min(j-i,N-(j-i));
      if(sep<=skip) continue;
      const dx=TRACK[i].x-TRACK[j].x, dy=TRACK[i].y-TRACK[j].y;
      const d=dx*dx+dy*dy;
      if(d<best) best=d;
    }
  }
  const clearance=Math.sqrt(best);
  BOFF=Math.max(20, Math.min(BARRIER_MAX, (clearance-ROAD_W)/2-8));
}

// Rolling ground built from overlapping raised cosines: smooth everywhere,
// flat at the edges, and cheap enough to sample three times per car per step.
function buildHills(seed){
  HILLS=null;
  const spec=CIRCUITS[pickedTrack].hills;
  if(!spec) return;
  const rnd=rng(seed*2654435761+29);
  const list=[];
  for(let i=0;i<spec.count;i++){
    list.push({
      x:SHX+spec.area[0]+rnd()*(spec.area[2]-spec.area[0]),
      y:SHY+spec.area[1]+rnd()*(spec.area[3]-spec.area[1]),
      r:spec.rmin+rnd()*(spec.rmax-spec.rmin),
      a:(rnd()<0.45?-1:1)*(spec.amin+rnd()*(spec.amax-spec.amin))
    });
  }
  // tighter humps sat on the roads themselves — sharp enough that a quick car
  // crests them and floats, gentle enough to drive over at touring speed
  for(let i=0;i<(spec.humps||0);i++){
    let px,py;
    if(STREETS.length&&rnd()<0.78){
      const st=STREETS[Math.floor(rnd()*STREETS.length)], t=0.15+rnd()*0.7;
      px=st.ax+(st.bx-st.ax)*t; py=st.ay+(st.by-st.ay)*t;
    } else {
      const q=TRACK[Math.floor(rnd()*N)]; px=q.x; py=q.y;
    }
    list.push({x:px, y:py,
               r:spec.hrmin+rnd()*(spec.hrmax-spec.hrmin),
               a:spec.hamin+rnd()*(spec.hamax-spec.hamin)});
  }
  HILLS=list;
}

function hillZ(x,y){
  if(!HILLS) return 0;
  let z=0;
  for(const h of HILLS){
    const dx=x-h.x, dy=y-h.y;
    if(Math.abs(dx)>h.r||Math.abs(dy)>h.r) continue;
    const d=Math.hypot(dx,dy);
    if(d<h.r) z+=h.a*0.5*(1+Math.cos(Math.PI*d/h.r));
  }
  return z;
}   // grid coords are shifted into world space

function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
  let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
}
// how far inside a street we are: positive on tarmac, negative on the pavement
function streetInside(x,y){
  let best=-1e9;
  for(const s of STREETS){
    const d=s.hw-segDist(x,y,s.ax,s.ay,s.bx,s.by);
    if(d>best) best=d;
  }
  return best;
}

// Persistent lamp posts — knowing that one has been knocked down (and when
// it's due back up) needs real state, not just a stateless "draw one here"
// decision made fresh every frame.
let LAMPS=[];
function buildLamps(){
  LAMPS=[];
  const c=CIRCUITS[pickedTrack];
  if(c.concrete||c.meadow) return;
  for(let i=0;i<N;i++){
    if(i%44===0){
      const b=edge(i,1,34);
      LAMPS.push({idx:i, x:b[0], y:b[1], z:b[2]-3, fallen:false, fallAng:0, respawnAt:0});
    }
  }
}

// A light knock, not a real crash — you clip a lamp post, it goes down,
// you lose a flat amount of speed regardless of how hard you hit it, and
// the light comes back on its own after a minute.
const LAMP_RESPAWN=60;   // seconds
function hitLamps(c,dt){
  if(!LAMPS.length||c.flying) return;
  for(const lp of LAMPS){
    if(lp.fallen){
      if(raceTime>=lp.respawnAt){ lp.fallen=false; lp.fallAng=0; }
      continue;
    }
    if(Math.abs(c.x-lp.x)>16||Math.abs(c.y-lp.y)>16) continue;
    if(Math.hypot(c.x-lp.x,c.y-lp.y)>11) continue;
    lp.fallen=true;
    lp.fallAng=Math.atan2(c.y-lp.y,c.x-lp.x)+Math.PI/2+(Math.random()-.5)*0.4;
    lp.respawnAt=raceTime+LAMP_RESPAWN;
    const loss=16.1;                              // ~10 km/h, every time, no more and no less
    c.speed = Math.abs(c.speed)<=loss ? 0 : c.speed-Math.sign(c.speed)*loss;
    if(c.human){ shake=Math.min(1.2,shake+0.18); thud(180,true); }
  }
}

function buildStreets(){
  STREETS=[];
  const g=CIRCUITS[pickedTrack].grid;
  if(!g) return;
  for(const x of g.avenues)
    STREETS.push({ax:x+SHX, ay:g.avSpan[0]+SHY, bx:x+SHX, by:g.avSpan[1]+SHY, hw:g.hw});
  for(const y of g.streets)
    STREETS.push({ax:g.stSpan[0]+SHX, ay:y+SHY, bx:g.stSpan[1]+SHX, by:y+SHY, hw:g.hw});
}

let BUILDINGS=[];

// Seeded skyline. Buildings sit outside the verge and never overlap any part
// of the circuit, including where the loop doubles back on itself.
function pushBuilding(b,rnd,sc){
  const keep=ROAD_W/2+(BARRIER?BOFF+40:0)+Math.max(b.w,b.d)+14;   // clear the fence, not just the road
  for(let k=0;k<N;k+=3){
    const q=TRACK[k];
    if(Math.abs(q.x-b.x)<keep&&Math.abs(q.y-b.y)<keep&&Math.hypot(q.x-b.x,q.y-b.y)<keep) return;
  }
  for(const st of STREETS){
    // depth toward the street is the short dimension of a street-facing block
    if(segDist(b.x,b.y,st.ax,st.ay,st.bx,st.by) < st.hw+Math.min(b.w,b.d)+10) return;
  }
  const rows=Math.max(1,Math.min(8,Math.floor(b.h/34)));
  b.win=[]; b.rows=rows;
  for(let r=0;r<rows;r++) b.win.push(rnd()<0.66?1:0);
  b.tone=rnd(); b.z=(HILLS?hillZ(b.x,b.y):0)-3-(HILLS?Math.max(b.w,b.d)*0.14:0);
  if(CIRCUITS[pickedTrack].glitchy&&rnd()<0.16) b.glitchy=true;
  BUILDINGS.push(b);
}

// Scatter trees and rocks across an open area with no streets to line —
// rejection-sampled for spacing, and kept clear of the loop itself so a
// car (and the AI) always has room to pass.
function buildMeadow(seed){
  const spec=CIRCUITS[pickedTrack].meadowScatter;
  const rnd=rng(seed*950213+41);
  const placed=[];

  function place(minR,make){
    for(let tries=0;tries<220;tries++){
      const x=SHX+spec.area[0]+rnd()*(spec.area[2]-spec.area[0]);
      const y=SHY+spec.area[1]+rnd()*(spec.area[3]-spec.area[1]);
      let ok=true;
      for(const q of placed){
        if(Math.hypot(q.x-x,q.y-y)<minR+q.r){ ok=false; break; }
      }
      if(!ok) continue;
      // On a normal meadow, keep clear of the invisible loop's real
      // road-width corridor. On a boundless map that corridor isn't a
      // physical boundary at all — it's sized to blanket the whole area
      // with full grip — so only avoid literally sitting on the line.
      const keep=CIRCUITS[pickedTrack].boundless ? 60 : ROAD_W/2+40;
      for(let k=0;k<N;k+=4){
        const t=TRACK[k];
        if(Math.abs(t.x-x)<keep&&Math.abs(t.y-y)<keep&&Math.hypot(t.x-x,t.y-y)<keep){ ok=false; break; }
      }
      if(!ok) continue;
      const b=make(x,y);
      b.tone=rnd(); b.z=(HILLS?hillZ(x,y):0)-2;
      // On a misleading map, a good chunk of props lie about the terrain
      // outright — planted well above or below their true ground height,
      // so they can no longer be read as a reliable clue to what's beneath
      // them. The car's own physics never uses this value, only the prop
      // itself, so this is pure deception with no effect on how it drives.
      if(CIRCUITS[pickedTrack].misleading&&rnd()<0.42){
        const dir=rnd()<0.5?-1:1;
        b.z+=dir*(35+rnd()*150);
        b.lying=true;
      }
      if(CIRCUITS[pickedTrack].glitchy&&rnd()<0.22) b.glitchy=true;
      BUILDINGS.push(b);
      placed.push({x,y,r:minR});
      return;
    }
  }

  // Each type's R is set so that ANY pairing (tree-tree, tree-rock,
  // rock-rock) leaves a surface gap comfortably wider than a car — see the
  // derivation in the design notes: R_tree=34, R_rock=44 covers every case
  // with >=40 units of clearance, well past the 32-unit wedge threshold.
  // Rocks need the most room, so they claim space first; trees fill in after.
  for(let i=0;i<spec.rocks;i++){
    place(44,(x,y)=>{
      const w=8+rnd()*14, d=8+rnd()*14, h=6+rnd()*10;
      return {x,y,ang:rnd()*6.283185,kind:"rock",w,d,h};
    });
  }
  for(let i=0;i<spec.trees;i++){
    place(34,(x,y)=>{
      const w=7+rnd()*5, trunkH=16+rnd()*10, h=44+rnd()*56;
      return {x,y,ang:rnd()*6.283185,kind:"tree",w,d:w,tw:1.4+rnd()*0.8,h,trunkH};
    });
  }
}

// Walk the inside edge of every block, lining the streets with towers.
// Height falls off from the middle of the district, so downtown reads as downtown.
function buildBlocks(seed){
  const g=CIRCUITS[pickedTrack].grid;
  const rnd=rng(seed*15485863+11);
  const xs=[g.stSpan[0], ...g.avenues, g.stSpan[1]].map(v=>v+SHX);
  const ys=[g.avSpan[0], ...g.streets, g.avSpan[1]].map(v=>v+SHY);
  const cx=g.centre[0]+SHX, cy=g.centre[1]+SHY;
  const maxR=Math.hypot(xs[xs.length-1]-xs[0], ys[ys.length-1]-ys[0])/2;

  for(let i=0;i<xs.length-1;i++){
    for(let j=0;j<ys.length-1;j++){
      const x0=xs[i]+g.blockPad, x1=xs[i+1]-g.blockPad;
      const y0=ys[j]+g.blockPad, y1=ys[j+1]-g.blockPad;
      if(x1-x0<70||y1-y0<70) continue;

      const sides=[
        {ax:x0,ay:y0,bx:x1,by:y0,ix:0,iy:1},   // facing the street above
        {ax:x1,ay:y1,bx:x0,by:y1,ix:0,iy:-1},
        {ax:x0,ay:y1,bx:x0,by:y0,ix:1,iy:0},
        {ax:x1,ay:y0,bx:x1,by:y1,ix:-1,iy:0}
      ];
      for(const sd of sides){
        const L=Math.hypot(sd.bx-sd.ax, sd.by-sd.ay);
        const ux=(sd.bx-sd.ax)/L, uy=(sd.by-sd.ay)/L;
        let t=4+rnd()*22;
        while(t<L-60){
          const face=42+rnd()*58, depth=32+rnd()*28;
          if(t+face>L-10) break;
          const mx=sd.ax+ux*(t+face/2)+sd.ix*depth/2;
          const my=sd.ay+uy*(t+face/2)+sd.iy*depth/2;
          const core=1-Math.min(1,Math.hypot(mx-cx,my-cy)/maxR);
          const h=g.hmin+(g.hmax-g.hmin)*(0.18+0.82*core)*(0.35+Math.pow(rnd(),1.3)*0.65);
          pushBuilding({
            x:mx, y:my, ang:Math.atan2(uy,ux),
            w:(sd.ix?depth:face)/2, d:(sd.ix?face:depth)/2, h
          },rnd,null);
          t+=face+1+rnd()*4;   // a solid street wall, no wedge-sized gaps
        }
      }
    }
  }
}

let BGRID=null;
const BCELL=220, CAR_R=16;

function indexBuildings(){
  BGRID=new Map();
  for(const b of BUILDINGS){
    const r=Math.max(b.w,b.d)+CAR_R+4;
    for(let gx=Math.floor((b.x-r)/BCELL); gx<=Math.floor((b.x+r)/BCELL); gx++){
      for(let gy=Math.floor((b.y-r)/BCELL); gy<=Math.floor((b.y+r)/BCELL); gy++){
        const k=gx+":"+gy;
        let l=BGRID.get(k); if(!l){ l=[]; BGRID.set(k,l); }
        l.push(b);
      }
    }
  }
}

// Standalone patches of "corrupted" ground, unconnected to any prop — a
// handful of fixed points scattered across the map that flicker in place.
// They sit at the true terrain height so they still read as part of the
// (otherwise invisible) landscape, just visibly broken.
let GLITCH_PATCHES=[];
function buildGlitchPatches(seed){
  GLITCH_PATCHES=[];
  if(!CIRCUITS[pickedTrack].glitchy) return;
  const spec=CIRCUITS[pickedTrack].meadowScatter;
  const rnd=rng(seed*277123+53);

  let x0,y0,x1,y1;
  if(spec){
    x0=SHX+spec.area[0]; y0=SHY+spec.area[1]; x1=SHX+spec.area[2]; y1=SHY+spec.area[3];
  } else {
    // no scenery area defined for this circuit (a bare track like the
    // Skidpad) — frame the patches on the track's own footprint instead,
    // so any glitchy circuit gets them without needing scatter config
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for(const p of TRACK){
      minx=Math.min(minx,p.x); maxx=Math.max(maxx,p.x);
      miny=Math.min(miny,p.y); maxy=Math.max(maxy,p.y);
    }
    const pad=ROAD_W*1.5+150;
    x0=minx-pad; y0=miny-pad; x1=maxx+pad; y1=maxy+pad;
  }

  const count=spec?150:70;   // a lighter dusting on a bare track, matches its stripped-down feel
  for(let i=0;i<count;i++){
    const x=x0+rnd()*(x1-x0);
    const y=y0+rnd()*(y1-y0);
    GLITCH_PATCHES.push({x,y,z:(HILLS?hillZ(x,y):0)+0.4,
      size:18+rnd()*54, seed:rnd()*6.283185, big:rnd()<0.22});
  }
}

function buildCity(seed){
  BUILDINGS=[];
  if(CIRCUITS[pickedTrack].grid){ buildBlocks(seed); }
  else if(CIRCUITS[pickedTrack].meadow){ buildMeadow(seed); }
  else {
    const sc=CIRCUITS[pickedTrack].scenery;
    if(sc) buildSceneryStrip(seed,sc);
  }
  // independent of what kind of scenery (if any) a circuit has — a track
  // with no props at all, like the Skidpad, can still have the ground
  // itself glitch
  buildGlitchPatches(seed);
}

function buildSceneryStrip(seed,sc){
  const rnd=rng(seed*104729+17);

  for(let i=0;i<N;i+=sc.step){
    for(const side of [1,-1]){
      if(rnd()>sc.chance) continue;
      const p=TRACK[i];
      const off=ROAD_W/2+Math.max(sc.near,BARRIER?BOFF+50:0)+rnd()*sc.spread;
      const w=sc.wmin+rnd()*(sc.wmax-sc.wmin);
      const d=sc.wmin+rnd()*(sc.wmax-sc.wmin);
      const h=sc.hmin+Math.pow(rnd(),1.7)*(sc.hmax-sc.hmin);
      const cx=p.x+p.nx*side*off, cy=p.y+p.ny*side*off;

      const keep=ROAD_W/2+(BARRIER?BOFF:0)+Math.max(w,d)+18;
      let ok=true;
      for(let k=0;k<N;k+=3){
        const q=TRACK[k];
        if(Math.abs(q.x-cx)<keep&&Math.abs(q.y-cy)<keep&&Math.hypot(q.x-cx,q.y-cy)<keep){ ok=false; break; }
      }
      if(!ok) continue;

      const rows=Math.max(1,Math.min(8,Math.floor(h/34)));
      const win=[];
      for(let r=0;r<rows;r++) win.push(rnd()<sc.lit?1:0);
      BUILDINGS.push({x:cx, y:cy, ang:p.ang+(rnd()-0.5)*0.4,
                      w, d, h, z:p.z-3, tone:rnd(), win, rows,
                      glitchy:CIRCUITS[pickedTrack].glitchy&&rnd()<0.16});
    }
  }
}

// height of the road surface under a car, interpolated between points
function terrainAt(c){
  const p=TRACK[c.idx];
  let t=((c.x-p.x)*p.tx+(c.y-p.y)*p.ty)/SPACING;
  t=Math.max(-1,Math.min(1,t));
  const j=(c.idx+(t>=0?1:N-1))%N;
  const q=TRACK[j];
  const z0=p.z+(q.z-p.z)*Math.abs(t);
  const bank=(p.bank||0)+((q.bank||0)-(p.bank||0))*Math.abs(t);
  return z0-c.off*Math.tan(bank);        // the car sits on the banked surface, not just the centreline
}

function countCorners(pts){
  const M=pts.length; let corners=0,inC=false;
  for(let i=0;i<M;i++){
    const a=pts[i], b=pts[(i+18)%M], c=pts[(i+36)%M];
    let d=Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(b.y-a.y,b.x-a.x);
    while(d>Math.PI)d-=6.283185; while(d<-Math.PI)d+=6.283185;
    if(Math.abs(d)>0.30){ if(!inC){corners++;inC=true;} } else inC=false;
  }
  return corners;
}

function project(x,y,last){
  const win=140;
  let bi=last, bd=Infinity;
  for(let k=-win;k<=win;k++){
    const i=(last+k+N*2)%N;
    const dx=x-TRACK[i].x, dy=y-TRACK[i].y;
    const d=dx*dx+dy*dy;
    if(d<bd){bd=d;bi=i;}
  }
  const p=TRACK[bi];
  const off=(x-p.x)*p.nx+(y-p.y)*p.ny;   // signed distance, + = left
  return {idx:bi, off, dist:Math.sqrt(bd)};
}

function curvatureAhead(i, span){
  const a=TRACK[i].ang, b=TRACK[(i+span)%N].ang;
  let d=b-a;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  return Math.abs(d);
}

/* ────────────────────────────── static world render ────────────────────────────── */

function makeCanvas(w,h){
  const c=document.createElement("canvas"); c.width=w; c.height=h; return c;
}
let worldCv=null, marksCv=null, marksCtx=null, WSCALE=1;

function edgePoint(i,side,extra){
  const p=TRACK[i], k=side*(ROAD_W/2+extra);
  return [p.x+p.nx*k, p.y+p.ny*k];
}

function paintWorld(){
  const g=worldCv.getContext("2d");
  g.setTransform(WSCALE,0,0,WSCALE,0,0);
  // infield / runoff
  g.fillStyle=W2D_BG; g.fillRect(0,0,WORLD_W,WORLD_H);
  g.fillStyle=W2D_DOT;
  for(let i=0;i<2600;i++){
    const x=Math.random()*WORLD_W, y=Math.random()*WORLD_H;
    g.fillRect(x,y,Math.random()*3+1,Math.random()*3+1);
  }

  // sodium light pools along the circuit
  if(!DAY && !CIRCUITS[pickedTrack].concrete) for(let i=0;i<N;i+=44){
    const p=TRACK[i];
    const lx=p.x+p.nx*(ROAD_W/2+34), ly=p.y+p.ny*(ROAD_W/2+34);
    const grd=g.createRadialGradient(lx,ly,4,lx,ly,190);
    grd.addColorStop(0,"rgba(255,171,61,.20)");
    grd.addColorStop(.45,"rgba(255,150,50,.07)");
    grd.addColorStop(1,"rgba(255,150,50,0)");
    g.fillStyle=grd; g.beginPath(); g.arc(lx,ly,190,0,7); g.fill();
  }

  const path=new Path2D();
  path.moveTo(TRACK[0].x,TRACK[0].y);
  for(let i=1;i<N;i++) path.lineTo(TRACK[i].x,TRACK[i].y);
  path.closePath();

  g.lineJoin="round"; g.lineCap="round";
  g.strokeStyle=W2D_SHOULDER; g.lineWidth=ROAD_W+26; g.stroke(path);   // shoulder
  g.strokeStyle=W2D_ROAD; g.lineWidth=ROAD_W;    g.stroke(path);   // asphalt

  // asphalt grain
  g.save(); g.clip(path);
  for(let i=0;i<9000;i++){
    const x=Math.random()*WORLD_W, y=Math.random()*WORLD_H;
    g.fillStyle=Math.random()<.5?"rgba(255,255,255,.022)":"rgba(0,0,0,.14)";
    g.fillRect(x,y,2,2);
  }
  g.restore();

  // kerbs
  const step=9;
  g.lineWidth=9; g.lineCap="butt";
  for(let s=-1;s<=1;s+=2){
    for(let i=0;i<N;i+=step){
      const on=(Math.floor(i/step)%2)===0;
      g.strokeStyle=on?"#c8342b":"#e8e3d8";
      g.beginPath();
      const a=edgePoint(i,s,4);
      g.moveTo(a[0],a[1]);
      for(let k=1;k<=step;k++){
        const b=edgePoint((i+k)%N,s,4);
        g.lineTo(b[0],b[1]);
      }
      g.stroke();
    }
  }

  // centre dashes
  g.setLineDash([26,34]); g.lineWidth=2.5; g.strokeStyle="rgba(232,227,216,.18)";
  g.stroke(path); g.setLineDash([]);

  // ramps and dips, so they read from overhead too
  for(let i=0;i<N;i++){
    const ft=TRACK[i].feat; if(!ft) continue;
    const j=(i+1)%N;
    const a=edgePoint(i,1,0), b=edgePoint(j,1,0), c=edgePoint(j,-1,0), d=edgePoint(i,-1,0);
    g.fillStyle = ft===1
      ? ((Math.floor(i/4)%2)?"rgba(255,150,40,.55)":"rgba(64,57,48,.65)")
      : ft===3 ? ((Math.floor(i/5)%2)?"rgba(255,171,61,.6)":"rgba(40,44,52,.7)")
      : ft===4 ? "rgba(12,14,18,.72)"
      : "rgba(48,70,104,.5)";
    g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]);
    g.lineTo(c[0],c[1]); g.lineTo(d[0],d[1]); g.closePath(); g.fill();
  }

  // street network
  if(STREETS.length){
    for(const st of STREETS){
      g.lineCap="butt";
      g.strokeStyle="#3d4149"; g.lineWidth=(st.hw+20)*2;
      g.beginPath(); g.moveTo(st.ax,st.ay); g.lineTo(st.bx,st.by); g.stroke();
      g.strokeStyle=W2D_ROAD; g.lineWidth=st.hw*2;
      g.beginPath(); g.moveTo(st.ax,st.ay); g.lineTo(st.bx,st.by); g.stroke();
      g.setLineDash([22,30]); g.lineWidth=2.5; g.strokeStyle="rgba(232,227,216,.2)";
      g.beginPath(); g.moveTo(st.ax,st.ay); g.lineTo(st.bx,st.by); g.stroke();
      g.setLineDash([]);
    }
  }

  // terrain shading, so the overhead view shows the lie of the land
  if(HILLS){
    const cell=46;
    for(let yy=0;yy<WORLD_H;yy+=cell){
      for(let xx=0;xx<WORLD_W;xx+=cell){
        const z=hillZ(xx+cell/2,yy+cell/2);
        if(Math.abs(z)<1) continue;
        g.fillStyle = z>0 ? "rgba(255,171,61,"+Math.min(0.16,z/360)+")"
                          : "rgba(40,70,130,"+Math.min(0.22,-z/260)+")";
        g.fillRect(xx,yy,cell,cell);
      }
    }
  }

  // building footprints
  for(const b of BUILDINGS){
    g.save(); g.translate(b.x,b.y); g.rotate(b.ang);
    g.fillStyle="rgba(24,28,36,.95)";
    g.fillRect(-b.d,-b.w,b.d*2,b.w*2);
    g.fillStyle="rgba(255,171,61,"+(0.05+b.h/1400)+")";
    g.fillRect(-b.d+3,-b.w+3,b.d*2-6,b.w*2-6);
    g.restore();
  }

  // start / finish
  const p0=TRACK[0], cols=Math.floor(ROAD_W/16);
  for(let r=0;r<3;r++){
    for(let c=0;c<cols;c++){
      g.save();
      g.translate(p0.x+p0.tx*(r*16)+p0.nx*(ROAD_W/2-c*16-8),
                  p0.y+p0.ty*(r*16)+p0.ny*(ROAD_W/2-c*16-8));
      g.rotate(p0.ang);
      g.fillStyle=((r+c)%2)?"#e8e3d8":"#12161b";
      g.fillRect(-8,-8,16,16);
      g.restore();
    }
  }
}
function loadTrack(i){
  pickedTrack=i;
  const c=CIRCUITS[i];
  ROAD_W=c.width;

  // fresh copy so the world-space shift never accumulates
  const src=trackPoints(i);
  const b=bounds(src);
  const sc=c.scenery;
  const pad=Math.max(ROAD_W+90, ROAD_W/2+(sc?sc.near+sc.spread+sc.wmax+30:90));
  const shx=pad-b.minx, shy=pad-b.miny;
  SHX=shx; SHY=shy;
  TRACK=src.map(p=>({...p, x:p.x+shx, y:p.y+shy}));
  N=TRACK.length;
  TRACK_LEN=N*SPACING;
  WORLD_W=Math.ceil(b.w+pad*2);
  WORLD_H=Math.ceil(b.h+pad*2);

  URBAN=!!c.urban;
  BARRIER=!c.grid&&!c.noFence;   // open city and the skidpad are both unfenced
  DRAW=URBAN?190:270;
  buildStreets();
  buildHills(i+1);
  fitBarrier();
  buildElevation(i+1);
  buildCity(i+1);
  indexBuildings();
  buildLamps();

  WSCALE=Math.min(1,Math.sqrt(6.0e6/(WORLD_W*WORLD_H)));
  worldCv=makeCanvas(Math.ceil(WORLD_W*WSCALE),Math.ceil(WORLD_H*WSCALE));
  marksCv=makeCanvas(Math.ceil(WORLD_W*WSCALE),Math.ceil(WORLD_H*WSCALE));
  marksCtx=marksCv.getContext("2d");
  marksCtx.setTransform(WSCALE,0,0,WSCALE,0,0);   // draw in world units regardless
  paintWorld();
  setMinimapScale();

  const tn=document.getElementById("tname");
  if(tn) tn.textContent=c.name;
  cars=buildField();
  snapCam();
}

// player starts at the back of the grid; slot 0 is pole
function makeCar(slot, veh, driver, human, paceRef){
  const startIdx=(N - 90 - slot*46 + N)%N;
  const p=TRACK[startIdx];
  const lane=(slot%2===0? 1 : -1) * 30;
  const px=p.x+p.nx*lane, py=p.y+p.ny*lane;
  const pz=HILLS?hillZ(px,py):p.z;
  // AI pace is pulled toward the player's machine so the field stays racy
  // AI pace leans mostly on its own car's real stats now — a slow player
  // pick used to drag every AI down with it via paceRef; it still gets a
  // light nudge toward the player's pace so a wildly mismatched pairing
  // isn't unwinnable, but it no longer defines most of the AI's speed.
  const pace = human ? 1 : (0.97+Math.random()*0.06);
  const top  = human ? veh.maxSpeed : (veh.maxSpeed*0.85 + paceRef*0.15)*pace;
  return {
    slot, human, veh:veh.id, shape:veh.shape,
    name:driver, carName:veh.name,
    color:veh.color, accent:veh.accent, num:veh.num, rgb:hex2rgb(veh.color), arb:hex2rgb(veh.accent), spin:0,
    x:px, y:py,
    ang:p.ang,
    vx:0, vy:0, speed:0, slip:0,
    steer:0, av:0, crash:0, immune:0, stopT:0, roll:0, pitch:0,
    nitro:1, nitroActive:false, nitroT:0, nitroEmit:0,
    wheelForce:0, gas:false, braking:false, lockup:0,
    z:pz, vz:0, gz:pz, air:false, flying:false, spin:0,
    idx:startIdx, off:lane, offTrack:false,
    lap:0, lastLapT:null, bestLapT:null, lapStart:0,
    finished:false, finishT:0, place:slot+1,
    maxSpeed: top,
    accel: human ? veh.accel : veh.accel*0.96,
    grip: veh.grip,
    offGrip: veh.offGrip,
    turn: veh.turn||1,
    fourWS: !!veh.fourWS,
    pivot: !!veh.pivot,
    grounded: !!veh.grounded,
    lane: human ? 0 : (Math.random()*2-1)*Math.min(32,ROAD_W*0.20),
    lineStyle: human ? 0 : (Math.random()*2-1),
    lookMult: human ? 1 : 0.82+Math.random()*0.5,
    wobble: Math.random()*6.28,
    skidL:null, skidR:null
  };
}

let cars=[], state="menu", raceTime=0, countdown=3, finishOrder=[], particles=[], tick=0, hudGlitchUntil=0;
let pickedVeh=1;   // index into VEHICLES
let mode="race";   // "race" or "free"
const skid3d=[];   // recent tyre marks in world space, for the 3d pass

function buildField(){
  const mine=VEHICLES[pickedVeh];
  if(MP.on&&MP.racing){
    // multiplayer: the grid is exactly the roster the host started with,
    // in the same order on every machine. Slot 0 of the array is always
    // the local driver (the camera, HUD and audio all key on cars[0]).
    const me=mpMyPeer(), out=[];
    MP.roster.forEach((r,slot)=>{
      const mineCar=(r.p===me);
      const veh=mineCar?mine:(VEHICLES[r.v]||VEHICLES[0]);
      const c=makeCar(slot, veh, mineCar?"YOU":(r.n||"DRIVER"), mineCar, mine.maxSpeed);
      if(mineCar) out.unshift(c);
      else { c.remote=true; c.peer=r.p; out.push(c); }
    });
    return out.length?out:[ makeCar(0, mine, "YOU", true, mine.maxSpeed) ];
  }
  if(mode==="free") return [ makeCar(0, mine, "YOU", true, mine.maxSpeed) ];
  const pool=VEHICLES.filter((v,i)=>i!==pickedVeh).sort(()=>Math.random()-0.5).slice(0,3);
  const names=DRIVERS.slice().sort(()=>Math.random()-0.5);
  const field=[ makeCar(3, mine, "YOU", true, mine.maxSpeed) ];
  pool.forEach((v,i)=>field.push(makeCar(i, v, names[i], false, mine.maxSpeed)));
  return field;
}

function resetRace(){
  cars=buildField();
  raceTime=0; countdown=(mode==="free"?0.55:3.6); finishOrder=[]; particles=[]; tick=0; skid3d.length=0;
  lastBeepN=99;
  marksCtx.clearRect(0,0,WORLD_W,WORLD_H);
  snapCam();
  state="countdown";
}

const keys={};
const KEYMAP={ArrowUp:"gas",KeyW:"gas",ArrowDown:"brake",KeyS:"brake",
              ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",
              Space:"hand", KeyQ:"orbL", KeyE:"orbR",
              ShiftLeft:"nitro", ShiftRight:"nitro"};
addEventListener("pointerdown",ensureAudio,{once:true});
addEventListener("keydown",ensureAudio,{once:true});
addEventListener("keydown",e=>{
  if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")){
    if(e.code==="Enter"&&e.target.dataset.enter){ const b=el(e.target.dataset.enter); if(b) b.click(); }
    return;     // typing a name or room code is not driving
  }
  const playing=(state==="racing"||state==="countdown");
  if(KEYMAP[e.code]){ keys[KEYMAP[e.code]]=true; if(playing) e.preventDefault(); }
  if(e.code==="KeyR" && !MP.on && (state==="racing"||state==="countdown"||state==="paused")) resetRace();
  if(e.code==="Escape"||e.code==="KeyP"){
    if(state==="racing"||state==="countdown"){
      if(MP.on&&overlay.classList.contains("hidden")===false) mpResume(); else showPause();
    }
    else if(state==="paused") resume();
    else if(state==="garage") (MP.on?showLobby():showTracks());
    else if(state==="results") (MP.on?mpToLobby():showMenu());
    else if(state==="tracks") showMenu();
    else if(state==="lobby") (MP.on?mpLeave():showMenu());
    e.preventDefault();
  }
  if(MP.on) { /* no mid-race restarts, garage trips or mode swaps in a shared room */ }
  else {
  if(e.code==="KeyG" && (state==="racing"||state==="paused"||state==="results")) showGarage();
  if(e.code==="KeyT" && (state==="racing"||state==="paused"||state==="results")) showTracks();
  }
  if(!MP.on && e.code==="KeyF" && (state==="racing"||state==="paused"||state==="results")){
    mode=(mode==="free"?"race":"free"); resetRace();
  }
  if(e.code==="KeyN"){ cycleDayMode(); }
  if(e.code==="KeyC"){ camMode=(camMode+1)%5; el("cammode").textContent=CAMNAME[camMode]; }
});
addEventListener("keyup",e=>{
  if(KEYMAP[e.code]){
    keys[KEYMAP[e.code]]=false;
    if(state==="racing"||state==="countdown") e.preventDefault();
  }
});
